<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E5A8A">
<title>꺾은선 공작소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: 제도 공작실. 왼쪽 조수와 말풍선, 오른쪽 작업판과 해설. 바다·주황 색. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#E7EFF5; --panel:#FFFFFF; --panel2:#F1F6FA; --ink:#102331; --muted:#4A6070; --line:#C3D4E0;
  --sea:#0E5A8A; --sea-deep:#063C5F; --sea-ink:#FFFFFF;
  --tang:#B05806; --tang-deep:#833E04; --tang-ink:#FFFBF2;
  --paper:#FAFCFE; --grid:#D6E3EC; --ghost:#92A8B6;
  --good:#166B4C; --bad:#B33322; --star:#B07D11; --focus:#1550CE;
  --f-display:'Nanum Myeongjo','Apple SD Gothic Neo',serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --f-num:'Roboto Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1821; --panel:#16242F; --panel2:#1D2F3C; --ink:#E2EEF6; --muted:#9FB6C4; --line:#2C4252;
    --sea:#79C2F0; --sea-deep:#2E7FB4; --sea-ink:#06202E;
    --tang:#F0A555; --tang-deep:#A86A1C; --tang-ink:#2A1702;
    --paper:#122028; --grid:#273B49; --ghost:#55707F;
    --good:#5FD9A8; --bad:#FF8A72; --star:#F0C14B; --focus:#8FB8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1821; --panel:#16242F; --panel2:#1D2F3C; --ink:#E2EEF6; --muted:#9FB6C4; --line:#2C4252;
  --sea:#79C2F0; --sea-deep:#2E7FB4; --sea-ink:#06202E;
  --tang:#F0A555; --tang-deep:#A86A1C; --tang-ink:#2A1702;
  --paper:#122028; --grid:#273B49; --ghost:#55707F;
  --good:#5FD9A8; --bad:#FF8A72; --star:#F0C14B; --focus:#8FB8FF;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p{margin:0}
#app{height:100%;max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

.btn{min-height:56px;padding:0 22px;border-radius:11px;border:0;background:var(--sea);color:var(--sea-ink);font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--sea-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sea-deep)}
.btn.go{background:var(--tang);color:var(--tang-ink);box-shadow:0 4px 0 var(--tang-deep)}
.btn.go:active{box-shadow:0 1px 0 var(--tang-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn.ghost.on{background:var(--panel2);border-color:var(--tang);color:var(--tang)}
.btn.small{min-height:48px;font-size:16px;padding:0 14px}
.coins{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 7px;font-family:var(--f-num);font-weight:700;font-size:19px}
.coin{width:26px;height:26px;border-radius:50%;background:var(--star);border:4px solid var(--sea-deep);display:inline-block}
.bump{animation:bump .4s}

/* 홈 */
#home{overflow-y:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(29px,5.2vw,44px);line-height:1.25;text-wrap:balance}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--tang);letter-spacing:.05em}
.sub{color:var(--muted);margin-top:6px;max-width:38em;font-size:16px}
.head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note{margin-top:14px;background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--sea);border-radius:12px;padding:12px 15px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.note svg{width:76px;height:76px;flex:none;display:block}
.note .nt{min-width:0}
.note b{font-family:var(--f-display);font-weight:800;font-size:17px}
.note p{font-size:15px;color:var(--muted);margin-top:3px}
.badges{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}
.badge-i{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--ink)}
.badge-i svg{width:28px;height:28px;display:block}
.grouptitle{font-family:var(--f-display);font-weight:800;font-size:19px;margin-top:20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.grouptitle span{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:15px;margin-top:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:13px;min-width:0}
.ctop{display:flex;gap:13px;align-items:center}
.ico{flex:none;width:74px;height:74px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);border-radius:11px;overflow:hidden;padding:4px}
.ico svg{display:block;max-height:64px;max-width:100%;width:auto;height:auto}
.card h2{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.3}
.card p{color:var(--muted);font-size:14px}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.lv{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-height:96px;padding:10px 11px;border:2px solid var(--line);border-radius:11px;background:var(--panel2)}
.lv:active{transform:translateY(2px);border-color:var(--tang)}
.lv-n{font-weight:700;font-size:18px;line-height:1.1}
.lv-d{font-size:13px;color:var(--muted);line-height:1.3}
.stars{margin-top:auto;letter-spacing:2px;font-size:17px}
.st{color:var(--line)}.st.on{color:var(--star)}
.foot{color:var(--muted);font-size:14px;margin-block:18px 8px;max-width:52em}

/* 플레이 */
.bar{display:flex;align-items:center;gap:9px 12px;flex-wrap:wrap;padding-bottom:10px}
.bar-t{flex:1;min-width:120px;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25}
.bar-t small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.pips{display:flex;gap:6px}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.pip.cur{border-color:var(--ink);transform:scale(1.25)}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.miss{background:var(--tang);border-color:var(--tang)}
.qn{font-family:var(--f-num);color:var(--muted);font-size:14px}
.work{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;padding-bottom:14px}
@media (min-width:880px){.work{grid-template-columns:minmax(220px,27%) minmax(0,1fr)}}
.left{display:flex;gap:12px;align-items:flex-start}
@media (min-width:880px){.left{flex-direction:column}}
#face{flex:none;width:76px}
#face svg{display:block;width:100%;height:auto}
@media (min-width:880px){#face{width:104px;align-self:center}}
.bubble{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:13px;padding:12px 14px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;width:13px;height:13px;background:var(--panel);border-left:2px solid var(--line);border-bottom:2px solid var(--line);left:-8px;top:24px;transform:rotate(45deg)}
@media (min-width:880px){.bubble{width:100%;flex:none}.bubble::before{left:50%;top:-8px;margin-left:-7px;transform:rotate(135deg)}}
#say{font-weight:700;font-size:19px;line-height:1.45}
#fb{margin-top:5px;min-height:1.5em;font-size:16px;font-weight:700}
#fb.good{color:var(--good)}#fb.bad{color:var(--bad)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.board{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:13px;min-width:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tip{font-size:15px;color:var(--muted);text-align:center}

/* 그래프판 */
.gwrap{background:var(--paper);border:2px solid var(--line);border-radius:11px;padding:6px}
.lgc{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.lgc .axis{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:square}
.lgc .grid{stroke:var(--grid);stroke-width:1}
.lgc .ln{fill:none;stroke:var(--sea);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.lgc .ln.dim{stroke:var(--ghost);stroke-width:2.5}
.lgc .sg{fill:none;stroke:var(--tang);stroke-width:6;stroke-linecap:round}
.lgc .pt{fill:var(--paper);stroke:var(--sea);stroke-width:3}
.lgc .pt.hi{fill:var(--tang);stroke:var(--tang-deep)}
.lgc .guide{stroke:var(--tang);stroke-width:2;stroke-dasharray:5 4;fill:none}
.lgc .bar{fill:var(--sea);opacity:.7}
.lgc .wv{fill:none;stroke:var(--tang);stroke-width:2.5;stroke-linecap:round}
.lgc .lb{fill:var(--muted);font-family:var(--f-num);font-weight:500;font-size:13px}
.lgc .xl{fill:var(--muted);font-family:var(--f-body);font-size:13px}
.lgc .ttl{fill:var(--ink);font-family:var(--f-body);font-weight:700;font-size:15px}
.lgc .un{fill:var(--muted);font-family:var(--f-body);font-size:13px}
.lgc .dv{fill:var(--tang);font-family:var(--f-num);font-weight:700;font-size:13px}
.lgc .qm{fill:var(--bad);font-family:var(--f-num);font-weight:700;font-size:20px}
.lgc .cellmk{fill:none;stroke:var(--tang);stroke-width:2.5}
.lgc .nm{fill:var(--tang);font-family:var(--f-body);font-weight:700;font-size:16px}
.twin{display:flex;gap:10px;flex-wrap:wrap}
.twin .gwrap{flex:1 1 210px;min-width:0}
.twin .lgc{max-width:100%}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.choices.wide{grid-template-columns:minmax(0,1fr)}
.ch{min-height:82px;background:var(--panel2);border:3px solid var(--line);border-radius:12px;font-weight:700;font-size:clamp(17px,3.6vmin,23px);display:flex;align-items:center;justify-content:center;padding:10px 12px;line-height:1.35;text-align:center}
.choices.wide .ch{min-height:66px;font-size:clamp(16px,3vmin,19px)}
.ch:active{border-color:var(--tang);transform:translateY(2px)}
.ch.no{opacity:.42;border-style:dashed;border-color:var(--bad)}
.ch.yes{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pickrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pk{background:var(--panel2);border:3px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pk:active{border-color:var(--tang);transform:translateY(2px)}
.pk.no{opacity:.45;border-style:dashed;border-color:var(--bad)}
.pk.yes{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.pk .pnm{font-family:var(--f-display);font-weight:800;font-size:17px}
.pk .gwrap{width:100%}

/* 해설 */
.sol{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sol-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:800;font-size:19px}
.sol-h .pill{font-family:var(--f-body);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:13px;counter-reset:s}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sea);color:var(--sea-ink);font-weight:700;font-size:17px}
.step .sb{min-width:0}
.step h3{font-weight:700;font-size:17px;margin-bottom:2px}
.step p{font-size:16px;line-height:1.55}
.step b{color:var(--tang)}
.step .num{font-family:var(--f-num);font-weight:700}
.defbox{margin-top:8px;padding:10px 13px;border-radius:9px;background:var(--panel2);border:1px dashed var(--sea);font-size:15px}
.defbox b{color:var(--sea)}
.fig{margin-top:9px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.fig .gwrap{flex:1 1 100%}
.fig.half .gwrap{flex:1 1 210px}
.tbl{margin-top:9px;width:100%;border-collapse:collapse;font-size:14px;font-family:var(--f-num)}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 5px;text-align:center}
.tbl th{background:var(--panel2);font-weight:700;font-size:13px;font-family:var(--f-body)}
.tbl td.up{color:var(--bad);font-weight:700}
.tbl td.dn{color:var(--good);font-weight:700}
.tbl td.big{background:var(--panel2);font-weight:700}

/* 결과 */
#result{overflow-y:auto}
.res{max-width:640px;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.res-top{display:flex;align-items:center;gap:14px}
#rface{width:92px;flex:none}
#rface svg{display:block;width:100%;height:auto}
.bigstars{font-size:clamp(42px,10vw,62px);letter-spacing:5px;line-height:1}
.prize{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--star);border-radius:13px;padding:12px 14px}
.prize svg{width:56px;height:56px;flex:none;display:block}
.prize b{font-family:var(--f-display);font-weight:800;font-size:19px}
.rstats{display:flex;flex-direction:column;gap:3px;font-size:17px}
.rstats b{font-family:var(--f-num);font-weight:700;font-size:22px}
.review{display:flex;flex-direction:column;gap:8px}
.review h2{font-family:var(--f-display);font-weight:800;font-size:19px;margin-top:4px}
details.rv{border:2px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
details.rv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:10px 13px;min-height:56px;font-weight:700;font-size:16px}
details.rv>summary::-webkit-details-marker{display:none}
.rv-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.rv-q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-m{flex:none;font-size:19px}
.rv-m.ok{color:var(--good)}.rv-m.miss{color:var(--tang)}
.rv-open{flex:none;font-size:13px;font-weight:400;color:var(--muted)}
details.rv[open] .rv-open::after{content:"닫기"}
details.rv:not([open]) .rv-open::after{content:"해설"}
.rv-b{padding:0 13px 13px;border-top:2px solid var(--line);margin-top:2px;padding-top:12px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.shake{animation:shake .35s}
.pop{animation:rise .4s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 자료 표 */
.dtbl{width:100%;border-collapse:collapse;font-family:var(--f-num);font-weight:700;
  font-size:clamp(14px,3.2vmin,18px);background:var(--panel2);border:2px solid var(--line);border-radius:10px}
.dtbl th,.dtbl td{border:1px solid var(--line);padding:8px 3px;text-align:center}
.dtbl th{background:var(--panel);font-family:var(--f-body);font-weight:700;font-size:clamp(12px,2.7vmin,15px);white-space:nowrap}
.dtbl th.rowh{text-align:left;padding-inline:8px}
.dtbl td.mark{background:var(--tang);color:var(--tang-ink)}
.dtbl td.q{color:var(--bad)}
.tcap{font-weight:700;font-size:15px;margin-bottom:-4px}
.trio{display:flex;gap:10px;flex-wrap:wrap}
.trio .gwrap{flex:1 1 240px;min-width:0}
.trio .lgc{max-width:100%}
/* 점 찍기 */
.lgc .tgt{fill:var(--ghost);opacity:.5}
.lgc .hitp{fill:transparent;cursor:pointer}
.lgc .hitcol{fill:transparent;cursor:pointer}
.lgc .col{fill:var(--tang);opacity:.13}
.lgc .pt.put{fill:var(--tang);stroke:var(--tang-deep)}
.lgc .pt.bad{fill:var(--bad);stroke:var(--bad)}
.lgc .pt.want{fill:none;stroke:var(--good);stroke-width:3.5;stroke-dasharray:4 3}
.lgc .ln.put{stroke:var(--tang);stroke-dasharray:7 5}
.steplist{counter-reset:o;display:flex;flex-direction:column;gap:7px}
.steplist .o{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;align-items:center;font-size:clamp(15px,3vmin,17px)}
.steplist .o::before{counter-increment:o;content:counter(o);width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);font-family:var(--f-num);font-weight:700;font-size:14px}
.steplist .o.blank{font-weight:700;color:var(--bad)}
.steplist .o.blank::before{background:var(--tang);color:var(--tang-ink);border-color:var(--tang)}
</style>
<style>
/* 파일로 직접 열 때를 위한 기본값 (아티팩트에서는 플랫폼이 넣어 주는 부분) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="head">
      <div>
        <span class="tag">자료와 가능성 2편</span>
        <h1>꺾은선 공작소</h1>
        <p class="sub">이번에는 읽는 게 아니라 <b>직접 그려요.</b> 표를 보고 가로·세로를 정하고, 눈금 한 칸을 정하고, 모눈 위에 점을 콕콕 찍어 꺾은선그래프를 완성합니다. 4학년 자료와 가능성, 꺾은선그래프로 나타내기 단원입니다.</p>
      </div>
      <div class="head-r">
        <div class="coins" aria-label="코인"><span class="coin"></span><b id="coinHome">0</b></div>
        <button class="btn ghost small snd" type="button">소리 켜짐</button>
      </div>
    </div>
    <div class="note" id="note"></div>
    <div class="badges" id="badges"></div>
    <div id="groups"></div>

<script>
(function(){
'use strict';
// ==LOGIC-START==
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a};
function josaKo(s,w,o){
  var c=s.charCodeAt(s.length-1);
  if(c<0xAC00||c>0xD7A3) return o;
  return ((c-0xAC00)%28!==0)?w:o;
}
function EUN(x){return x+josaKo(x,'은','는')}
function IGA(x){return x+josaKo(x,'이','가')}
function GWA(x){return x+josaKo(x,'과','와')}
/* 단위는 읽는 말(도·센티미터·킬로그램…)에 따라 조사가 달라진다 */
var UNIT={
  '℃':{eul:'를',iyo:'예요',iga:'가'},
  'cm':{eul:'를',iyo:'예요',iga:'가'},
  'mm':{eul:'를',iyo:'예요',iga:'가'},
  '%':{eul:'를',iyo:'예요',iga:'가'},
  'kg':{eul:'을',iyo:'이에요',iga:'이'},
  '명':{eul:'을',iyo:'이에요',iga:'이'},
  '회':{eul:'를',iyo:'예요',iga:'가'}
};
function UIYO(u){return UNIT[u].iyo}
function UEUL(u){return UNIT[u].eul}
/* 틀린 답 후보 만들기. 반드시 끝난다 */
function distract(ans,cands,need,step){
  var seen=[ans],out=[],i;
  for(i=0;i<cands.length&&out.length<need;i++){
    var v=cands[i];
    if(v>0&&v===Math.round(v)&&seen.indexOf(v)<0){seen.push(v);out.push(v)}
  }
  var k=1;
  while(out.length<need&&k<400){
    var w=ans+k*(step||1);
    if(w>0&&seen.indexOf(w)<0){seen.push(w);out.push(w)}
    k++;
  }
  return out;
}

/* ---- 그래프 그리기 ---- */
var W=440,H=268,PX0=66,PX1=404,PY0=44,PY1=206;
function gbOf(D){return D.wave?PY1-24:PY1}
function cellOf(D){return (gbOf(D)-PY0)/D.n}
function yAt(D,v){return gbOf(D)-(v-D.lo)/D.step*cellOf(D)}
function gapOf(D){return (PX1-PX0)/D.xs.length}
function xAt(D,i){return PX0+(i+1)*gapOf(D)}
function topOf(D){return D.lo+D.step*D.n}
function f(x){return (Math.round(x*10)/10)}
function ln(cls,x1,y1,x2,y2){
  return '<line class="'+cls+'" x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(x2)+'" y2="'+f(y2)+'"/>';
}
function tx(cls,x,y,s,an){
  return '<text class="'+cls+'" x="'+f(x)+'" y="'+f(y)+'" text-anchor="'+(an||'middle')+'">'+s+'</text>';
}
function wavePath(x0,x1,y){
  var d='M'+f(x0)+' '+f(y),x;
  for(x=x0;x<x1;x+=16) d+=' q 4 -6 8 0 q 4 6 8 0';
  return '<path class="wv" d="'+d+'"/>';
}
function chart(D,o){
  o=o||{};
  var i,gb=gbOf(D),cell=cellOf(D),gap=gapOf(D);
  var h='<svg class="lgc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+D.t+' 꺾은선그래프">';
  /* 모눈 */
  for(i=0;i<=D.n;i++){
    var gy=yAt(D,D.lo+D.step*i);
    h+=ln('grid',PX0,gy,PX1,gy);
  }
  for(i=0;i<D.xs.length;i++) h+=ln('grid',xAt(D,i),PY0,xAt(D,i),PY1);
  /* 물결선 */
  if(D.wave) h+=wavePath(PX0-8,PX1+4,gb+13);
  /* 막대그래프로 보여 줄 때 */
  if(o.bars){
    var bw=gap*0.44;
    for(i=0;i<D.xs.length;i++){
      var by=yAt(D,D.ys[i]);
      h+='<rect class="bar" x="'+f(xAt(D,i)-bw/2)+'" y="'+f(by)+'" width="'+f(bw)+'" height="'+f(PY1-by)+'"/>';
    }
  }
  /* 찍을 자리 안내 (직접 그리는 문제) */
  var A,c2,vv,yy;
  if(o.hits) for(A=0;A<o.hits.length;A++){
    c2=xAt(D,o.hits[A]);
    h+='<rect class="col" x="'+f(c2-gap*0.38)+'" y="'+PY0+'" width="'+f(gap*0.76)+'" height="'+f(PY1-PY0)+'"/>';
    for(i=0;i<=D.n;i++) h+='<circle class="tgt" cx="'+f(c2)+'" cy="'+f(yAt(D,D.lo+D.step*i))+'" r="4"/>';
  }
  /* 어느 칸의 점을 그릴지 (only 가 있으면 그 칸만, placed 는 아이가 찍은 점) */
  var SET={},PUT={};
  if(o.only){ for(i=0;i<o.only.length;i++) SET[o.only[i]]=D.ys[o.only[i]] }
  else { for(i=0;i<D.xs.length;i++) SET[i]=D.ys[i] }
  if(o.placed) for(var pk in o.placed){ SET[+pk]=o.placed[pk]; PUT[+pk]=1 }
  /* 꺾은선 */
  if(!o.bars){
    for(i=0;i<D.xs.length-1;i++){
      if(SET[i]==null||SET[i+1]==null) continue;
      var put=(PUT[i]||PUT[i+1]);
      h+=ln('ln'+(put?' put':'')+(o.dim?' dim':''),xAt(D,i),yAt(D,SET[i]),xAt(D,i+1),yAt(D,SET[i+1]));
    }
    if(o.seg){
      var s0=o.seg[0],s1=o.seg[1];
      h+=ln('sg',xAt(D,s0),yAt(D,D.ys[s0]),xAt(D,s1),yAt(D,D.ys[s1]));
    }
  }
  /* 안내선 */
  if(o.guide!=null){
    var gx=xAt(D,o.guide),gy2=yAt(D,D.ys[o.guide]);
    h+=ln('guide',PX0,gy2,gx,gy2)+ln('guide',gx,gy2,gx,PY1);
  }
  if(o.hline!=null) h+=ln('guide',PX0,yAt(D,o.hline),PX1,yAt(D,o.hline));
  /* 한 칸 표시 */
  if(o.cellmk){
    var cx=PX0+17,y1=yAt(D,D.lo),y2=yAt(D,D.lo+D.step);
    h+=ln('cellmk',cx-7,y1,cx+7,y1)+ln('cellmk',cx-7,y2,cx+7,y2)+ln('cellmk',cx,y1,cx,y2);
    h+=tx('dv',cx+11,(y1+y2)/2+5,'한 칸','start');
  }
  /* 축 */
  h+='<path class="axis" d="M'+PX0+' '+PY0+' L'+PX0+' '+PY1+' L'+PX1+' '+PY1+'"/>';
  /* 구간별 변화량 */
  if(o.diffs){
    for(i=0;i<D.xs.length-1;i++){
      var d=D.ys[i+1]-D.ys[i];
      var ax1=xAt(D,i),ay1=yAt(D,D.ys[i]),ax2=xAt(D,i+1),ay2=yAt(D,D.ys[i+1]);
      var vx=ax2-ax1,vy=ay2-ay1,LL=Math.sqrt(vx*vx+vy*vy)||1;
      var nx=-vy/LL,ny=vx/LL;
      if(ny>0){nx=-nx;ny=-ny}            /* 글자는 늘 선분의 위쪽으로 */
      h+=tx('dv',(ax1+ax2)/2+nx*17,(ay1+ay2)/2+ny*17+4,(d>0?'+':'')+d);
    }
  }
  /* 바르게 찍어야 할 자리 (해설에서 보여 줄 때) */
  if(o.want) for(var wk in o.want)
    h+='<circle class="pt want" cx="'+f(xAt(D,+wk))+'" cy="'+f(yAt(D,o.want[wk]))+'" r="9"/>';
  /* 점 */
  if(!o.bars) for(i=0;i<D.xs.length;i++){
    if(SET[i]==null) continue;
    var hi=(o.hi===i), isbad=(o.badIdx===i), isput=!!PUT[i];
    h+='<circle class="pt'+(hi?' hi':'')+(isput?' put':'')+(isbad?' bad':'')
      +'" cx="'+f(xAt(D,i))+'" cy="'+f(yAt(D,SET[i]))+'" r="'+((hi||isbad)?6.5:5)+'"/>';
  }
  if(o.qm!=null) h+=tx('qm',xAt(D,o.qm),yAt(D,D.ys[o.qm])-13,'?');
  /* 눈금 숫자 */
  for(i=0;i<=D.n;i++) h+=tx('lb',PX0-8,yAt(D,D.lo+D.step*i)+5,String(D.lo+D.step*i),'end');
  if(D.wave) h+=tx('lb',PX0-8,PY1+5,'0','end');
  for(i=0;i<D.xs.length;i++) h+=tx('xl',xAt(D,i),PY1+19,D.xs[i]);
  /* 제목과 단위 */
  h+=tx('ttl',6,18,(D.pre||'')+D.t,'start');
  h+=tx('un',PX0-6,PY0-10,'('+D.u+')','end');
  h+=tx('xl',W-6,250,'('+D.xl+')','end');
  if(o.nm) h+=tx('nm',W-8,18,o.nm,'end');
  /* 누를 수 있는 자리는 가장 위에 깔아 둔다 */
  if(o.hits){
    var rr=Math.min(13,cellOf(D)/2);
    for(A=0;A<o.hits.length;A++){
      c2=o.hits[A];
      /* 칸 전체를 누를 수 있게 (손가락으로 찍기 쉽도록). 누른 높이에서 가장 가까운 눈금에 붙는다 */
      h+='<rect class="hitcol" data-c="'+c2+'" x="'+f(xAt(D,c2)-gap*0.46)+'" y="'+PY0
        +'" width="'+f(gap*0.92)+'" height="'+f(PY1-PY0)+'"/>';
      for(i=0;i<=D.n;i++){
        vv=D.lo+D.step*i;
        h+='<circle class="hitp" data-c="'+c2+'" data-v="'+vv+'" cx="'+f(xAt(D,c2))+'" cy="'+f(yAt(D,vv))
          +'" r="'+f(rr)+'" role="button" tabindex="0" aria-label="'+D.xs[c2]+' '+vv+' '+D.u+'"/>';
      }
    }
  }
  return h+'</svg>';
}
function gw(D,o){return '<div class="gwrap">'+chart(D,o)+'</div>'}
function figOne(D,o){return '<div class="fig">'+gw(D,o)+'</div>'}
function figTwo(a,b){return '<div class="fig half">'+a+b+'</div>'}

/* ---- 자료 ---- */
var SUBJ=[
  {t:'교실의 온도',m:'온도',u:'℃',xl:'시각',xs:['9시','10시','11시','12시','1시','2시'],
   pre:'오전 9시부터 오후 2시까지 ',steps:[1,2],zero:true,loR:[10,18],aH:'높은',aL:'낮은'},
  {t:'운동장의 기온',m:'기온',u:'℃',xl:'시각',xs:['9시','10시','11시','12시','1시','2시'],
   pre:'오전 9시부터 오후 2시까지 ',steps:[1,2],zero:true,loR:[8,16],aH:'높은',aL:'낮은'},
  {t:'강낭콩 싹의 키',m:'키',u:'cm',xl:'날짜',xs:['1일','3일','5일','7일','9일','11일'],
   pre:'',steps:[1,2],zero:true,loR:[4,10],aH:'큰',aL:'작은',grow:true},
  {t:'해바라기의 키',m:'키',u:'cm',xl:'날짜',xs:['5일','10일','15일','20일','25일','30일'],
   pre:'',steps:[5,10],zero:true,loR:[20,50],aH:'큰',aL:'작은',grow:true},
  {t:'물의 온도',m:'온도',u:'℃',xl:'시간',xs:['0분','2분','4분','6분','8분','10분'],
   pre:'',steps:[5,10],zero:true,loR:[20,40],aH:'높은',aL:'낮은',grow:true},
  {t:'민서의 몸무게',m:'몸무게',u:'kg',xl:'월',xs:['3월','4월','5월','6월','7월','8월'],
   pre:'',steps:[1,2],zero:false,loR:[28,34],aH:'무거운',aL:'가벼운'},
  {t:'교실의 습도',m:'습도',u:'%',xl:'시각',xs:['9시','10시','11시','12시','1시','2시'],
   pre:'오전 9시부터 오후 2시까지 ',steps:[5,10],zero:false,loR:[40,55],aH:'높은',aL:'낮은'},
  {t:'우리 지역의 강수량',m:'강수량',u:'mm',xl:'월',xs:['5월','6월','7월','8월','9월','10월'],
   pre:'',steps:[5,10],zero:true,loR:[30,60],aH:'많은',aL:'적은'},
  {t:'도서관 방문자 수',m:'방문자 수',u:'명',xl:'요일',xs:['월','화','수','목','금','토'],
   pre:'',steps:[5,10],zero:true,loR:[40,80],aH:'많은',aL:'적은'},
  {t:'윤호의 줄넘기 기록',m:'횟수',u:'회',xl:'회차',xs:['1회','2회','3회','4회','5회','6회'],
   pre:'',steps:[5,10],zero:true,loR:[30,60],aH:'많은',aL:'적은'}
];
/* 0 부터 n 까지의 칸 수열을 만든다. 조건을 못 맞추면 null 을 돌려주고 밖에서 다시 뽑는다 */
function walk(n,cols,o){
  o=o||{};
  var base=o.min1?1:0, tries,i,j,u,c;
  for(tries=0;tries<600;tries++){
    var a=[],okk=true;
    if(o.up){
      /* 자라는 자료(식물의 키 등)는 줄어들지 않게. 그대로 머무는 구간은 자연스럽다 */
      a.push(base);
      var room=n-base, nz=0;
      var cap=Math.max(1,Math.ceil(room/(cols-1)));
      for(i=1;i<cols;i++){
        var d=rnd(0,Math.min(cap+1,room));
        if(d>0){room-=d;nz++}
        a.push(a[i-1]+d);
      }
      if(nz<3) continue;
    }else{
      a.push(rnd(base,n));
      for(i=1;i<cols;i++){
        var d2=rnd(-3,3);
        if(!o.flat&&d2===0) d2=pick([-1,1]);
        var v=a[i-1]+d2;
        if(v<base||v>n){okk=false;break}
        a.push(v);
      }
      if(!okk) continue;
    }
    u={};c=0;
    for(j=0;j<a.length;j++) if(!u[a[j]]){u[a[j]]=1;c++}
    if(c<3) continue;
    if(o.pred&&!o.pred(a,n)) continue;
    return a;
  }
  return null;
}
function diffsOf(ys){var o=[],i;for(i=0;i<ys.length-1;i++)o.push(ys[i+1]-ys[i]);return o}
function countOf(arr,v){var c=0,i;for(i=0;i<arr.length;i++)if(arr[i]===v)c++;return c}
function uniqueMaxAbs(a){
  var d=diffsOf(a).map(Math.abs),mx=Math.max.apply(null,d);
  return mx>0&&countOf(d,mx)===1;
}
function uniqueMax(a){return countOf(a,Math.max.apply(null,a))===1}
function uniqueMin(a){return countOf(a,Math.min.apply(null,a))===1}
function hasUniqueValue(a){
  var i;
  for(i=0;i<a.length;i++) if(countOf(a,a[i])===1) return true;
  return false;
}
/* 자료 한 벌 만들기. 조건을 만족하는 수열이 나올 때까지 다시 뽑되 반드시 끝난다 */
function mkData(opt){
  opt=opt||{};
  var pool=SUBJ.filter(function(s){return opt.wave?true:s.zero});
  if(opt.noGrow) pool=pool.filter(function(s){return !s.grow});
  var round,S,cols,step,n,lo,a;
  for(round=0;round<60;round++){
    S=pick(pool);
    cols=opt.cols||pick([5,6]);
    var steps=S.steps.slice();
    if(opt.minStep) steps=steps.filter(function(x){return x>=opt.minStep});
    if(!steps.length) continue;
    if(opt.bigStep) steps=steps.filter(function(x){return x>=2}).concat(steps);
    step=pick(steps);
    n=opt.nMax?rnd(4,opt.nMax):rnd(4,6);
    lo=0;
    if(opt.wave){
      lo=Math.round(rnd(S.loR[0],S.loR[1])/step)*step;
      if(lo<step) lo=step;
      if(opt.loMin2&&lo<2*step) lo=2*step;
    }
    a=walk(n,cols,{pred:opt.pred,flat:opt.flat,up:!!S.grow,min1:!opt.wave});
    if(a) break;
  }
  if(!a){
    /* 안전망 : 어떤 조건에도 맞는 수열 한 벌 (가장 큰 변화·최댓값·최솟값이 모두 하나씩) */
    S=pool[0]||SUBJ[0];
    if(S.grow){
      var alt=pool.filter(function(x){return !x.grow});
      if(alt.length) S=alt[0];
    }
    cols=6;step=Math.max(opt.minStep||1,S.steps[S.steps.length-1]);n=6;
    lo=opt.wave?Math.max(2*step,Math.round(14/step)*step):0;
    /* 가장 큰 변화·최댓값·최솟값이 모두 하나씩이고, 0 칸과 n 칸을 모두 쓰는 수열 */
    a=[0,3,2,6,5,4];
  }
  var ys=a.map(function(k){return lo+step*k});
  return {t:S.t,pre:S.pre,m:S.m,u:S.u,xl:S.xl,xs:S.xs.slice(0,cols),ys:ys,a:a,
    lo:lo,step:step,n:n,wave:!!opt.wave,aH:S.aH,aL:S.aL,grow:!!S.grow};
}
function dkey(D){return D.t+D.step+'_'+D.lo+'_'+D.n+'_'+D.ys.join('.')}
/* 같은 자료를 0 부터 그린 그래프 (물결선 없이) */
function zeroVersion(D){
  var mx=Math.max.apply(null,D.ys),i;
  /* 한 칸이 원래 그래프보다 반드시 커야 0 부터 그린 쪽이 더 밋밋해 보인다 */
  var cand=[1,2,5,10,20,25,50,100].filter(function(x){return x>D.step});
  var st=cand[cand.length-1],nn;
  for(i=0;i<cand.length;i++){ if(Math.ceil(mx/cand[i])<=6){st=cand[i];break} }
  nn=Math.max(4,Math.ceil(mx/st));
  return {t:D.t,pre:D.pre,m:D.m,u:D.u,xl:D.xl,xs:D.xs,ys:D.ys,lo:0,step:st,n:nn,wave:false,aH:D.aH,aL:D.aL};
}


/* ---- 표 그리기 ---- */
function tableHTML(D,o){
  o=o||{};
  var i,h='<table class="dtbl"><tr><th>'+D.xl+'</th>';
  for(i=0;i<D.xs.length;i++) h+='<th>'+D.xs[i]+'</th>';
  h+='</tr><tr><th class="rowh">'+D.m+' ('+D.u+')</th>';
  for(i=0;i<D.xs.length;i++){
    var mk=(o.mark&&o.mark.indexOf(i)>=0);
    h+='<td'+(mk?' class="mark"':'')+'>'+D.ys[i]+'</td>';
  }
  return h+'</tr></table>';
}
function tableBlock(D,o){
  return '<div class="tcap">'+(D.pre||'')+D.t+'</div>'+tableHTML(D,o);
}
function figTable(D,o){return '<div class="fig"><div style="width:100%">'+tableBlock(D,o)+'</div></div>'}
/* 눈금 범위를 벗어나지 않는 '어긋난 칸 수' 후보 */
function deltaOpts(D,j){
  var o=[];
  if(D.a[j]+1<=D.n) o.push(1);
  if(D.a[j]-1>=0) o.push(-1);
  if(D.a[j]+2<=D.n) o.push(2);
  if(D.a[j]-2>=0) o.push(-2);
  return o;
}
/* 값 하나만 바꾼 그래프 (잘못 그린 그래프 만들기) */
function tweak(D,idx,delta){
  var ys=D.ys.slice();
  ys[idx]=ys[idx]+delta*D.step;
  var E={},k;
  for(k in D) E[k]=D[k];
  E.ys=ys;
  return E;
}

var DEF_DRAW='<div class="defbox">꺾은선그래프 그리는 차례 — ① 가로와 세로에 무엇을 나타낼지 정하기 ② <b>세로 눈금 한 칸의 크기</b> 정하기 ③ 가로와 세로가 만나는 자리에 <b>점 찍기</b> ④ 점들을 <b>선분으로 잇기</b> ⑤ 알맞은 <b>제목</b> 붙이기</div>';
var DEF_AXIS2='<div class="defbox">꺾은선그래프의 <b>가로</b>에는 시각·날짜처럼 <b>변해 가는 것</b>을, <b>세로</b>에는 <b>재어서 얻은 값</b>을 나타냅니다.</div>';
var DEF_SCALE='<div class="defbox">세로 눈금 한 칸의 크기는 <b>가장 큰 값이 들어가면서</b>, <b>칸이 너무 성기지 않게</b> 정해요. 한 칸이 너무 크면 꺾은선이 밋밋해져 변화가 잘 안 보입니다.</div>';
var DEF_WAVE2='<div class="defbox">값이 모두 큰 자료는 0부터 그리면 꺾은선이 위쪽에 몰려요. 이럴 때 아래쪽을 <b>물결선</b>으로 줄이고, <b>가장 작은 값이 들어가는 눈금</b>부터 시작합니다.</div>';
var DEF_POINT='<div class="defbox">점은 <b>가로 눈금에서 위로</b>, <b>세로 눈금에서 오른쪽으로</b> 가서 만나는 자리에 찍어요. 찍은 점은 빠짐없이 <b>선분으로 이어</b>야 꺾은선그래프가 됩니다.</div>';

var ORDER=[
  '가로와 세로에 무엇을 나타낼지 정한다',
  '세로 눈금 한 칸의 크기를 정한다',
  '가로 눈금과 세로 눈금이 만나는 자리에 점을 찍는다',
  '점들을 선분으로 잇는다',
  '알맞은 제목을 붙인다'
];
var OTHERM=['시각','날짜','월','요일','온도','키','몸무게','습도','강수량','방문자 수','횟수','학생 수','회차','시간','길이'];
var SYNON={'시각':['시간'],'시간':['시각'],'온도':['기온'],'기온':['온도'],'키':['길이'],'길이':['키']};
function axisPool(D,ans,other){
  var ban=[ans,other].concat(SYNON[ans]||[]).concat(SYNON[other]||[]);
  return OTHERM.filter(function(x){
    if(ban.indexOf(x)>=0) return false;
    var i;
    for(i=0;i<D.xs.length;i++) if(D.xs[i]===x||D.xs[i].indexOf(x)>=0) return false;
    return true;
  });
}
var CAND=[1,2,5,10,20];
function maxOf(a){return Math.max.apply(null,a)}
function minOf(a){return Math.min.apply(null,a)}
function cellsOf(D,v){return (v-D.lo)/D.step}

/* ---- 1. 그리기 준비 ---- */
function genPrep(lv){
  var q,D,i;
  if(lv===1){
    D=mkData({});
    var ax=pick(['x','y']);
    var ans=(ax==='x')?D.xl:D.m, other=(ax==='x')?D.m:D.xl;
    var w2=pick(axisPool(D,ans,other));
    q={type:'prep',sub:'axis',lv:lv,D:D,ax:ax,ans:ans,table:true,key:'qa'+ax+dkey(D)+w2};
    q.question='이 자료를 꺾은선그래프로 나타내려고 해요. <b>'+(ax==='x'?'가로':'세로')+'</b>에는 무엇을 나타내야 할까요?';
    q.label='가로와 세로에 나타낼 것 정하기';
    q.choices=shuffle([{t:ans,correct:true},{t:other,correct:false},{t:w2,correct:false}]);
    q.steps=[
      {t:'무엇을 어디에 둘까요',b:'<p>꺾은선그래프는 <b>시간이 흐르면서 변해 가는 모습</b>을 보여 줘요. 그래서 흘러가는 것을 가로에, 재어서 얻은 값을 세로에 둡니다.</p>'+DEF_AXIS2},
      {t:'표의 두 줄을 보면',b:'<p>표의 윗줄은 <b>'+D.xl+'</b>, 아랫줄은 <b>'+D.m+'</b>'+IGA(D.m)+' 적혀 있어요. '
        +'윗줄이 가로로, 아랫줄이 세로로 가면 됩니다.</p>'+figTable(D,{})},
      {t:'답',b:'<p>'+(ax==='x'?'가로':'세로')+'에는 <b>'+ans+'</b>'+josaKo(ans,'을','를')+' 나타내요. '
        +'다 그린 뒤에는 세로축 위에 <b>('+D.u+')</b>, 가로축 끝에 <b>('+D.xl+')</b>라고 적어 둡니다.</p>',
       fig:figOne(D,{}),reveal:true}
    ];
  }else if(lv===2){
    var k=rnd(0,ORDER.length-1);
    var bads=shuffle(ORDER.filter(function(_,j){return j!==k})).slice(0,2);
    q={type:'prep',sub:'order',lv:lv,k:k,order:true,
       key:'qo'+k+'_'+bads.map(function(x){return ORDER.indexOf(x)}).sort().join('')};
    q.question='꺾은선그래프를 그리는 차례예요. <b>'+(k+1)+'번째</b>에 들어갈 일은 무엇일까요?';
    q.label='그리는 차례 '+(k+1)+'번째';
    q.wide=true;
    q.ans=ORDER[k];
    q.choices=shuffle([{t:ORDER[k],correct:true}].concat(bads.map(function(x){return {t:x,correct:false}})));
    q.steps=[
      {t:'그리는 차례 외우기',b:'<p>그릴 것을 정하고 → 눈금을 정하고 → 점을 찍고 → 선으로 잇고 → 제목을 붙여요. 이 다섯 걸음이에요.</p>'+DEF_DRAW},
      {t:'왜 이 차례일까요',b:'<p>무엇을 나타낼지 정해야 <b>눈금</b>을 정할 수 있고, 눈금이 있어야 <b>점</b>을 찍을 수 있어요. '
        +'점이 다 찍혀야 <b>선</b>으로 이을 수 있고, 마지막에 <b>제목</b>을 붙이면 완성이에요.</p>'},
      {t:'답',b:'<p>'+(k+1)+'번째는 <b>'+ORDER[k]+'</b>예요.</p>'
        +'<div class="steplist">'+ORDER.map(function(x,j){
            return '<div class="o'+(j===k?' blank':'')+'">'+x+'</div>';
          }).join('')+'</div>',reveal:true}
    ];
  }else{
    D=mkData({wave:pick([false,true,true])});
    var idx=[];
    for(i=0;i<D.a.length;i++) if(D.a[i]>=1) idx.push(i);
    i=idx.length?pick(idx):0;
    var v=D.ys[i], cells=cellsOf(D,v);
    q={type:'prep',sub:'cells',lv:lv,D:D,i:i,ans:cells,table:true,blank:true,key:'qc'+dkey(D)+i};
    q.question='<b>'+D.xs[i]+'</b>의 점은 맨 아래 눈금에서 <b>몇 칸 위</b>에 찍어야 할까요?';
    q.label=D.xs[i]+'의 점은 몇 칸 위';
    q.choices=shuffle([{t:cells+'칸',correct:true}].concat(
      distract(cells,[cells+1,cells-1,v/D.step,cells+2],2)
        .map(function(x){return {t:x+'칸',correct:false}})));
    q.steps=[
      {t:'맨 아래 눈금부터 세요',b:'<p>점의 높이는 <b>맨 아래 눈금에서 몇 칸 올라갔는지</b>로 정해요. '
        +(D.wave?'물결선이 있으니 맨 아래는 <span class="num">0</span>이 아니라 <span class="num">'+D.lo+'</span>부터예요.'
                :'이 그래프는 맨 아래가 <span class="num">0</span>이에요.')+'</p>'+DEF_POINT},
      {t:'빼고 나누기',b:'<p>'+D.xs[i]+'의 값은 <span class="num">'+v+' '+D.u+'</span>, 한 칸은 <span class="num">'+D.step+' '+D.u+'</span>'+UIYO(D.u)+'.</p>'
        +'<p style="margin-top:6px">(<span class="num">'+v+' - '+D.lo+'</span>) ÷ <span class="num">'+D.step+'</span> = <span class="num">'+cells+'</span></p>',
       fig:figOne(D,{only:[],hits:[i]})},
      {t:'답',b:'<p>맨 아래 눈금에서 <b>'+cells+'칸</b> 위에 점을 찍어요.</p>',
       fig:figOne(D,{only:[i],hi:i,guide:i}),reveal:true}
    ];
  }
  return q;
}

/* ---- 2. 눈금 정하기 ---- */
function topIsMax(a){return maxOf(a)===a.length&&false}
function genScale(lv){
  var q,D,i;
  if(lv===1){
    /* 가장 큰 값이 꼭대기 눈금에 닿게 만들면, 더 작은 한 칸으로는 그릴 수 없어 답이 하나로 정해진다 */
    D=mkData({minStep:2,pred:function(a,n){return maxOf(a)===n}});
    var M=maxOf(D.ys), ci=CAND.indexOf(D.step);
    var small=(ci>0)?CAND[ci-1]:1, big=(ci<CAND.length-1)?CAND[ci+1]:D.step*2;
    q={type:'scale',sub:'cell',lv:lv,D:D,ans:D.step,table:true,key:'sc'+dkey(D)};
    q.question='세로 눈금이 <b>'+D.n+'칸</b>인 그래프에 그리려고 해요. 가장 큰 값까지 모두 나타내면서 변화가 가장 잘 보이려면 세로 눈금 <b>한 칸</b>을 몇 '+D.u+UEUL(D.u)+' 해야 할까요?';
    q.label='세로 눈금 한 칸의 크기 정하기';
    q.choices=shuffle([{t:D.step+' '+D.u,correct:true},
      {t:small+' '+D.u,correct:false},{t:big+' '+D.u,correct:false}]);
    q.steps=[
      {t:'가장 큰 값이 들어가야 해요',b:'<p>표에서 가장 큰 값은 <span class="num">'+M+' '+D.u+'</span>'+UIYO(D.u)+'. '
        +'한 칸의 크기에 칸 수를 곱한 값이 <b>'+M+'보다 작으면</b> 그 값을 그릴 수 없어요.</p>'+DEF_SCALE,
       fig:figTable(D,{mark:[D.ys.indexOf(M)]})},
      {t:'하나씩 따져 보기',b:'<p>'
        +'· 한 칸 <span class="num">'+small+'</span> → <span class="num">'+small+' × '+D.n+' = '+(small*D.n)+'</span> : '+M+'보다 작아서 <b>그릴 수 없어요</b><br>'
        +'· 한 칸 <span class="num">'+D.step+'</span> → <span class="num">'+D.step+' × '+D.n+' = '+(D.step*D.n)+'</span> : 딱 맞게 들어가요<br>'
        +'· 한 칸 <span class="num">'+big+'</span> → <span class="num">'+big+' × '+D.n+' = '+(big*D.n)+'</span> : 들어가긴 하지만 <b>칸이 성겨서</b> 변화가 잘 안 보여요</p>'},
      {t:'답',b:'<p>세로 눈금 한 칸은 <b>'+D.step+' '+D.u+'</b>로 정해요.</p>',
       fig:figOne(D,{}),reveal:true}
    ];
  }else if(lv===2){
    /* ㉮ 물결선이 필요한 자료, ㉯ 필요 없는 자료 */
    var A=null,B=null,g2;
    for(g2=0;g2<80&&!A;g2++){
      var c=mkData({wave:true,bigStep:true});
      var sp=maxOf(c.ys)-minOf(c.ys);
      if(sp>0&&minOf(c.ys)>=3*sp) A=c;
    }
    if(!A) A=mkData({wave:true,bigStep:true});
    for(g2=0;g2<80&&!B;g2++){
      var d2=mkData({});
      var sp2=maxOf(d2.ys)-minOf(d2.ys);
      if(sp2>0&&minOf(d2.ys)<=sp2) B=d2;
    }
    if(!B) B=mkData({});
    var aFirst=(rnd(0,1)===1);
    var P=aFirst?A:B, Q2=aFirst?B:A;
    q={type:'scale',sub:'need',lv:lv,A:A,B:B,P:P,Q:Q2,aFirst:aFirst,twinTable:true,
       key:'sn'+dkey(A)+'_'+dkey(B)+(aFirst?1:0)};
    q.question='두 자료를 꺾은선그래프로 나타내려고 해요. <b>물결선을 쓰는 것이 좋은</b> 자료는 어느 것일까요?';
    q.label='물결선이 필요한 자료 고르기';
    q.choices=shuffle([
      {t:'㉮ 자료',correct:aFirst},
      {t:'㉯ 자료',correct:!aFirst},
      {t:'둘 다 필요 없어요',correct:false}
    ]);
    q.steps=[
      {t:'언제 물결선을 쓸까요',b:'<p>값이 <b>모두 크고</b>, 값들끼리의 <b>차이는 작을 때</b> 물결선을 써요. 0부터 다 그리면 꺾은선이 위쪽에 몰려 밋밋해지거든요.</p>'+DEF_WAVE2},
      {t:'두 자료를 견주어 보기',b:'<p>'
        +'㉮ : 가장 작은 값 <span class="num">'+minOf(P.ys)+'</span>, 가장 큰 값 <span class="num">'+maxOf(P.ys)+'</span> → 값의 차이는 <span class="num">'+(maxOf(P.ys)-minOf(P.ys))+'</span><br>'
        +'㉯ : 가장 작은 값 <span class="num">'+minOf(Q2.ys)+'</span>, 가장 큰 값 <span class="num">'+maxOf(Q2.ys)+'</span> → 값의 차이는 <span class="num">'+(maxOf(Q2.ys)-minOf(Q2.ys))+'</span></p>'
        +'<p style="margin-top:6px">값이 모두 큰데 차이가 작은 쪽이 물결선이 필요한 자료예요.</p>'},
      {t:'답',b:'<p><b>'+(aFirst?'㉮':'㉯')+' 자료</b>에 물결선을 써요. '
        +'0부터 그린 것과 물결선을 쓴 것을 나란히 보면 차이가 분명해요.</p>',
       fig:figTwo(gw(zeroVersion(A),{nm:'0부터'}),gw(A,{nm:'물결선'})),reveal:true}
    ];
  }else{
    /* 맨 아래 눈금이 하나로 정해지도록 : 가장 작은 값이 첫 칸, 가장 큰 값이 꼭대기 칸 */
    D=mkData({wave:true,minStep:2,loMin2:true,
      pred:function(a,n){return minOf(a)===0&&maxOf(a)===n}});
    var lo=D.lo, s=D.step, mn=minOf(D.ys), mx=maxOf(D.ys);
    q={type:'scale',sub:'start',lv:lv,D:D,ans:lo,table:true,
       key:'ss'+dkey(D)};
    q.question='세로 눈금 한 칸을 <b>'+s+' '+D.u+'</b>로 하고 <b>'+D.n+'칸</b>을 그리려고 해요. 물결선 위 <b>맨 아래 눈금</b>을 몇으로 해야 할까요?';
    q.label='물결선 위 맨 아래 눈금 정하기';
    q.choices=shuffle([{t:String(lo),correct:true},
      {t:String(lo-s),correct:false},{t:String(lo+s),correct:false}]);
    q.steps=[
      {t:'가장 작은 값과 가장 큰 값',b:'<p>표에서 가장 작은 값은 <span class="num">'+mn+' '+D.u+'</span>, 가장 큰 값은 <span class="num">'+mx+' '+D.u+'</span>'+UIYO(D.u)+'. '
        +'<b>이 둘이 모두 들어가야</b> 합니다.</p>'+DEF_WAVE2,
       fig:figTable(D,{mark:[D.ys.indexOf(mn),D.ys.indexOf(mx)]})},
      {t:'하나씩 따져 보기',b:'<p>'
        +'· <span class="num">'+(lo-s)+'</span>부터 → 꼭대기가 <span class="num">'+((lo-s)+s*D.n)+'</span>이라 가장 큰 값 <span class="num">'+mx+'</span>'+IGA(String(mx))+' <b>안 들어가요</b><br>'
        +'· <span class="num">'+lo+'</span>부터 → 꼭대기가 <span class="num">'+(lo+s*D.n)+'</span>, 가장 작은 값도 가장 큰 값도 <b>딱 들어가요</b><br>'
        +'· <span class="num">'+(lo+s)+'</span>부터 → 가장 작은 값 <span class="num">'+mn+'</span>'+IGA(String(mn))+' 눈금 아래로 내려가 <b>그릴 수 없어요</b></p>'},
      {t:'답',b:'<p>맨 아래 눈금은 <b>'+lo+'</b>으로 하고, 그 아래는 물결선으로 줄여요.</p>',
       fig:figOne(D,{}),reveal:true}
    ];
  }
  return q;
}

/* ---- 3. 점 찍어 그리기 ---- */
function genPlot(lv){
  var D,targets,i;
  if(lv===1){ D=mkData({nMax:5}); targets=1 }
  else if(lv===2){ D=mkData({nMax:5,bigStep:true}); targets=2 }
  else { D=mkData({wave:true,nMax:5,bigStep:true}); targets=2 }
  var idx=shuffle(D.xs.map(function(_,k){return k})).slice(0,targets).sort(function(a,b){return a-b});
  var given=[];
  for(i=0;i<D.xs.length;i++) if(idx.indexOf(i)<0) given.push(i);
  var q={type:'plot',lv:lv,D:D,idx:idx,given:given,table:true,plot:true,
    key:'pl'+dkey(D)+'_'+idx.join('')};
  q.question='표를 보고 <b>'+idx.map(function(k){return D.xs[k]}).join('</b>, <b>')+'</b>의 점을 찍어 그래프를 완성해 주세요.';

function genCheck(lv){
  var q,D,i,j,delta,W2;
  if(lv===2){
    D=mkData({bigStep:true});
    j=rnd(0,D.xs.length-1);
    delta=pick(deltaOpts(D,j));
    W2=tweak(D,j,delta);
    var okFirst=(rnd(0,1)===1);
    q={type:'check',sub:'which',lv:lv,D:D,bad:W2,j:j,okFirst:okFirst,table:true,twinGraph:true,
       P:okFirst?D:W2,Q:okFirst?W2:D,key:'cw'+dkey(D)+j+delta+(okFirst?1:0)};
    q.question='표를 보고 그린 그래프예요. <b>바르게 그린</b> 것은 어느 것일까요?';
    q.label='바르게 그린 그래프 고르기';
    q.wide=true;
    q.choices=shuffle([
      {t:'㉮ 그래프',correct:okFirst},
      {t:'㉯ 그래프',correct:!okFirst},
      {t:'둘 다 틀렸어요',correct:false}
    ]);
    q.steps=[
      {t:'표와 하나씩 맞춰 봐요',b:'<p>그래프가 맞는지 보려면 <b>표의 값과 점의 높이를 하나씩</b> 견주어야 해요. 한 군데만 달라도 틀린 그래프예요.</p>'+DEF_POINT,
       fig:figTable(D,{mark:[j]})},
      {t:'다른 곳 찾기',b:'<p><b>'+D.xs[j]+'</b>'+josaKo(D.xs[j],'을','를')+' 보세요. 표에는 <span class="num">'+D.ys[j]+' '+D.u+'</span>인데, '
        +'틀린 그래프에는 <span class="num">'+W2.ys[j]+' '+D.u+'</span> 자리에 점이 찍혀 있어요. '
        +'<b>'+Math.abs(delta)+'칸</b> '+(delta>0?'위로':'아래로')+' 잘못 찍힌 거예요.</p>'},
      {t:'답',b:'<p><b>'+(okFirst?'㉮':'㉯')+' 그래프</b>가 바르게 그린 것이에요.</p>',
       fig:figTwo(gw(D,{nm:'바른 그래프'}),gw(W2,{nm:'틀린 그래프',badIdx:j})),reveal:true}
    ];
    return q;
  }
  D=(lv===1)?mkData({}):mkData({wave:true,bigStep:true});
  j=rnd(0,D.xs.length-1);
  delta=pick(deltaOpts(D,j));
  W2=tweak(D,j,delta);
  var others=shuffle(D.xs.filter(function(_,k){return k!==j})).slice(0,2);
  q={type:'check',sub:'spot',lv:lv,D:D,bad:W2,j:j,delta:delta,table:true,badGraph:true,
     key:'cs'+dkey(D)+j+delta};
  q.question='표를 보고 그렸는데 한 군데를 틀렸어요. <b>잘못 찍은 점</b>은 어느 때의 점일까요?';
  q.label='잘못 찍은 점 찾기';
  q.choices=shuffle([{t:D.xs[j],correct:true}].concat(others.map(function(x){return {t:x,correct:false}})));
  q.steps=[
    {t:'표와 그래프를 하나씩',b:'<p>왼쪽부터 차례로 <b>표의 값</b>과 <b>점의 높이</b>를 견주어 봐요. 한 칸이 <span class="num">'+D.step+' '+D.u+'</span>'+UIYO(D.u)+'.</p>'+DEF_POINT},
    {t:'칸 수로 세어 보기',b:'<p>'+D.xs.map(function(x,k){
        return x+' : 표는 <span class="num">'+D.ys[k]+'</span>, 그래프는 <span class="num">'+W2.ys[k]+'</span>'
          +(k===j?' → <b>달라요!</b>':' → 같아요');
      }).join('<br>')+'</p>'+figTable(D,{mark:[j]})},
    {t:'답',b:'<p><b>'+D.xs[j]+'</b>의 점이 <b>'+Math.abs(delta)+'칸</b> '+(delta>0?'위로':'아래로')+' 잘못 찍혔어요. '
      +'<span class="num">'+W2.ys[j]+'</span>이 아니라 <span class="num">'+D.ys[j]+'</span> 자리에 찍어야 해요.</p>',
     fig:figTwo(gw(W2,{nm:'틀린 그래프',badIdx:j}),gw(D,{nm:'바른 그래프',hi:j})),reveal:true}
  ];
  return q;
}

var AC=null;
function tone(seq){
  if(!save.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t0=AC.currentTime;
    seq.forEach(function(s){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=s[0];
      g.gain.setValueAtTime(0.0001,t0+s[1]);
      g.gain.exponentialRampToValueAtTime(0.14,t0+s[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+s[1]+s[2]);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+s[1]);o.stop(t0+s[1]+s[2]+0.05);
    });
  }catch(e){}
}

  var q=G.q;
  if(q.plot){
    $('#board').innerHTML='<div>'+tableBlock(q.D,{mark:q.idx})+'</div>'
      +gw(q.D,{want:q.want})
      +'<div class="tip">초록 동그라미가 바르게 찍어야 할 자리예요.</div>';
  }else{
    $$('#board .ch').forEach(function(b,i){
      var ok=!!(q.choices[i]&&q.choices[i].correct);
      b.classList.toggle('yes',ok); if(!ok) b.classList.add('no'); b.disabled=true;
    });
  }
  $('#check').hidden=true;$('#hintBtn').hidden=true;
  var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 문제';
}

function answer(ok,btn){
  if(G.done) return;
  if(ok){
    G.done=true;
    var firstTry=(G.wrong===0),gain=0;
    if(firstTry){G.first++;G.streak++;gain=10+(G.streak>=3?5:0);G.results[G.i]='ok'}
    else{G.streak=0;G.results[G.i]='miss'}
    G.earned+=gain;save.coins+=gain;persist();
    setFace('happy');
    fb(GOOD[rnd(0,GOOD.length-1)]+(gain?'  +'+gain+' 코인':''),'good');
    tone(SND.good);
    if(btn) btn.classList.add('yes');
    $$('#board .ch').forEach(function(b){
      b.disabled=true;
      if(btn&&b!==btn&&!b.classList.contains('yes')) b.classList.add('no');
    });
    if(G.q.plot) $$('#board .hitp').forEach(function(e){e.remove()});
    renderSol(true,true);
    $('#sol').classList.remove('pop');void $('#sol').offsetWidth;$('#sol').classList.add('pop');
    $('#check').hidden=true;$('#hintBtn').hidden=true;
    var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 문제';
    var cw=$('#coinPlay').parentNode;cw.classList.remove('bump');void cw.offsetWidth;cw.classList.add('bump');
    paintCoins();renderPips();
    G.log[G.i]={label:G.q.label,ok:firstTry,steps:G.q.steps};
  }else{
    G.wrong++;G.streak=0;G.results[G.i]='miss';
    setFace('oops');
    fb(OOPS[rnd(0,OOPS.length-1)],'bad');
    tone(SND.bad);
    if(btn){btn.classList.add('no');btn.disabled=true;btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake')}
    if(G.wrong>=2){
      G.done=true;
      fb('같이 풀어 봐요. 아래 해설을 보세요.','bad');
      reveal();
      G.log[G.i]={label:G.q.label,ok:false,steps:G.q.steps};
    }else renderSol(false,false);
    renderPips();
  }
}

$('#groups').addEventListener('click',function(e){
  var b=e.target.closest('.lv');if(!b) return;
  startGame(b.getAttribute('data-mode'),+b.getAttribute('data-lv'));
});
function tapDot(el){
  var c=+el.getAttribute('data-c'), v=+el.getAttribute('data-v');
  G.placed[c]=v;
  renderQ();tone(SND.dot);
}
/* 칸 아무 데나 눌러도 가장 가까운 눈금에 점이 붙는다 */
function tapCol(el,ev){
  var svg=el.ownerSVGElement;
  if(!svg||ev.clientY==null) return;
  var box=svg.getBoundingClientRect();
  if(!box.height) return;
  var D=G.q.D, vh=svg.viewBox.baseVal.height||268;
  var y=(ev.clientY-box.top)/box.height*vh;
  var k=Math.round((gbOf(D)-y)/cellOf(D));
  if(k<0) k=0;
  if(k>D.n) k=D.n;
  G.placed[+el.getAttribute('data-c')]=D.lo+D.step*k;
  renderQ();tone(SND.dot);
}
$('#board').addEventListener('click',function(e){
  if(!G) return;
  if(e.target.closest('#tool')){G.placed={};renderQ();tone(SND.tap);return}
  if(G.done) return;
  var dot=e.target.closest('.hitp');
  if(dot){tapDot(dot);return}
  var col=e.target.closest('.hitcol');
  if(col){tapCol(col,e);return}
  var ch=e.target.closest('.ch');
  if(ch&&!ch.disabled&&G.q.choices) answer(!!G.q.choices[+ch.getAttribute('data-ans')].correct,ch);
});
$('#board').addEventListener('keydown',function(e){
  if(!G||G.done) return;
  if(e.key!=='Enter'&&e.key!==' ') return;
  var dot=e.target.closest('.hitp');
  if(!dot) return;
  e.preventDefault();tapDot(dot);
});
$('#check').addEventListener('click',function(){
  if(!G||G.done||!G.q.plot) return;
  var q=G.q,i,all=true;
  for(i=0;i<q.idx.length;i++) if(G.placed[q.idx[i]]==null) all=false;
  if(!all){ fb('아직 다 찍지 않았어요. 흐린 점을 눌러 보세요.','bad'); tone(SND.tap); return }
  var ok=true;
  for(i=0;i<q.idx.length;i++) if(G.placed[q.idx[i]]!==q.D.ys[q.idx[i]]) ok=false;
  answer(ok,null);
});
$('#hintBtn').addEventListener('click',function(){
  if(!G||G.done) return;
  renderSol(false,false);
  $('#sol').scrollIntoView({block:'nearest',behavior:'smooth'});
});
$('#next').addEventListener('click',function(){
  if(G.i+1>=G.total){finish();return}
  G.i++;nextQ();
});

function finish(){
  var f=G.first,s=f>=7?3:(f>=5?2:1),bonus=0;
  if(s===3){bonus=20;save.coins+=bonus;G.earned+=bonus}
  var k=G.mode+G.lv;
  save.stars[k]=Math.max(save.stars[k]||0,s);
  var key=s===3?'gold':(s===2?'silver':'bronze');
  save.seals[key]=(save.seals[key]||0)+1;
  persist();
  $('#rTitle').textContent=s===3?'제도사 1급!':(s===2?'솜씨가 늘었어요!':'좋은 출발이에요!');
  $('#rMsg').textContent=s===3?'거의 다 첫 번에 맞혔어요. 다음 단계도 할 수 있어요.'
    :(s===2?'별 3개는 첫 번에 7문제를 맞히면 받아요.':'틀린 문제는 아래에서 해설을 다시 보면 쉬워져요.');
  $('#rStars').innerHTML=starsHTML(s);
  $('#rStars').setAttribute('aria-label','별 '+s+'개');
  $('#prize').innerHTML=sealSVG(key)+'<div><b>'+SEAL[key].n+'</b> 획득! <br><span style="color:var(--muted);font-size:15px">지금까지 '+save.seals[key]+'개</span></div>';
  $('#rFirst').textContent=f+' / '+G.total;
  $('#rCoins').textContent='+'+G.earned+(bonus?' (제도 보너스 +20 포함)':'');
  $('#rface').innerHTML=pencil('happy');
  $('#nextLv').hidden=!(s>=2&&G.lv<3);
  $('#rList').innerHTML=G.log.map(function(e,i){
    if(!e) return '';
    return '<details class="rv"><summary><span class="rv-n">'+(i+1)+'</span><span class="rv-q">'+e.label+'</span>'
      +'<span class="rv-m '+(e.ok?'ok':'miss')+'">'+(e.ok?'○':'✕')+'</span><span class="rv-open"></span></summary>'
      +'<div class="rv-b">'+stepsHTML(e.steps)+'</div></details>';
  }).join('');
  tone(SND.win);
  show('result');
}

$('#back').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#toHome').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#again').addEventListener('click',function(){startGame(G.mode,G.lv)});
$('#nextLv').addEventListener('click',function(){startGame(G.mode,G.lv+1)});
$$('.snd').forEach(function(b){b.addEventListener('click',function(){save.sound=!save.sound;persist();paintSound();if(save.sound)tone(SND.tap)})});

renderHome();show('home');
})();
</script>
