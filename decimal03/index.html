<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E7EDEF">
<title>소수 로켓 연료소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 연료소 관제실. 왼쪽에 로켓과 말풍선, 오른쪽에 연료 탱크·세로셈판 같은 도구와 그 아래 해설. 좁은 화면에서는 위아래로 쌓음. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#E7EDEF; --panel:#FFFFFF; --panel2:#F2F7F8; --ink:#0E1F26; --muted:#52707C; --line:#C0D2D8;
  --teal:#0B7A80; --teal-deep:#055054; --teal-ink:#FFFFFF;
  --flame:#DD5F26; --flame-deep:#A33E0F; --flame-ink:#FFFFFF;
  --tank1:#0B7A80; --tank2:#2E9FA4; --tank3:#7CC9CB; --metal:#9FB4BC;
  --good:#0C7050; --bad:#B93A22; --star:#CE9512; --focus:#1550CE;
  --comet:#D9A017; --planet:#8FA8B8; --moon:#B5825A;
  --f-display:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --f-num:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C171C; --panel:#14242B; --panel2:#1A2E36; --ink:#E4EDF0; --muted:#95B0BA; --line:#294149;
    --teal:#39BFC4; --teal-deep:#1C7D81; --teal-ink:#04191B;
    --flame:#FF8349; --flame-deep:#C25423; --flame-ink:#2A0E03;
    --tank1:#39BFC4; --tank2:#2B8F94; --tank3:#1F666A; --metal:#5C7884;
    --good:#4FD2A2; --bad:#FF8A72; --star:#F0C14B; --focus:#8FB8FF;
    --comet:#F0C14B; --planet:#A9C0CE; --moon:#CE9A6F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C171C; --panel:#14242B; --panel2:#1A2E36; --ink:#E4EDF0; --muted:#95B0BA; --line:#294149;
  --teal:#39BFC4; --teal-deep:#1C7D81; --teal-ink:#04191B;
  --flame:#FF8349; --flame-deep:#C25423; --flame-ink:#2A0E03;
  --tank1:#39BFC4; --tank2:#2B8F94; --tank3:#1F666A; --metal:#5C7884;
  --good:#4FD2A2; --bad:#FF8A72; --star:#F0C14B; --focus:#8FB8FF;
  --comet:#F0C14B; --planet:#A9C0CE; --moon:#CE9A6F;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p,table{margin:0}
#app{height:100%;max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* 버튼 */
.btn{min-height:56px;padding:0 22px;border-radius:12px;border:0;background:var(--teal);color:var(--teal-ink);font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--teal-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-deep)}
.btn.go{background:var(--flame);color:var(--flame-ink);box-shadow:0 4px 0 var(--flame-deep)}
.btn.go:active{box-shadow:0 1px 0 var(--flame-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn.ghost[disabled]{opacity:.35;cursor:default;transform:none}
.btn.small{min-height:48px;font-size:16px;padding:0 14px}
.coins{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 7px;font-family:var(--f-num);font-weight:700;font-size:19px}
.coin{width:26px;height:26px;border-radius:50%;background:var(--star);border:4px solid var(--flame-deep);display:inline-block}
.bump{animation:bump .4s}

/* 홈 */
#home{overflow-y:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(29px,5.2vw,44px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--flame);letter-spacing:.06em}
.sub{color:var(--muted);margin-top:6px;max-width:37em;font-size:16px}
.head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badges{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-top:14px;flex-wrap:wrap}
.badges-t{font-weight:700;font-size:15px;color:var(--muted)}
.badge-i{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:700;font-size:18px}
.badge-i svg{width:32px;height:32px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-top{display:flex;gap:14px;align-items:center}
.card-top>div:last-child{min-width:0}
.ico{flex:none;width:76px;height:76px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:12px;overflow:hidden;padding:6px}
.ico svg{display:block;max-height:62px;max-width:100%;width:auto;height:auto}
.card h2{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.25}
.card p{color:var(--muted);font-size:15px}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px}
.lv{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-height:98px;padding:10px 11px;border:2px solid var(--line);border-radius:12px;background:var(--panel2)}
.lv:active{transform:translateY(2px);border-color:var(--flame)}
.lv-n{font-weight:700;font-size:18px;line-height:1.1}
.lv-d{font-size:13px;color:var(--muted);line-height:1.3}
.stars{margin-top:auto;letter-spacing:2px;font-size:17px}
.st{color:var(--line)}.st.on{color:var(--star)}
.foot{color:var(--muted);font-size:14px;margin-block:18px 8px;max-width:50em}

/* 플레이 */
.bar{display:flex;align-items:center;gap:9px 12px;flex-wrap:wrap;padding-bottom:10px}
.bar-t{flex:1;min-width:120px;font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.2}
.bar-t small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.pips{display:flex;gap:6px}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.pip.cur{border-color:var(--ink);transform:scale(1.25)}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.miss{background:var(--flame);border-color:var(--flame)}
.qn{font-family:var(--f-num);color:var(--muted);font-size:14px}
.work{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;padding-bottom:14px}
@media (min-width:880px){.work{grid-template-columns:minmax(230px,28%) minmax(0,1fr)}}
.left{display:flex;gap:12px;align-items:flex-start}
@media (min-width:880px){.left{flex-direction:column}}
#face{flex:none;width:78px}
#face svg{display:block;width:100%;height:auto}
@media (min-width:880px){#face{width:116px;align-self:center}}
.bubble{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;width:13px;height:13px;background:var(--panel);border-left:2px solid var(--line);border-bottom:2px solid var(--line);left:-8px;top:24px;transform:rotate(45deg)}
@media (min-width:880px){.bubble{width:100%;flex:none}.bubble::before{left:50%;top:-8px;margin-left:-7px;transform:rotate(135deg)}}
#say{font-weight:700;font-size:19px;line-height:1.45}
#fb{margin-top:5px;min-height:1.5em;font-size:16px;font-weight:700}
#fb.good{color:var(--good)}#fb.bad{color:var(--bad)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.deck{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.slip{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;border:2px dashed var(--flame);border-radius:10px;padding:11px 15px;background:var(--panel2)}
.slip-l{font-size:14px;font-weight:700;color:var(--muted);line-height:1.3}
.slip-l b{display:block;font-size:18px;color:var(--flame)}
.slip-v{font-family:var(--f-num);font-weight:700;font-size:clamp(25px,5.6vmin,40px);line-height:1.1;min-width:0}
.slip-v .q{color:var(--flame)}
.slip-v .u{font-size:.55em;color:var(--muted);margin-left:.15em}

/* 연료 탱크 */
.tanks{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.tgroup{flex:1 1 150px;min-width:0;border:2px solid var(--line);border-radius:10px;padding:9px;background:var(--panel2);display:flex;flex-direction:column;gap:7px}
.tgroup.short{box-shadow:0 0 0 2px var(--flame) inset}
.tlab{font-size:13px;font-weight:700;color:var(--muted)}
.tlab b{font-family:var(--f-num);color:var(--ink);font-size:15px}
.trow{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;align-items:flex-end}
.trow svg{display:block}
.tcnt{font-family:var(--f-num);font-weight:700;font-size:16px}
.tcnt .need{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.tcnt .short{color:var(--flame)}
.splitrow{display:flex;gap:10px;flex-wrap:wrap}
.tanktip{font-size:15px;color:var(--muted);text-align:center}

/* 세로셈 */
.vsum{--cw:clamp(22px,4.6vmin,31px);--dw:13px;--ow:20px;
  display:inline-flex;flex-direction:column;gap:2px;font-family:var(--f-num);font-weight:700;
  background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.vrow{display:flex;align-items:flex-end;justify-content:flex-end}
.vrow .op{width:var(--ow);text-align:center;color:var(--muted);font-size:clamp(23px,4.8vmin,32px);line-height:1.25}
.vrow .cell{width:var(--cw);text-align:center;font-size:clamp(23px,4.8vmin,32px);line-height:1.25;position:relative}
.vrow .cell.dot{width:var(--dw);color:var(--flame)}
.vrow .cell.pad{color:var(--muted);opacity:.65}
.vrow .cell.blank{color:transparent}
.vrow .cell.struck{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--flame);text-decoration-thickness:2px}
.vrow.adj{height:19px}
.vrow.adj .op,.vrow.adj .cell{font-size:13px;color:var(--flame);line-height:1}
.vline{height:3px;background:var(--ink);margin:3px 0}
.vsum .unit{font-weight:400;font-family:var(--f-body);font-size:13px;color:var(--muted);text-align:right;margin-top:4px}

/* 선택지 */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ch{min-height:92px;background:var(--panel2);border:3px solid var(--line);border-radius:12px;font-family:var(--f-num);font-weight:700;font-size:clamp(25px,5.2vmin,36px);display:flex;align-items:center;justify-content:center;padding:8px;line-height:1.1;text-align:center}
.ch:active{border-color:var(--flame);transform:translateY(2px)}
.ch.no{opacity:.4;border-style:dashed;border-color:var(--bad)}
.ch.yes{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 해설 */
.sol{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sol-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:900;font-size:19px}
.sol-h .pill{font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:13px;counter-reset:s}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);font-weight:700;font-size:17px}
.step .sb{min-width:0}
.step h3{font-weight:700;font-size:17px;margin-bottom:2px}
.step p{font-size:16px;line-height:1.55}
.step b{color:var(--flame)}
.step .num{font-family:var(--f-num);font-weight:700}
.eqn{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-family:var(--f-num);font-weight:700;font-size:clamp(20px,4.2vmin,27px);line-height:1.2;margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.fig{margin-top:9px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.fig.col{flex-direction:column;align-items:stretch}

/* 결과 */
#result{overflow-y:auto}
.res{max-width:640px;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.res-top{display:flex;align-items:center;gap:14px}
#rface{width:100px;flex:none}
#rface svg{display:block;width:100%;height:auto}
.bigstars{font-size:clamp(42px,10vw,62px);letter-spacing:5px;line-height:1}
.prize{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--star);border-radius:14px;padding:12px 14px}
.prize svg{width:58px;height:58px;flex:none;display:block}
.prize b{font-family:var(--f-display);font-weight:900;font-size:20px}
.rstats{display:flex;flex-direction:column;gap:3px;font-size:17px}
.rstats b{font-family:var(--f-num);font-weight:700;font-size:22px}
.review{display:flex;flex-direction:column;gap:8px}
.review h2{font-family:var(--f-display);font-weight:900;font-size:19px;margin-top:4px}
details.rv{border:2px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
details.rv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;font-family:var(--f-num);font-weight:700;font-size:18px}
details.rv>summary::-webkit-details-marker{display:none}
.rv-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.rv-q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-m{flex:none;font-size:19px}
.rv-m.ok{color:var(--good)}.rv-m.miss{color:var(--flame)}
.rv-open{flex:none;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
details.rv[open] .rv-open::after{content:"닫기"}
details.rv:not([open]) .rv-open::after{content:"해설"}
.rv-b{padding:0 14px 14px;border-top:2px solid var(--line);margin-top:2px;padding-top:12px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes lift{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.shake{animation:shake .35s}
.pop{animation:lift .4s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* 파일로 직접 열 때를 위한 기본값 (아티팩트에서는 플랫폼이 넣어 주는 부분) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="head">
      <div>
        <span class="tag">소수 게임 3편</span>
        <h1>소수 로켓 연료소</h1>
        <p class="sub">연료 탱크를 읽고, 모자라면 큰 통을 쪼개 빌려오고, 쓰고 남은 연료를 구해요. 소수 한 자리 수와 두 자리 수의 뺄셈, 특히 받아내림을 다룹니다.</p>
      </div>
      <div class="head-r">
        <div class="coins" aria-label="코인"><span class="coin"></span><b id="coinHome">0</b></div>
        <button class="btn ghost small snd" type="button">소리 켜짐</button>
      </div>
    </div>
    <div class="badges" id="badges"></div>
    <div class="cards" id="cards"></div>
    <p class="foot">한 판은 문제 8개예요. <b>맞혀도 해설이 펼쳐집니다</b> — 세로셈에 빌려온 자리까지 표시해 줘요. 한 판을 끝낼 때마다 탐사 배지를 드려요.</p>
  </section>

  <section id="play" class="screen" hidden>
    <div class="bar">
      <button class="btn ghost small" id="back" type="button">← 처음으로</button>
      <div class="bar-t"><span id="mName"></span><small id="lName"></small></div>
      <div class="pips" id="pips" role="img"></div>
      <span class="qn" id="qn"></span>
      <div class="coins" aria-label="코인"><span class="coin"></span><b id="coinPlay">0</b></div>
      <button class="btn ghost small snd" type="button">소리 켜짐</button>
    </div>
    <div class="work">
      <div class="left">
        <div id="face"></div>
        <div class="bubble">
          <div id="say"></div>
          <div id="fb" aria-live="polite"></div>
        </div>
      </div>
      <div class="right">
        <div class="deck" id="deck"></div>
        <div class="sol" id="sol" hidden></div>
        <div class="acts">
          <button class="btn go" id="check" type="button" hidden>확인!</button>
          <button class="btn ghost" id="hintBtn" type="button">힌트 보기</button>
          <button class="btn" id="next" type="button" hidden>다음 문제</button>
        </div>
      </div>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="res">
      <div class="res-top">
        <div id="rface"></div>
        <div><h1 id="rTitle"></h1><p class="sub" id="rMsg"></p></div>
      </div>
      <div class="bigstars" id="rStars" role="img"></div>
      <div class="prize" id="prize"></div>
      <div class="rstats">
        <span>첫 번에 맞힌 문제 <b id="rFirst"></b></span>
        <span>이번에 번 코인 <b id="rCoins"></b></span>
      </div>
      <div class="review">
        <h2>오늘 푼 8문제</h2>
        <div id="rList"></div>
      </div>
      <div class="acts">
        <button class="btn go" id="again" type="button">한 번 더</button>
        <button class="btn" id="nextLv" type="button" hidden>다음 단계</button>
        <button class="btn ghost" id="toHome" type="button">처음으로</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
// ==LOGIC-START==
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a};
var jong=function(n){return [0,1,3,6,7,8].indexOf(Math.abs(n)%10)>=0};

/* 소수는 1/100 단위 정수로 다룬다. {v,p} 는 v / 10^p, 소수 둘째 자리까지. */
var POW=[1,10,100];
function dec(v,p){return {v:v,p:p}}
function str(o){
  if(o.p===0) return ''+o.v;
  var q=POW[o.p], i=Math.floor(o.v/q), f=o.v%q, s=''+f;
  while(s.length<o.p) s='0'+s;
  return i+'.'+s;
}
function hund(o){return o.v*POW[2-o.p]}
function fromH(h){                                   /* 1/100 단위 정수 → 보기 좋은 {v,p} */
  if(h%100===0) return dec(h/100,0);
  if(h%10===0) return dec(h/10,1);
  return dec(h,2);
}
function sub(a,b){return fromH(hund(a)-hund(b))}
function josaNum(s,w,o){return jong(+s.charAt(s.length-1))?w:o}
function roNum(s){var l=+s.charAt(s.length-1);return (jong(l)&&l!==1&&l!==7&&l!==8)?'으로':'로'}
/* [일, 0.1, 0.01] 자리 숫자 */
function digs(o){var h=hund(o);return [Math.floor(h/100),Math.floor(h/10)%10,h%10]}

/* 받아내림 계산. 0 = 0.01 자리, 1 = 0.1 자리, 2 = 일의 자리 */
function borrowPlan(a,b){
  var ha=hund(a),hb=hund(b);
  var da=[ha%10,Math.floor(ha/10)%10,Math.floor(ha/100)%10];
  var db=[hb%10,Math.floor(hb/10)%10,Math.floor(hb/100)%10];
  var adj=[],res=[],changed=[],borrow=0,k,cur,count=0;
  for(k=0;k<3;k++){
    cur=da[k]-borrow;
    if(cur<db[k]){cur+=10;borrow=1;count++}else borrow=0;
    adj.push(cur);res.push(cur-db[k]);changed.push(cur!==da[k]);
  }
  return {da:da,db:db,adj:adj,res:res,changed:changed,borrows:count};
}
/* 받아내림을 잊고 큰 숫자에서 작은 숫자를 그냥 뺀 값 */
function flipDiff(a,b){
  var da=digs(a),db=digs(b),i,h=0;
  for(i=0;i<3;i++) h=h*10+Math.abs(da[i]-db[i]);
  return h;
}
/* 끝자리를 맞춰 빼 버린 값 */
function misalign(a,b){
  if(a.p===b.p) return null;
  var h;
  if(a.p<b.p){ h=hund(dec(a.v,b.p))-hund(b); }      /* 1.2 를 0.12 로 */
  else { h=hund(a)-hund(dec(b.v,a.p)); }
  return h;
}

/* 오답 보기. 항상 need개를 채우고 끝난다. */
function distract(ansH,cands,need){
  var out=[],seen=[ansH],i,k;
  var ok=function(h){return h>0&&h<1000&&seen.indexOf(h)<0};
  for(i=0;i<cands.length&&out.length<need;i++){
    if(ok(cands[i])){seen.push(cands[i]);out.push(cands[i])}
  }
  for(k=1;out.length<need&&k<300;k++){
    if(ok(ansH+k*10)){seen.push(ansH+k*10);out.push(ansH+k*10);continue}
    if(ok(ansH-k*10)){seen.push(ansH-k*10);out.push(ansH-k*10);continue}
    if(ok(ansH+k)){seen.push(ansH+k);out.push(ansH+k);continue}
    if(ok(ansH-k)){seen.push(ansH-k);out.push(ansH-k)}
  }
  return out;
}

/* ---- 그림 ---- */
var TANKLAB=['큰 통','중간 통','작은 통'];
var TANKVAL=['1 L','0.1 L','0.01 L'];
function tankSVG(kind){
  if(kind===0) return '<svg width="30" height="42" viewBox="0 0 30 42" role="img" aria-label="1리터 통"><rect x="2" y="7" width="26" height="33" rx="5" fill="var(--tank1)"/><rect x="9" y="1" width="12" height="7" rx="2" fill="var(--metal)"/><rect x="6" y="13" width="18" height="4" rx="2" fill="#fff" opacity=".3"/></svg>';
  if(kind===1) return '<svg width="20" height="30" viewBox="0 0 20 30" role="img" aria-label="0.1리터 통"><rect x="2" y="5" width="16" height="23" rx="4" fill="var(--tank2)"/><rect x="6" y="1" width="8" height="5" rx="1.5" fill="var(--metal)"/><rect x="5" y="9" width="10" height="3" rx="1.5" fill="#fff" opacity=".3"/></svg>';
  return '<svg width="14" height="16" viewBox="0 0 14 16" role="img" aria-label="0.01리터 통"><rect x="1.5" y="3" width="11" height="12" rx="2.5" fill="var(--tank3)"/><rect x="4.5" y="0.5" width="5" height="3" rx="1" fill="var(--metal)"/></svg>';
}
function tanks(counts,o){
  o=o||{};
  var h='<div class="tanks">',k,i;
  for(k=0;k<3;k++){
    if(o.hideEmpty&&counts[k]===0&&!(o.need&&o.need[k]>0)) continue;
    var short=!!(o.need&&counts[k]<o.need[k]);
    h+='<div class="tgroup'+(short?' short':'')+'">';
    h+='<div class="tlab">'+TANKLAB[k]+' <b>'+TANKVAL[k]+'</b></div><div class="trow">';
    for(i=0;i<counts[k]&&i<24;i++) h+=tankSVG(k);
    if(counts[k]>24) h+='<span class="tcnt">…</span>';
    h+='</div><div class="tcnt">'+counts[k]+'개'
      +(o.need?'<span class="need"> / 필요 '+o.need[k]+'개</span>'+(short?'<span class="short"> 모자라요</span>':''):'')
      +'</div></div>';
  }
  return h+'</div>';
}
/* 세로셈. 뺄셈이면 borrow 정보로 윗줄에 빌려온 숫자를 적는다 */
function vsub(a,b,o){
  o=o||{};
  var frac=Math.max(a.p,b.p,o.sum?o.sum.p:0);
  if(o.forceFrac) frac=o.forceFrac;
  var intLen=1,i;
  var il=function(n){return (''+Math.floor(n.v/POW[n.p])).length};
  intLen=Math.max(il(a),il(b),o.sum?il(o.sum):1);
  var line=function(num,sign,cls,strike){
    var s='<div class="vrow'+(cls?' '+cls:'')+'"><span class="op">'+(sign||'')+'</span>',j;
    var ip=''+Math.floor(num.v/POW[num.p]);
    while(ip.length<intLen) ip='0'+ip;
    for(j=0;j<ip.length;j++){
      var colI=2-(ip.length-1-j);                  /* 자리 인덱스: 2 = 일의 자리 */
      s+='<span class="cell'+(strike&&strike[colI]?' struck':'')+'">'+ip.charAt(j)+'</span>';
    }
    s+='<span class="cell dot">.</span>';
    var fs=''+(num.v%POW[num.p]);
    while(fs.length<num.p) fs='0'+fs;
    for(j=0;j<frac;j++){
      var colF=1-j;                                 /* 0.1 자리 = 1, 0.01 자리 = 0 */
      var ch=(j<num.p)?fs.charAt(j):'0';
      s+='<span class="cell'+(j<num.p?'':' pad')+(strike&&strike[colF]?' struck':'')+'">'+ch+'</span>';
    }
    return s+'</div>';
  };
  var h='<div class="vsum">';
  if(o.plan){
    /* 빌려온 뒤의 숫자를 작게 윗줄에 */
    h+='<div class="vrow adj"><span class="op"></span>';
    var cells=[],j2;
    for(j2=0;j2<intLen;j2++){
      var ci=2-(intLen-1-j2);
      cells.push({dot:false,txt:(ci>=0&&ci<=2&&o.plan.changed[ci])?(''+o.plan.adj[ci]):''});
    }
    cells.push({dot:true,txt:''});
    for(j2=0;j2<frac;j2++){
      var cf=1-j2;
      cells.push({dot:false,txt:(cf>=0&&o.plan.changed[cf])?(''+o.plan.adj[cf]):''});
    }
    for(j2=0;j2<cells.length;j2++)
      h+='<span class="cell'+(cells[j2].dot?' dot':'')+(cells[j2].txt?'':' blank')+'">'+(cells[j2].txt||'0')+'</span>';
    h+='</div>';
  }
  h+=line(a,'',null,o.plan?o.plan.changed:null);
  h+=line(b,'−');
  h+='<div class="vline"></div>';
  if(o.sum) h+=line(o.sum,'','sum');
  if(o.unit!==false) h+='<div class="unit">단위: L</div>';
  return h+'</div>';
}
var PLACE2=['일의 자리','소수 첫째 자리','소수 둘째 자리'];
function pvRows(list,names){
  var h='<div class="fig col"><table class="pv" style="border-collapse:collapse;width:100%;max-width:420px"><thead><tr><th></th>',k,i;
  for(k=0;k<3;k++) h+='<th style="border:1px solid var(--line);padding:6px;font-size:13px;color:var(--muted)">'+PLACE2[k]+'</th>';
  h+='</tr></thead><tbody>';
  for(i=0;i<list.length;i++){
    var d=digs(list[i]);
    h+='<tr><td style="border:1px solid var(--line);padding:6px;font-size:14px;color:var(--muted);text-align:right">'+(names&&names[i]?names[i]:str(list[i]))+'</td>';
    for(k=0;k<3;k++) h+='<td style="border:1px solid var(--line);padding:6px;text-align:center;font-family:var(--f-num);font-weight:700">'+d[k]+'</td>';
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}

/* ---- 문제 만들기 ---- */
/* 1. 연료 게이지 — 통 모형으로 소수 한 자리·두 자리 읽기 */
function genRead(lv){
  var c,val,q,mode;
  mode=(lv===3&&Math.random()<.4)?'toTank':'toNum';
  if(lv===1){ c=[0,rnd(1,9),0]; }
  else if(lv===2){ c=[0,rnd(1,9),rnd(1,9)]; }
  else { c=[rnd(1,3),rnd(0,9),rnd(1,9)]; }
  val=fromH(c[0]*100+c[1]*10+c[2]);
  q={type:'read',lv:lv,c:c,val:val,mode:mode,key:'rd'+mode+hund(val)};
  if(mode==='toNum'){
    q.question='연료가 모두 몇 L일까요?';
    q.label='통 '+c.join('·')+' 읽기';
    var H=hund(val),cands=[];
    cands.push(c[0]*100+c[2]*10+c[1]);                 /* 자리 바꿔 읽기 */
    cands.push((c[0]*100+c[1]*10+c[2])*10%1000);
    cands.push(c[1]*100+c[2]*10);
    cands.push(H+10);cands.push(H-10);cands.push(H+1);
    q.choices=shuffle([{h:H,correct:true}].concat(
      distract(H,cands,2).map(function(x){return {h:x,correct:false}})));
  }else{
    q.question='이만큼의 연료는 통이 몇 개씩일까요?';
    q.label=str(val)+' 통 고르기';
    var wrongs=[[c[0],c[2],c[1]],[c[0]+1,c[1],c[2]],[c[0],c[1]+1,c[2]]];
    var seen=[c.join(',')],list=[],w;
    for(w=0;w<wrongs.length&&list.length<2;w++){
      var kk=wrongs[w].join(',');
      if(seen.indexOf(kk)<0&&wrongs[w][1]<=9&&wrongs[w][2]<=9){seen.push(kk);list.push(wrongs[w])}
    }
    var add=1;
    while(list.length<2){
      var cand=[c[0],(c[1]+add)%10,c[2]],ks=cand.join(',');
      if(seen.indexOf(ks)<0){seen.push(ks);list.push(cand)}
      add++;
    }
    q.tankChoices=shuffle([{c:c,correct:true}].concat(list.map(function(x){return {c:x,correct:false}})));
  }
  q.steps=[
    {t:'통마다 크기가 달라요',b:'<p>큰 통은 <b>1 L</b>, 중간 통은 <b>0.1 L</b>, 작은 통은 <b>0.01 L</b>예요. '
      +'중간 통 10개를 모으면 큰 통 1개, 작은 통 10개를 모으면 중간 통 1개가 돼요.</p>'},
    {t:'자리에 맞춰 세어요',b:'<p>큰 통 '+c[0]+'개, 중간 통 '+c[1]+'개, 작은 통 '+c[2]+'개예요. '
      +'통 개수를 그대로 <b>일의 자리 · 소수 첫째 자리 · 소수 둘째 자리</b>에 적으면 돼요.</p>',
     fig:pvRows([val])},
    {t:'그래서',b:'<p>모두 <span class="num">'+str(val)+' L</span>예요.</p>'
      +'<span class="eqn">1×'+c[0]+' + 0.1×'+c[1]+' + 0.01×'+c[2]+' = '+str(val)+'</span>',
     fig:'<div class="fig col">'+tanks(c)+'</div>',reveal:true}
  ];
  return q;
}

/* 2. 통 쪼개기 — 받아내림을 손으로 */
function genSplit(lv){
  var a,b,plan,guard=0,q;
  do{
    guard++;
    if(lv===1){                                     /* 0.01 자리만 빌려오기 */
      var t1=rnd(2,9), h1=rnd(0,8);
      a=fromH(t1*10+h1);
      b=fromH(rnd(0,t1-1)*10+rnd(h1+1,9));
    }else if(lv===2){                               /* 0.1 자리만 빌려오기 */
      var o2=rnd(1,3), t2=rnd(0,8);
      a=fromH(o2*100+t2*10);
      b=fromH(rnd(0,o2-1)*100+rnd(t2+1,9)*10);
    }else{                                          /* 두 번 빌려오기 */
      var o3=rnd(1,3), t3=rnd(0,8), h3=rnd(0,8);
      a=fromH(o3*100+t3*10+h3);
      b=fromH(rnd(0,o3-1)*100+rnd(t3+1,9)*10+rnd(h3+1,9));
    }
    plan=borrowPlan(a,b);
  }while(guard<80&&!(hund(a)>hund(b)&&plan.borrows===(lv===3?2:1)));
  q={type:'split',lv:lv,a:a,b:b,plan:plan,need:digs(b),start:digs(a),key:'sp'+hund(a)+'_'+hund(b)};
  q.question='작은 통이 모자라요. 큰 통을 쪼개서 뺄 수 있게 만들어 주세요.';
  q.label=str(a)+' − '+str(b)+' 빌려오기';
  var nd=digs(b), st=digs(a);
  var shortPlace=(st[2]<nd[2])?2:((st[1]<nd[1])?1:0);
  q.steps=[
    {t:'모자란 자리를 찾아요',b:'<p>빼려면 각 통이 <b>필요한 개수만큼</b> 있어야 해요. '
      +'지금은 '+TANKLAB[shortPlace]+'이 '+st[shortPlace]+'개뿐인데 '+nd[shortPlace]+'개가 필요해요.</p>',
     fig:'<div class="fig col">'+tanks(st,{need:nd})+'</div>'},
    {t:'한 칸 위에서 빌려와요',b:'<p>바로 윗자리 통 <b>1개</b>를 쪼개면 아랫자리 통 <b>10개</b>가 돼요. '
      +'연료 양은 그대로이고 모양만 바뀌는 거예요.</p>'
      +'<span class="eqn">'+(lv===1?'0.1 = 0.01 × 10':(lv===2?'1 = 0.1 × 10':'1 = 0.1 × 10&nbsp;&nbsp;/&nbsp;&nbsp;0.1 = 0.01 × 10'))+'</span>'},
    {t:'이렇게 바뀌어요',b:'<p>'+(lv===3?'두 번 쪼개야 해요. 큰 통 1개를 중간 통 10개로, 다시 중간 통 1개를 작은 통 10개로요.':'한 번만 쪼개면 충분해요.')+'</p>',
     fig:'<div class="fig col">'+tanks(solveSplit(st,nd),{need:nd})+'</div>',reveal:true},
    {t:'세로셈으로 쓰면',b:'<p>빌려온 자리는 윗줄에 작게 적어 둬요. 쪼갠 자리는 <b>1 줄어들고</b>, 받은 자리는 <b>10이 늘어요.</b></p>',
     fig:'<div class="fig">'+vsub(a,b,{plan:plan,sum:sub(a,b)})+'</div>',reveal:true}
  ];
  return q;
}
/* 모자란 자리를 채우는 최소 쪼개기 결과 */
function solveSplit(start,need){
  var c=[start[0],start[1],start[2]];
  if(c[2]<need[2]){
    if(c[1]===0&&c[0]>0){c[0]--;c[1]+=10}
    if(c[1]>0){c[1]--;c[2]+=10}
  }
  if(c[1]<need[1]&&c[0]>0){c[0]--;c[1]+=10}
  return c;
}

/* 3. 엔진실 계산 — 소수의 뺄셈 */
function genSub(lv){
  var a,b,guard=0,plan;
  do{
    guard++;
    if(lv===1){                                     /* 받아내림 없음, 소수 한 자리 */
      var t=rnd(2,9); a=dec(t,1); b=dec(rnd(1,t-1),1);
    }else if(lv===2){                               /* 받아내림 있음, 자릿수 같음 */
      if(Math.random()<.5){
        /* 소수 한 자리끼리. 0.1 자리에서 빌려온다 */
        var o2=rnd(1,3), t2=rnd(1,8);
        a=fromH(o2*100+t2*10); b=fromH(rnd(0,o2-1)*100+rnd(t2+1,9)*10);
      }else{
        /* 소수 두 자리끼리. 0.01 자리에서 빌려온다 */
        var u1=rnd(1,8), u2=rnd(u1+1,9), tt1=rnd(1,9), tt2=rnd(0,tt1-1);
        a=dec(tt1*10+u1,2); b=dec(tt2*10+u2,2);
      }
    }else{                                          /* 자릿수가 다른 뺄셈 */
      a=fromH(rnd(100,390)); b=fromH(rnd(11,99));
    }
    plan=borrowPlan(a,b);
  }while(guard<80&&!(hund(a)>hund(b)&&hund(a)-hund(b)>0
     &&(lv===1?plan.borrows===0:(lv===2?plan.borrows>=1:(a.p!==b.p)))));
  var diff=sub(a,b), H=hund(diff);
  var q={type:'sub',lv:lv,a:a,b:b,ans:diff,plan:plan,key:'sb'+hund(a)+'_'+hund(b)};
  q.question='연료를 쓰고 나면 얼마나 남을까요?';
  q.label=str(a)+' − '+str(b);
  var cands=[];
  var fd=flipDiff(a,b); if(fd!==H) cands.push(fd);     /* 받아내림을 잊은 답 */
  var mis=misalign(a,b); if(mis!==null&&mis>0) cands.push(mis);
  cands.push(H+10);cands.push(H-10);cands.push(H+1);cands.push(H-1);cands.push(H+100);
  q.choices=shuffle([{h:H,correct:true}].concat(
    distract(H,cands,2).map(function(x){return {h:x,correct:false}})));
  q.steps=[
    {t:'소수점을 맞춰 세워요',b:'<p>뺄셈도 <b>소수점끼리 세로로</b> 맞춰요.'
      +(a.p!==b.p?' 짧은 쪽 빈 자리에는 <b>0</b>을 채워서 길이를 같게 해요.':'')+'</p>',
     fig:'<div class="fig">'+vsub(a,b,{unit:false})+'</div>'},
    (plan.borrows>0
      ? {t:'모자라면 윗자리에서 빌려요',b:'<p>아래 숫자가 더 커서 뺄 수 없는 자리가 있어요. 그럴 땐 <b>바로 윗자리에서 1을 빌려</b> 와서 10으로 바꿔 써요. '
          +'윗자리는 1이 줄어듭니다.</p>'+'<span class="eqn">'+(plan.changed[0]?'0.1 = 0.01 × 10':'1 = 0.1 × 10')+'</span>'}
      : {t:'빌려올 것이 없어요',b:'<p>모든 자리에서 위 숫자가 더 크거나 같아요. 그래서 <b>그대로 빼면</b> 돼요.</p>'}),
    {t:'끝자리부터 빼요',b:'<p>오른쪽 끝자리부터 차례로 빼고, 답의 소수점은 <b>위에 맞춰 둔 자리 그대로</b> 내려 찍어요.</p>'
      +'<span class="eqn">'+str(a)+' − '+str(b)+' = '+str(diff)+'</span>',
     fig:'<div class="fig">'+vsub(a,b,{plan:plan.borrows>0?plan:null,sum:diff})+'</div>',reveal:true}
  ];
  if(fd!==H&&plan.borrows>0){
    q.steps.push({t:'이렇게 틀리기 쉬워요',b:'<p>빌려오지 않고 <b>큰 숫자에서 작은 숫자를 그냥</b> 빼 버리면 '
      +str(fromH(fd))+josaNum(str(fromH(fd)),'이','가')+' 나와요. 자리마다 순서를 바꿔 빼면 안 돼요.</p>',reveal:true});
  }
  return q;
}

/* 4. 비행 계획 — 남은 연료 문장제 */
var MISSION=['달 기지','화성 기지','목성 관측소','토성 고리','혜성 추적','우주 정거장'];
function genMission(lv){
  var start,use1,use2=null,q,guard=0,left,ok=false;
  do{
    guard++;
    if(lv===1){ start=dec(rnd(4,9),1); use1=dec(rnd(1,hund(start)/10-1),1); use2=null; }
    else if(lv===2){ start=fromH(rnd(150,390)); use1=fromH(rnd(20,hund(start)-20)); use2=null; }
    else { start=fromH(rnd(200,390)); use1=fromH(rnd(20,90)); use2=fromH(rnd(20,90)); }
    left=hund(start)-hund(use1)-(use2?hund(use2):0);
    ok=(left>0&&left<1000);
    if(lv===2&&start.p===use1.p) ok=false;          /* 2단계는 자릿수가 달라야 한다 */
  }while(guard<80&&!ok);
  var leftO=fromH(left);
  q={type:'mission',lv:lv,start:start,use1:use1,use2:use2,ans:leftO,
     place:pick(MISSION),key:'ms'+hund(start)+'_'+hund(use1)+'_'+(use2?hund(use2):0)};
  q.question=use2
    ? ('연료 '+str(start)+' L로 출발해서 '+str(use1)+' L와 '+str(use2)+' L를 썼어요. 남은 연료는 몇 L일까요?')
    : ('연료 '+str(start)+' L로 출발해서 '+str(use1)+' L를 썼어요. 남은 연료는 몇 L일까요?');
  q.label=str(start)+' − '+str(use1)+(use2?' − '+str(use2):'');
  var H=hund(leftO),cands=[];
  cands.push(hund(start)-hund(use1));                 /* 두 번째를 빼먹음 */
  if(use2) cands.push(hund(start)-hund(use2));
  var fd=flipDiff(start,use1); if(fd!==H) cands.push(fd);
  var mis=misalign(start,use1); if(mis!==null&&mis>0&&!use2) cands.push(mis);
  cands.push(H+10);cands.push(H-10);cands.push(H+1);
  q.choices=shuffle([{h:H,correct:true}].concat(
    distract(H,cands,2).map(function(x){return {h:x,correct:false}})));
  var mid=use2?fromH(hund(start)-hund(use1)):null;
  var plan1=borrowPlan(start,use1);
  q.steps=[
    {t:'무엇을 빼는지 정해요',b:'<p>출발 연료에서 <b>쓴 연료를 '+(use2?'차례로 두 번':'한 번')+'</b> 빼면 남은 양이에요.</p>'
      +'<span class="eqn">'+str(start)+' − '+str(use1)+(use2?' − '+str(use2):'')+' = ?</span>'},
    (use2
      ? {t:'먼저 한 번 빼요',b:'<p>'+str(start)+' L에서 '+str(use1)+' L를 쓰면 '+str(mid)+' L가 남아요.</p>',
         fig:'<div class="fig">'+vsub(start,use1,{plan:plan1.borrows>0?plan1:null,sum:mid})+'</div>'}
      : {t:'소수점을 맞춰 세워요',b:'<p>소수점끼리 세로로 맞추고'
         +(plan1.borrows>0?', 모자란 자리는 윗자리에서 빌려':', 그대로')+' 빼요.</p>',
         fig:'<div class="fig">'+vsub(start,use1,{unit:false})+'</div>'}),
    {t:use2?'남은 것에서 또 빼요':'계산하면',b:'<p>남은 연료는 <span class="num">'+str(leftO)+' L</span>예요.</p>',
     fig:'<div class="fig">'+(use2
        ? vsub(mid,use2,{plan:borrowPlan(mid,use2).borrows>0?borrowPlan(mid,use2):null,sum:leftO})
        : vsub(start,use1,{plan:plan1.borrows>0?plan1:null,sum:leftO}))+'</div>',reveal:true}
  ];
  return q;
}

var AC=null;
function tone(seq){
  if(!save.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t0=AC.currentTime;
    seq.forEach(function(s){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sawtooth';o.frequency.value=s[0];
      g.gain.setValueAtTime(0.0001,t0+s[1]);
      g.gain.exponentialRampToValueAtTime(0.1,t0+s[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+s[1]+s[2]);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+s[1]);o.stop(t0+s[1]+s[2]+0.05);
    });
  }catch(e){}
}

  if(G.done) return;
  if(ok){
    G.done=true;
    var firstTry=(G.wrong===0),gain=0;
    if(firstTry){G.first++;G.streak++;gain=10+(G.streak>=3?5:0);G.results[G.i]='ok'}
    else{G.streak=0;G.results[G.i]='miss'}
    G.earned+=gain;save.coins+=gain;persist();
    setFace('happy');
    fb(GOOD[rnd(0,GOOD.length-1)]+(gain?'  +'+gain+' 코인':''),'good');
    tone(SND.good);
    if(btn) btn.classList.add('yes');
    $$('#deck .ch').forEach(function(b){
      b.disabled=true;
      if(btn&&b!==btn&&!b.classList.contains('yes')) b.classList.add('no');
    });
    if($('#sp1')){$('#sp1').disabled=true;$('#sp2').disabled=true}
    renderSol(true,true);
    $('#sol').classList.remove('pop');void $('#sol').offsetWidth;$('#sol').classList.add('pop');
    $('#check').hidden=true;$('#hintBtn').hidden=true;
    var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 문제';
    var cw=$('#coinPlay').parentNode;cw.classList.remove('bump');void cw.offsetWidth;cw.classList.add('bump');
    paintCoins();renderPips();
    G.log[G.i]={label:G.q.label,ok:firstTry,steps:G.q.steps};
  }else{
    G.wrong++;G.streak=0;G.results[G.i]='miss';
    setFace('oops');
    fb(OOPS[rnd(0,OOPS.length-1)],'bad');
    tone(SND.bad);
    if(btn){btn.classList.add('no');btn.disabled=true;btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake')}
    if(G.wrong>=2){
      G.done=true;
      fb('같이 풀어 봐요. 아래 해설을 보세요.','bad');
      reveal();
      G.log[G.i]={label:G.q.label,ok:false,steps:G.q.steps};
    }else{
      renderSol(false,false);
    }
    renderPips();
  }
}

/* 조작 */
function doSplit(from){
  if(G.cnt[from]<=0) return;
  G.cnt[from]--;G.cnt[from+1]+=10;
  $('#sp').innerHTML=splitBody();
  tone(SND.split);
}
function enoughNow(){
  var q=G.q,k;
  for(k=0;k<3;k++) if(G.cnt[k]<q.need[k]) return false;
  return true;
}

$('#cards').addEventListener('click',function(e){
  var b=e.target.closest('.lv');if(!b) return;
  startGame(b.getAttribute('data-mode'),+b.getAttribute('data-lv'));
});
$('#deck').addEventListener('click',function(e){
  if(!G||G.done) return;
  var q=G.q;
  if(e.target.closest('#sp1')){doSplit(0);return}
  if(e.target.closest('#sp2')){doSplit(1);return}
  var ch=e.target.closest('.ch');
  if(!ch||ch.disabled) return;
  var idx=+ch.getAttribute('data-ans');
  var list=q.tankChoices||q.choices;
  answer(!!list[idx].correct,ch);
});
$('#check').addEventListener('click',function(){
  if(!G||G.done) return;
  if(G.q.type!=='split') return;
  if(G.cnt.join(',')===G.q.start.join(',')){fb('아직 쪼개지 않았어요. 통을 쪼개 보세요.','');return}
  answer(enoughNow(),null);
});
$('#hintBtn').addEventListener('click',function(){
  if(!G||G.done) return;
  renderSol(false,false);
  $('#sol').scrollIntoView({block:'nearest',behavior:'smooth'});
});
$('#next').addEventListener('click',function(){
  if(G.i+1>=G.total){finish();return}
  G.i++;nextQ();
});

function finish(){
  var f=G.first,s=f>=7?3:(f>=5?2:1),bonus=0;
  if(s===3){bonus=20;save.coins+=bonus;G.earned+=bonus}
  var k=G.mode+G.lv;
  save.stars[k]=Math.max(save.stars[k]||0,s);
  var key=s===3?'comet':(s===2?'planet':'moon');
  save.badges[key]=(save.badges[key]||0)+1;
  persist();
  $('#rTitle').textContent=s===3?'오늘의 수석 기관사!':(s===2?'솜씨가 늘었어요!':'좋은 출발이에요!');
  $('#rMsg').textContent=s===3?'거의 다 첫 번에 맞혔어요. 다음 단계도 할 수 있어요.'
    :(s===2?'별 3개는 첫 번에 7문제를 맞히면 받아요.':'틀린 문제는 아래에서 해설을 다시 보면 쉬워져요.');
  $('#rStars').innerHTML=starsHTML(s);
  $('#rStars').setAttribute('aria-label','별 '+s+'개');
  $('#prize').innerHTML=badgeSVG(key)+'<div><b>'+BADGE[key].n+'</b> 획득! <br><span style="color:var(--muted);font-size:15px">지금까지 '+save.badges[key]+'개 모았어요</span></div>';
  $('#rFirst').textContent=f+' / '+G.total;
  $('#rCoins').textContent='+'+G.earned+(bonus?' (수석 기관사 보너스 +20 포함)':'');
  $('#rface').innerHTML=rocket(G.rocket,'happy');
  $('#nextLv').hidden=!(s>=2&&G.lv<3);
  $('#rList').innerHTML=G.log.map(function(e,i){
    if(!e) return '';
    return '<details class="rv"><summary><span class="rv-n">'+(i+1)+'</span><span class="rv-q">'+e.label+'</span>'
      +'<span class="rv-m '+(e.ok?'ok':'miss')+'">'+(e.ok?'○':'✕')+'</span><span class="rv-open"></span></summary>'
      +'<div class="rv-b">'+stepsHTML(e.steps)+'</div></details>';
  }).join('');
  tone(SND.win);
  show('result');
}

$('#back').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#toHome').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#again').addEventListener('click',function(){startGame(G.mode,G.lv)});
$('#nextLv').addEventListener('click',function(){startGame(G.mode,G.lv+1)});
$$('.snd').forEach(function(b){b.addEventListener('click',function(){save.sound=!save.sound;persist();paintSound();if(save.sound)tone(SND.tap)})});

renderHome();show('home');
})();
</script>
