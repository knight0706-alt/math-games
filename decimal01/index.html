<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFEDF6">
<title>소수 보석 공방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 보석 공방 작업대. 왼쪽에 손님(보석 요정)과 말풍선, 오른쪽에 정밀 저울·모눈 같은 작업 도구와 그 아래 자릿값 해설. 좁은 화면에서는 위아래로 쌓음. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#EFEDF6; --panel:#FFFFFF; --panel2:#F6F4FB; --ink:#211A33; --muted:#625878; --line:#CEC7E1;
  --gemc:#6B3FA0; --gemc-deep:#4A2874; --gemc-ink:#FFFFFF;
  --brass:#B0821F; --brass-deep:#7E5B0C; --brass-ink:#FFF8E6;
  --lcd-bg:#1C2430; --lcd-fg:#7BE8B4; --lcd-dim:#3C4A5A;
  --cell:#E4DFF1; --cell-on:#8A4FC4; --cell-line:#B4A8D4;
  --good:#0E7355; --bad:#B8342A; --star:#CE9512; --focus:#1B50C8;
  --ruby:#C42A52; --emerald:#1E8A6B; --sapphire:#2B5FB8; --topaz:#D79A1E; --quartz:#8E86A8;
  --f-display:'Black Han Sans','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-num:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151128; --panel:#1F1936; --panel2:#271F42; --ink:#ECE6F8; --muted:#A79CC6; --line:#372D56;
    --gemc:#B98CF0; --gemc-deep:#7B50B8; --gemc-ink:#1B0E2E;
    --brass:#E3AC4C; --brass-deep:#A87B1C; --brass-ink:#2A1D03;
    --lcd-bg:#0E151D; --lcd-fg:#5FE0A4; --lcd-dim:#2A3744;
    --cell:#2E2650; --cell-on:#B98CF0; --cell-line:#473A6E;
    --good:#4FD3A4; --bad:#FF8B7C; --star:#F0C354; --focus:#8FB6FF;
    --ruby:#FF6E90; --emerald:#4FD3A4; --sapphire:#6E9EF0; --topaz:#F0C354; --quartz:#B9B0D2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151128; --panel:#1F1936; --panel2:#271F42; --ink:#ECE6F8; --muted:#A79CC6; --line:#372D56;
  --gemc:#B98CF0; --gemc-deep:#7B50B8; --gemc-ink:#1B0E2E;
  --brass:#E3AC4C; --brass-deep:#A87B1C; --brass-ink:#2A1D03;
  --lcd-bg:#0E151D; --lcd-fg:#5FE0A4; --lcd-dim:#2A3744;
  --cell:#2E2650; --cell-on:#B98CF0; --cell-line:#473A6E;
  --good:#4FD3A4; --bad:#FF8B7C; --star:#F0C354; --focus:#8FB6FF;
  --ruby:#FF6E90; --emerald:#4FD3A4; --sapphire:#6E9EF0; --topaz:#F0C354; --quartz:#B9B0D2;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p,table{margin:0}
#app{height:100%;max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* 버튼 */
.btn{min-height:56px;padding:0 24px;border-radius:14px;border:0;background:var(--gemc);color:var(--gemc-ink);font-family:var(--f-body);font-weight:700;font-size:19px;box-shadow:0 4px 0 var(--gemc-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gemc-deep)}
.btn.go{background:var(--brass);color:var(--brass-ink);box-shadow:0 4px 0 var(--brass-deep)}
.btn.go:active{box-shadow:0 1px 0 var(--brass-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn.small{min-height:48px;font-size:16px;padding:0 15px}
.coins{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 7px;font-family:var(--f-num);font-weight:700;font-size:19px}
.coin{width:26px;height:26px;border-radius:50%;background:var(--brass);border:4px solid var(--brass-deep);display:inline-block}
.bump{animation:bump .4s}

/* 홈 */
#home{overflow-y:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5.4vw,46px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--gemc);letter-spacing:.06em}
.sub{color:var(--muted);margin-top:6px;max-width:37em;font-size:16px}
.head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.case{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-top:14px;flex-wrap:wrap}
.case-t{font-weight:700;font-size:15px;color:var(--muted)}
.case-i{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:700;font-size:18px}
.case-i svg{width:28px;height:28px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-top{display:flex;gap:14px;align-items:center}
.card-top>div:last-child{min-width:0}
.ico{flex:none;width:74px;height:74px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:14px;overflow:hidden;padding:6px}
.ico svg{display:block;max-height:60px;max-width:100%;width:auto;height:auto}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2}
.card p{color:var(--muted);font-size:15px}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px}
.lv{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-height:98px;padding:10px 11px;border:2px solid var(--line);border-radius:14px;background:var(--panel2)}
.lv:active{transform:translateY(2px);border-color:var(--gemc)}
.lv-n{font-weight:700;font-size:18px;line-height:1.1}
.lv-d{font-size:13px;color:var(--muted);line-height:1.3}
.stars{margin-top:auto;letter-spacing:2px;font-size:17px}
.st{color:var(--line)}.st.on{color:var(--star)}
.foot{color:var(--muted);font-size:14px;margin-block:18px 8px;max-width:50em}

/* 플레이 */
.bar{display:flex;align-items:center;gap:9px 12px;flex-wrap:wrap;padding-bottom:10px}
.bar-t{flex:1;min-width:120px;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2}
.bar-t small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.pips{display:flex;gap:6px}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.pip.cur{border-color:var(--ink);transform:scale(1.25)}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.miss{background:var(--gemc);border-color:var(--gemc)}
.qn{font-family:var(--f-num);color:var(--muted);font-size:14px}
.work{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;padding-bottom:14px}
@media (min-width:880px){.work{grid-template-columns:minmax(230px,28%) minmax(0,1fr)}}
.left{display:flex;gap:12px;align-items:flex-start}
@media (min-width:880px){.left{flex-direction:column}}
#face{flex:none;width:80px}
#face svg{display:block;width:100%;height:auto}
@media (min-width:880px){#face{width:124px;align-self:center}}
.bubble{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;width:13px;height:13px;background:var(--panel);border-left:2px solid var(--line);border-bottom:2px solid var(--line);left:-8px;top:24px;transform:rotate(45deg)}
@media (min-width:880px){.bubble{width:100%;flex:none}.bubble::before{left:50%;top:-8px;margin-left:-7px;transform:rotate(135deg)}}
#say{font-weight:700;font-size:19px;line-height:1.45}
#fb{margin-top:5px;min-height:1.5em;font-size:16px;font-weight:700}
#fb.good{color:var(--good)}#fb.bad{color:var(--bad)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.bench{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.order{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;border:2px dashed var(--gemc);border-radius:12px;padding:11px 15px;background:var(--panel2)}
.order-l{font-size:14px;font-weight:700;color:var(--muted);line-height:1.3}
.order-l b{display:block;font-size:18px;color:var(--gemc)}
.order-v{font-family:var(--f-num);font-weight:700;font-size:clamp(28px,6.2vmin,44px);line-height:1.1;min-width:0}
.order-v.word{font-family:var(--f-body);font-size:clamp(22px,4.6vmin,32px);letter-spacing:.02em}

/* 저울 */
.scale{display:flex;flex-direction:column;align-items:center;gap:0}
.pan{width:min(100%,360px);height:16px;border-radius:8px 8px 3px 3px;background:var(--brass);box-shadow:0 3px 0 var(--brass-deep)}
.pan-stem{width:34px;height:14px;background:var(--brass-deep)}
.lcd{background:var(--lcd-bg);border:3px solid var(--brass-deep);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:center;gap:4px;width:min(100%,400px);flex-wrap:nowrap;overflow-x:auto}
.dg{display:flex;flex-direction:column;align-items:center;gap:5px}
.dg .num{font-family:var(--f-num);font-weight:700;font-size:clamp(30px,7vmin,50px);line-height:1;color:var(--lcd-fg);min-width:.72em;text-align:center}
.dg .pname{font-size:10px;color:var(--lcd-dim);font-weight:700;letter-spacing:.02em}
.arw{width:44px;min-height:40px;border-radius:9px;border:2px solid var(--lcd-dim);background:transparent;color:var(--lcd-fg);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.arw:active{background:var(--lcd-dim)}
.arw.gh{visibility:hidden;width:0;border:0;pointer-events:none}
.dg.dotcol .num{min-width:.3em}
.lcd .unit{font-family:var(--f-num);font-size:19px;color:var(--lcd-dim);align-self:flex-end;padding-bottom:10px;margin-left:4px}
.scale-gem{display:grid;place-items:center;height:76px}
.scale-gem svg{width:68px;height:68px;display:block}
.hintline{font-size:15px;color:var(--muted);text-align:center}

/* 모눈 */
.gridwrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.g100{display:block;width:min(100%,320px);height:auto}
.mk{color:var(--gemc);text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:7px}
.g100 .c{fill:var(--cell);stroke:var(--cell-line);stroke-width:1}
.g100 .c.on{fill:var(--cell-on)}
.g100 .frame{fill:none;stroke:var(--ink);stroke-width:2.5}
.g100 .hit{fill:transparent;cursor:pointer}
.fig .g100{width:168px}
.gcount{font-family:var(--f-num);font-weight:700;font-size:19px;text-align:center}
.gcount small{display:block;font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.zoom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.zoom .arrow{color:var(--muted);font-size:22px}
.z10{display:block;width:88px;height:auto}
.z10 .s{fill:var(--cell);stroke:var(--cell-line);stroke-width:1.5}
.z10 .s.on{fill:var(--cell-on)}
.z10 .frame{fill:none;stroke:var(--ink);stroke-width:2.5}

/* 선택지 */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ch{min-height:92px;background:var(--panel2);border:3px solid var(--line);border-radius:16px;font-family:var(--f-num);font-weight:700;font-size:clamp(26px,5.6vmin,40px);display:flex;align-items:center;justify-content:center;padding:8px;line-height:1.1;text-align:center}
.ch.word{font-family:var(--f-body);font-size:clamp(18px,3.6vmin,25px)}
.ch:active{border-color:var(--gemc);transform:translateY(2px)}
.ch.no{opacity:.4;border-style:dashed;border-color:var(--bad)}
.ch.yes{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
/* 정렬 */
.sortrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sg{position:relative;min-height:148px;background:var(--panel2);border:3px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.sg svg{width:52px;height:52px;display:block}
.sg .val{font-family:var(--f-num);font-weight:700;font-size:clamp(22px,4.6vmin,32px)}
.sg:active{transform:translateY(2px)}
.sg.picked{border-color:var(--gemc);background:var(--panel)}
.sg .badge{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:var(--gemc);color:var(--gemc-ink);display:grid;place-items:center;font-weight:700;font-size:17px}
.sg.yes{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.sg.no{border-color:var(--bad);border-style:dashed;opacity:.55}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 해설 */
.sol{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sol-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:400;font-size:20px}
.sol-h .pill{font-family:var(--f-body);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:13px;counter-reset:s}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gemc);color:var(--gemc-ink);font-weight:700;font-size:17px}
.step .sb{min-width:0}
.step h3{font-weight:700;font-size:17px;margin-bottom:2px}
.step p{font-size:16px;line-height:1.55}
.step b{color:var(--gemc)}
.step .num{font-family:var(--f-num);font-weight:700}
.eqn{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-family:var(--f-num);font-weight:700;font-size:clamp(20px,4.2vmin,28px);line-height:1.2;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.fig{margin-top:9px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fig.col{flex-direction:column;align-items:stretch}
.tw{overflow-x:auto;margin-top:9px;border-radius:10px;border:1px solid var(--line)}
table.pv{border-collapse:collapse;width:100%;min-width:300px;font-size:15px}
table.pv th,table.pv td{border:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.pv th{background:var(--panel2);font-size:13px;color:var(--muted);font-weight:700}
table.pv td{font-family:var(--f-num);font-weight:700;font-size:19px}
table.pv td.lab{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);text-align:right}
table.pv .hi{background:color-mix(in srgb,var(--gemc) 16%,transparent);color:var(--gemc)}
table.pv .dim{color:var(--muted)}

/* 결과 */
#result{overflow-y:auto}
.res{max-width:640px;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.res-top{display:flex;align-items:center;gap:14px}
#rface{width:100px;flex:none}
#rface svg{display:block;width:100%;height:auto}
.bigstars{font-size:clamp(42px,10vw,62px);letter-spacing:5px;line-height:1}
.prize{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--brass);border-radius:16px;padding:12px 14px}
.prize svg{width:54px;height:54px;flex:none;display:block}
.prize b{font-family:var(--f-display);font-weight:400;font-size:21px}
.rstats{display:flex;flex-direction:column;gap:3px;font-size:17px}
.rstats b{font-family:var(--f-num);font-weight:700;font-size:22px}
.review{display:flex;flex-direction:column;gap:8px}
.review h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin-top:4px}
details.rv{border:2px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
details.rv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;font-family:var(--f-num);font-weight:700;font-size:19px}
details.rv>summary::-webkit-details-marker{display:none}
.rv-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.rv-q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-m{flex:none;font-size:19px}
.rv-m.ok{color:var(--good)}.rv-m.miss{color:var(--gemc)}
.rv-open{flex:none;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
details.rv[open] .rv-open::after{content:"닫기"}
details.rv:not([open]) .rv-open::after{content:"해설"}
.rv-b{padding:0 14px 14px;border-top:2px solid var(--line);margin-top:2px;padding-top:12px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sparkle{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
.pop{animation:sparkle .45s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* 파일로 직접 열 때를 위한 기본값 (아티팩트에서는 플랫폼이 넣어 주는 부분) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="head">
      <div>
        <span class="tag">소수 게임</span>
        <h1>소수 보석 공방</h1>
        <p class="sub">0.01까지, 0.001까지 재는 정밀 저울로 보석 무게를 다뤄요. 소수 두 자리 수와 세 자리 수를 읽고, 쓰고, 비교합니다.</p>
      </div>
      <div class="head-r">
        <div class="coins" aria-label="코인"><span class="coin"></span><b id="coinHome">0</b></div>
        <button class="btn ghost small snd" type="button">소리 켜짐</button>
      </div>
    </div>

<script>
(function(){
'use strict';
// ==LOGIC-START==
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a};

/* 숫자 뒤 조사 (47은 / 24는) */
var jong=function(n){return [0,1,3,6,7,8].indexOf(Math.abs(n)%10)>=0};
var P=function(n,w,o){return jong(n)?w:o};

/* 소수는 정수로 다룬다. {v, p} → 값은 v / 10^p */
var POW=[1,10,100,1000];
function dec(v,p){return {v:v,p:p}}
function str(o){
  var q=POW[o.p], i=Math.floor(o.v/q), f=o.v%q;
  if(o.p===0) return ''+o.v;
  var s=''+f; while(s.length<o.p) s='0'+s;
  return i+'.'+s;
}
function milli(o){return o.v*POW[3-o.p]}
function same(a,b){return milli(a)===milli(b)}
/* k번째 자리 숫자. 0=일의 자리, 1=소수 첫째, 2=둘째, 3=셋째 */
function digitAt(o,k){return Math.floor(o.v/POW[o.p-k])%10}
var PLACE=['일의 자리','소수 첫째 자리','소수 둘째 자리','소수 셋째 자리'];
var PSHORT=['일','첫째','둘째','셋째'];
var UNITV=['1','0.1','0.01','0.001'];
/* 묻는 자리의 숫자에 밑줄을 그어 보여 준다 (4.54 처럼 같은 숫자가 두 번 나와도 헷갈리지 않게) */
function markDigit(o,k){
  var s=str(o), idx=(k===0)?0:(k+1);
  return s.slice(0,idx)+'<span class="mk">'+s.charAt(idx)+'</span>'+s.slice(idx+1);
}
function placeVal(digit,k){
  if(digit===0) return '0';
  if(k===0) return ''+digit;
  var s='0.'; for(var i=1;i<k;i++) s+='0';
  return s+digit;
}
var KNUM=['영','일','이','삼','사','오','육','칠','팔','구'];
function readKo(o){
  var s=str(o), parts=s.split('.');
  var t=parts[1].split('').map(function(c){return KNUM[+c]}).join('');
  return KNUM[+parts[0]]+' 점 '+t;
}

/* 오답 보기. 항상 need개를 채우고 끝난다. */
function distract(ans,cands,need){
  var out=[],seen=[milli(ans)],i,k,o;
  var ok=function(x){
    if(!x||x.v<0) return false;
    if(x.p>0&&x.v>=POW[x.p]*10) return false;   /* 소수는 일의 자리를 한 자리로 */
    return seen.indexOf(milli(x))<0;
  };
  for(i=0;i<cands.length&&out.length<need;i++){
    if(ok(cands[i])){seen.push(milli(cands[i]));out.push(cands[i])}
  }
  for(k=1;out.length<need&&k<300;k++){
    o=dec(ans.v+k,ans.p);
    if(ok(o)){seen.push(milli(o));out.push(o);continue}
    o=dec(ans.v-k,ans.p);
    if(ok(o)){seen.push(milli(o));out.push(o)}
  }
  return out;
}

/* ---- 그림 ---- */
function lcdHTML(digits,p,o){
  o=o||{};
  var ghost=o.interactive?'<span class="arw gh" aria-hidden="true"></span>':'';
  var h='<div class="lcd"'+(o.interactive?' id="lcd"':'')+'>';
  for(var k=0;k<=p;k++){
    /* 소수점도 같은 세로 구조로 둬야 숫자와 높이가 맞는다 */
    if(k===1) h+='<div class="dg dotcol">'+ghost+'<span class="num dotmark" aria-hidden="true">.</span><span class="pname">&nbsp;</span>'+ghost+'</div>';
    h+='<div class="dg">';
    if(o.interactive) h+='<button class="arw" type="button" data-k="'+k+'" data-d="1" aria-label="'+PLACE[k]+' 숫자 올리기">▲</button>';
    h+='<span class="num" data-k="'+k+'">'+digits[k]+'</span>';
    h+='<span class="pname">'+PSHORT[k]+'</span>';
    if(o.interactive) h+='<button class="arw" type="button" data-k="'+k+'" data-d="-1" aria-label="'+PLACE[k]+' 숫자 내리기">▼</button>';
    h+='</div>';
  }
  return h+'<span class="unit">g</span></div>';
}
function scaleHTML(digits,p,o){
  o=o||{};
  return '<div class="scale">'+(o.gem?'<div class="scale-gem">'+o.gem+'</div>':'')
    +'<div class="pan"></div><div class="pan-stem"></div>'+lcdHTML(digits,p,o)+'</div>';
}
function digitsOf(o){
  var a=[],k;
  for(k=0;k<=o.p;k++) a.push(digitAt(o,k));
  return a;
}
function grid100(n,o){
  o=o||{};
  var S=24,M=4,h='<svg class="g100" viewBox="0 0 248 248" role="img" aria-label="100칸 모눈, '+n+'칸 색칠">';
  for(var i=0;i<100;i++){
    var r=Math.floor(i/10), c=i%10;
    h+='<rect class="c'+(i<n?' on':'')+'" x="'+(M+c*S)+'" y="'+(M+r*S)+'" width="'+S+'" height="'+S+'"/>';
  }
  h+='<rect class="frame" x="'+M+'" y="'+M+'" width="'+(S*10)+'" height="'+(S*10)+'"/>';
  if(o.interactive){
    for(var j=0;j<100;j++){
      var r2=Math.floor(j/10), c2=j%10;
      h+='<rect class="hit" data-i="'+j+'" x="'+(M+c2*S)+'" y="'+(M+r2*S)+'" width="'+S+'" height="'+S+'" role="button" tabindex="0" aria-label="'+(j+1)+'칸까지 칠하기"/>';
    }
  }
  return h+'</svg>';
}
function zoom10(n){
  var h='<svg class="z10" viewBox="0 0 60 248" role="img" aria-label="한 칸을 10칸으로 나눈 그림, '+n+'칸 색칠">';
  for(var i=0;i<10;i++) h+='<rect class="s'+(i<n?' on':'')+'" x="4" y="'+(4+i*24)+'" width="52" height="24"/>';
  return h+'<rect class="frame" x="4" y="4" width="52" height="240"/></svg>';
}
function pvTable(o,hi,showVal){
  var k,h='<div class="tw"><table class="pv"><thead><tr><th></th>';
  for(k=0;k<=o.p;k++) h+='<th'+(k===hi?' class="hi"':'')+'>'+PLACE[k]+'</th>';
  h+='</tr></thead><tbody><tr><td class="lab">숫자</td>';
  for(k=0;k<=o.p;k++) h+='<td'+(k===hi?' class="hi"':'')+'>'+digitAt(o,k)+'</td>';
  h+='</tr>';
  if(showVal){
    h+='<tr><td class="lab">나타내는 값</td>';
    for(k=0;k<=o.p;k++){
      var d=digitAt(o,k);
      h+='<td class="'+(k===hi?'hi':'dim')+'">'+placeVal(d,k)+'</td>';
    }
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}
function cmpTable(list,names){
  var P3=3,i,k,h='<div class="tw"><table class="pv"><thead><tr><th></th>';
  for(k=0;k<=P3;k++) h+='<th>'+PLACE[k]+'</th>';
  h+='</tr></thead><tbody>';
  /* 처음으로 달라지는 자리 찾기 */
  var diff=-1;
  for(k=0;k<=P3&&diff<0;k++){
    var first=Math.floor(milli(list[0])/POW[3-k])%10;
    for(i=1;i<list.length;i++){
      if(Math.floor(milli(list[i])/POW[3-k])%10!==first){diff=k;break}
    }
  }
  for(i=0;i<list.length;i++){
    h+='<tr><td class="lab">'+(names&&names[i]?names[i]:str(list[i]))+'</td>';
    for(k=0;k<=P3;k++){
      var d=Math.floor(milli(list[i])/POW[3-k])%10;
      var beyond=(k>list[i].p);
      h+='<td class="'+(k===diff?'hi':(beyond?'dim':''))+'">'+d+'</td>';
    }
    h+='</tr>';
  }
  return h+'</tbody></table></div>'+(diff>=0?'<p style="margin-top:7px;font-size:15px;color:var(--muted)">'+PLACE[diff]+'에서 처음으로 숫자가 달라져요. 거기서 승부가 납니다.</p>':'');
}

/* ---- 문제 만들기 ---- */
/* 1. 저울 맞추기 — 읽은 말이나 0.01의 개수를 보고 저울 숫자를 맞춘다 */
function genDial(lv){
  var p=(lv===3?3:2), kind, v, q;
  kind=(lv===1)?'read':(Math.random()<.5?'read':'count');
  /* 끝자리는 늘 0이 아니게 한다. 1.330 처럼 쓰지 않는 모양을 피하고,
     아이들이 진짜 헷갈리는 '가운데 0'(3.07, 1.025)만 함정으로 쓴다. */
  if(lv===1){
    v=rnd(0,9)*100+rnd(1,9)*10+rnd(1,9);
  }else if(lv===2){
    var a=rnd(1,9), b=rnd(1,9);
    if(Math.random()<.6) a=0;
    v=rnd(0,9)*100+a*10+b;
  }else{
    var d1=rnd(1,9), d2=rnd(1,9), d3=rnd(1,9), z=Math.random();
    if(z<.35) d1=0; else if(z<.6) d2=0;
    v=rnd(0,9)*1000+d1*100+d2*10+d3;
  }
  var ans=dec(v,p);
  q={type:'dial',lv:lv,p:p,ans:ans,kind:kind,key:'d'+kind+v+'p'+p};
  q.prompt = kind==='read' ? readKo(ans) : ('0.0'+(p===3?'01':'1')+'이 '+v+'개인 수');
  q.promptWord = true;
  q.label='저울 '+str(ans);
  var unit=UNITV[p];
  q.steps=[];
  if(kind==='read'){
    q.steps.push({t:'읽은 말을 끊어 봐요',b:'<p>“<b>'+readKo(ans)+'</b>”에서 <b>점</b> 앞은 일의 자리, 점 뒤는 숫자를 <b>한 자리씩</b> 읽은 거예요.</p>'
      +'<span class="eqn">'+readKo(ans).split(' 점 ')[0]+' → '+digitAt(ans,0)+'<span style="color:var(--muted)">&nbsp;/&nbsp;</span>'
      +readKo(ans).split(' 점 ')[1].split('').join(' ')+' → '+str(ans).split('.')[1].split('').join(' ')+'</span>'});
  }else{
    q.steps.push({t:'한 칸의 크기부터',b:'<p><b>'+unit+'</b>이 '+v+'개 모인 수예요. '+unit+'이 10개면 '
      +(p===3?'0.01':'0.1')+', 100개면 '+(p===3?'0.1':'1')+'이 돼요.</p>'
      +'<span class="eqn">'+unit+' × '+v+' = '+str(ans)+'</span>'});
  }
  q.steps.push({t:'자리에 하나씩 넣어요',b:'<p>소수 '+(p===3?'세':'두')+' 자리 수는 칸이 '+(p+1)+'개예요. 빈칸 없이 하나씩 채워 봐요.</p>',
    fig:pvTable(ans,-1,false)});
  var zeroK=-1,kk;
  for(kk=1;kk<=p;kk++) if(digitAt(ans,kk)===0){zeroK=kk;break}
  if(zeroK>0){
    q.steps.push({t:'0도 자리를 지켜요',b:'<p><b>'+PLACE[zeroK]+'가 0</b>이에요. 0이라고 빼먹고 쓰면 뒤 숫자가 앞으로 당겨져서 완전히 다른 수가 돼요. '
      +'0도 꼭 눌러 주세요.</p>'});
  }
  q.steps.push({t:'완성!',b:'<p>저울에 <span class="num">'+str(ans)+'</span> g 이라고 떠요.</p>',
    fig:'<div class="fig col">'+scaleHTML(digitsOf(ans),p,{})+'</div>',reveal:true});
  return q;
}

/* 2. 자리 탐정 — 자리 이름, 나타내는 값, 0.01의 개수 */
function genPlace(lv){
  var p=(lv===3?3:2), v, o, kind, q, k, cands=[];
  /* 소수 부분이 전부 0이면 물어볼 자리가 없으니 다시 뽑는다 */
  do{ v=(p===3)?rnd(1000,9999):rnd(100,999); }while(v%POW[p]===0);
  o=dec(v,p);
  kind=(lv===1)?'digit':(lv===2?'value':pick(['digit','value','count']));
  if(kind==='digit'){
    k=rnd(1,p);
    var d=digitAt(o,k);
    q={type:'place',sub:'digit',lv:lv,o:o,k:k,p:p,key:'pd'+v+'k'+k};
    q.promptHTML='<span class="order-v">'+str(o)+'</span>';
    q.question=PLACE[k]+' 숫자는 무엇일까요?';
    q.label=str(o)+' 의 '+PLACE[k];
    var dc=[];
    for(var j=0;j<=p;j++) if(j!==k) dc.push(dec(digitAt(o,j),0));
    q.choices=shuffle([{o:dec(d,0),correct:true}].concat(
      distract(dec(d,0),shuffle(dc).concat([dec((d+1)%10,0),dec((d+2)%10,0)]),2).map(function(x){return {o:x,correct:false}})));
    q.steps=[
      {t:'자리 이름부터 세어요',b:'<p>소수점 바로 오른쪽이 <b>소수 첫째 자리</b>, 그다음이 둘째, 그다음이 셋째예요.</p>',fig:pvTable(o,-1,false)},
      {t:'찾는 자리를 짚어요',b:'<p>'+PLACE[k]+'는 왼쪽에서부터 세어 소수점 뒤 <b>'+k+'번째</b> 칸이에요.</p>',fig:pvTable(o,k,false),reveal:true},
      {t:'답',b:'<p>그 칸에 있는 숫자는 <span class="num">'+d+'</span>'+P(d,'이에요','예요')+'.</p>',reveal:true}
    ];
  }else if(kind==='value'){
    do{k=rnd(1,p)}while(digitAt(o,k)===0);
    var dv=digitAt(o,k);
    var ansv=dec(dv,k);   /* 0.4 는 0.40 이 아니라 0.4 로 보이게 */
    q={type:'place',sub:'value',lv:lv,o:o,k:k,p:p,key:'pv'+v+'k'+k};
    q.promptHTML='<span class="order-v">'+markDigit(o,k)+'</span>';
    q.question='밑줄 친 숫자는 얼마를 나타낼까요?';
    q.label=str(o)+' 에서 '+dv+'의 값';
    cands=[];
    for(var m=1;m<=3;m++) if(m!==k) cands.push(dec(dv,m));
    cands.push(dec(dv,0));
    q.choices=shuffle([{o:ansv,correct:true}].concat(
      distract(ansv,cands,2).map(function(x){return {o:x,correct:false}})));
    q.steps=[
      {t:'어느 자리에 있나요',b:'<p><span class="num">'+dv+'</span>'+P(dv,'은','는')+' <b>'+PLACE[k]+'</b>에 있어요.</p>',fig:pvTable(o,k,false)},
      {t:'그 자리의 한 칸은 얼마일까',b:'<p>'+PLACE[k]+'의 한 칸은 <b>'+UNITV[k]+'</b>이에요. 그러니 '+dv+P(dv,'이','가')+' 있으면 '
        +UNITV[k]+'이 '+dv+'개라는 뜻이에요.</p>'+'<span class="eqn">'+UNITV[k]+' × '+dv+' = '+str(ansv)+'</span>',reveal:true},
      {t:'표로 확인',b:'<p>자리마다 나타내는 값이 이렇게 달라요. 숫자가 같아도 <b>자리가 다르면 값이 달라요.</b></p>',
       fig:pvTable(o,k,true),reveal:true}
    ];
  }else{
    var unit=UNITV[p];
    q={type:'place',sub:'count',lv:lv,o:o,p:p,key:'pc'+v};
    q.promptHTML='<span class="order-v">'+str(o)+'</span>';
    q.question='이 수는 <b class="num">'+unit+'</b>이 몇 개 모인 수일까요?';
    q.label=str(o)+' 는 '+unit+'이 몇 개';
    var ansc=dec(v,0);
    q.choices=shuffle([{o:ansc,correct:true}].concat(
      distract(ansc,[dec(Math.floor(v/10),0),dec(v*10,0),dec(v+10,0),dec(Math.max(0,v-100),0)],2)
        .map(function(x){return {o:x,correct:false}})));
    q.steps=[
      {t:'소수점을 치워 봐요',b:'<p>'+unit+'이 1개면 '+unit+', 10개면 '+(p===3?'0.01':'0.1')+', 100개면 '+(p===3?'0.1':'1')+'이에요. '
        +'자리를 하나씩 올라갈 때마다 10배가 되죠.</p>',fig:pvTable(o,-1,true)},
      {t:'세어 보면',b:'<span class="eqn">'+str(o)+' = '+unit+' × '+v+'</span><p style="margin-top:8px">그래서 <span class="num">'+v+'</span>개예요. '
        +'소수점만 지운 숫자와 같아요.</p>',reveal:true}
    ];
  }
  return q;
}

/* 3. 모눈 공방 — 100칸 모눈과 소수, 분수와 소수 */
function genGrid(lv){
  var q,n;
  if(lv===1){
    n=rnd(1,99);
    var a1=dec(n,2);
    q={type:'grid',sub:'read',lv:lv,n:n,ans:a1,key:'gr'+n};
    q.question='색칠한 부분은 얼마일까요?';
    q.label='모눈 '+n+'칸 읽기';
    q.choices=shuffle([{o:a1,correct:true}].concat(
      distract(a1,[dec(n,1),dec(n,3),dec(n*10,2),dec(100-n,2)],2).map(function(x){return {o:x,correct:false}})));
    q.steps=[
      {t:'한 칸이 얼마인지부터',b:'<p>큰 사각형 하나를 똑같이 <b>100칸</b>으로 나눴어요. 그래서 작은 한 칸이 <b>0.01</b>이에요.</p>',
       fig:'<div class="fig">'+grid100(1)+'<div class="gcount">0.01<small>한 칸</small></div></div>'},
      {t:'몇 칸인지 세요',b:'<p>한 줄이 10칸이에요. 줄로 세면 빨라요. 꽉 찬 줄이 <b>'+Math.floor(n/10)+'줄</b>'
        +(n%10?', 거기에 <b>'+(n%10)+'칸</b>이 더 있어요.':'이에요.')+'</p>'
        +'<span class="eqn">10 × '+Math.floor(n/10)+(n%10?' + '+(n%10):'')+' = '+n+'</span>'},
      {t:'소수로 쓰면',b:'<p>0.01이 '+n+'개니까 <span class="num">'+str(a1)+'</span>이에요.</p>',
       fig:'<div class="fig">'+grid100(n)+'<div class="gcount">'+str(a1)+'<small>'+n+'칸</small></div></div>',reveal:true}
    ];
  }else if(lv===2){
    n=rnd(1,99);
    var a2=dec(n,2);
    q={type:'grid',sub:'paint',lv:lv,n:n,ans:a2,key:'gp'+n};
    q.question='모눈을 눌러 이만큼 칠해 주세요.';
    q.label=str(a2)+' 칠하기';
    q.steps=[
      {t:'0.01이 몇 개인가요',b:'<p><span class="num">'+str(a2)+'</span>은 0.01이 <b>'+n+'개</b>라는 뜻이에요. 소수점을 지운 숫자가 바로 칸 수예요.</p>'},
      {t:'줄로 세면 빨라요',b:'<p>한 줄이 10칸이니까 <b>'+Math.floor(n/10)+'줄</b>을 꽉 채우고'
        +(n%10?' <b>'+(n%10)+'칸</b>을 더 칠해요.':' 끝이에요.')+'</p>'},
      {t:'칠한 모습',b:'<p>이렇게 '+n+'칸이에요.</p>',
       fig:'<div class="fig">'+grid100(n)+'<div class="gcount">'+str(a2)+'<small>'+n+'칸</small></div></div>',reveal:true}
    ];
  }else{
    var dir=Math.random()<.5?'toDec':'toFrac';
    var den=Math.random()<.5?100:1000;
    var num=den===100?rnd(1,99):rnd(1,999);
    var ad=dec(num,den===100?2:3);
    q={type:'grid',sub:'convert',lv:lv,dir:dir,num:num,den:den,ans:ad,key:'gc'+dir+num+'_'+den};
    if(dir==='toDec'){
      q.question='이 분수를 소수로 쓰면?';
      q.promptHTML='<span class="order-v">'+num+'/'+den+'</span>';
      q.label=num+'/'+den+' → 소수';
      q.choices=shuffle([{o:ad,correct:true}].concat(
        distract(ad,[dec(num,3),dec(num,2),dec(num,1),dec(Math.floor(num/10)||1,ad.p)],2)
          .map(function(x){return {o:x,correct:false}})));
    }else{
      q.question='이 소수를 분수로 쓰면?';
      q.promptHTML='<span class="order-v">'+str(ad)+'</span>';
      q.label=str(ad)+' → 분수';
      var wrong=[[num,den===100?1000:100],[num,10],[Math.floor(num/10)||1,den],[num*10,den]];
      var seenF=[num+'/'+den],listF=[];
      for(var wi=0;wi<wrong.length&&listF.length<2;wi++){
        var kstr=wrong[wi][0]+'/'+wrong[wi][1];
        if(wrong[wi][0]>0&&seenF.indexOf(kstr)<0&&Math.abs(wrong[wi][0]/wrong[wi][1]-num/den)>1e-12){seenF.push(kstr);listF.push(wrong[wi])}
      }
      var addk=1;
      while(listF.length<2){
        var cand=[num+addk,den],ks=cand[0]+'/'+cand[1];
        if(seenF.indexOf(ks)<0){seenF.push(ks);listF.push(cand)}
        addk++;
      }
      q.choices=shuffle([{text:num+'/'+den,correct:true}].concat(listF.map(function(c){
        return {text:c[0]+'/'+c[1],correct:false};
      })));
    }
    var unit3=den===100?'0.01':'0.001';
    q.steps=[
      {t:'분모가 알려 줘요',b:'<p>분모 <b>'+den+'</b>은 1을 '+den+'칸으로 나눴다는 뜻이에요. 그 한 칸이 <b>'+unit3+'</b>이고, 소수 '
        +(den===100?'두':'세')+' 자리 수가 됩니다.</p>'},
      {t:'1000은 이렇게 만들어요',b:'<p>100칸 모눈에서 <b>작은 한 칸을 다시 10칸</b>으로 나누면 1000칸이 돼요. 그 한 칸이 0.001이에요.</p>',
       fig:'<div class="fig zoom">'+grid100(1)+'<span class="arrow">→</span>'+zoom10(1)+'<div class="gcount">0.001<small>한 칸</small></div></div>'},
      {t:'분자는 칸 수',b:'<p>분자 <b>'+num+'</b>'+P(num,'은','는')+' 그 칸이 '+num+'개라는 뜻이에요.</p>'
        +'<span class="eqn">'+num+'/'+den+' = '+unit3+' × '+num+' = '+str(ad)+'</span>'
        +'<p style="margin-top:8px">분모가 '+den+'이면 소수점 아래 자리가 <b>'+(den===100?2:3)+'개</b>가 되도록 쓰면 돼요.</p>',reveal:true}
    ];
    if(den===100) q.steps.splice(1,1);
  }
  return q;
}

/* 4. 무게 겨루기 — 크기 비교와 순서 정렬 */
function genCompare(lv){
  var q,A,B,list;
  if(lv===1){
    /* 자릿수가 달라 헷갈리는 짝을 자주 낸다 */
    var style=rnd(1,3);
    if(style===1){ var w=rnd(0,2); var t=rnd(1,9); A=dec(w*100+t*10,2); B=dec(w*100+(t-1)*10+rnd(1,9),2); }
    else if(style===2){ var w2=rnd(0,3); A=dec(w2*100+rnd(10,99),2); B=dec(w2*100+rnd(10,99),2); }
    else { A=dec(rnd(1,4)*100+rnd(0,99),2); B=dec(rnd(1,4)*100+rnd(0,99),2); }
    if(same(A,B)) B=dec(B.v+rnd(1,9),2);
    if(Math.random()<.5){var tmp=A;A=B;B=tmp}
    q={type:'compare',sub:'two',lv:lv,A:A,B:B,ans:(milli(A)>milli(B)?'a':'b'),key:'c2'+A.v+'_'+B.v};
    q.question='어느 보석이 더 무거울까요?';
    q.label=str(A)+' vs '+str(B);
    q.steps=[
      {t:'자리를 맞춰 세로로 봐요',b:'<p>소수는 <b>앞자리부터</b> 차례로 비교해요. 자릿수가 다르면 뒤에 0이 있다고 생각하면 편해요 '
        +'(0.4 = 0.40 = 0.400).</p>',fig:cmpTable([A,B])},
      {t:'긴 수가 큰 수는 아니에요',b:'<p>숫자가 많다고 큰 수가 아니에요. '
        +'0.4와 0.38을 보면 0.38이 자릿수는 많지만 소수 첫째 자리에서 이미 <span class="num">4 &gt; 3</span>이라 0.4가 더 커요.</p>'},
      {t:'답',b:'<p><span class="num">'+str(milli(A)>milli(B)?A:B)+'</span>이 더 무거워요.</p>'
        +'<span class="eqn">'+str(A)+(milli(A)>milli(B)?' &gt; ':' &lt; ')+str(B)+'</span>',reveal:true}
    ];
  }else{
    var p=(lv===2?2:3);
    var base=rnd(0,2);
    var vs=[],i,tries=0;
    var dupOf=function(c){for(var j=0;j<vs.length;j++) if(same(vs[j],c)) return true;return false};
    while(vs.length<3&&tries<300){
      tries++;
      /* 끝자리 0(2.670 같은 모양)은 피한다. 그래야 2.67 과 2.394 처럼
         자릿수가 다른 수를 비교하는 연습이 제대로 된다. */
      var f2=rnd(1,99); if(f2%10===0) f2+=rnd(1,9);
      var f3=rnd(1,999); if(f3%10===0) f3+=rnd(1,9);
      var cand;
      if(lv===2) cand=dec(base*100+f2,2);
      else cand=(Math.random()<.4)?dec(base*100+f2,2):dec(base*1000+f3,3);
      if(!dupOf(cand)) vs.push(cand);
    }
    var fk=1;
    while(vs.length<3){
      var c2=(lv===2)?dec(base*100+fk,2):dec(base*1000+fk,3);
      if(!dupOf(c2)) vs.push(c2);
      fk++;
    }
    list=shuffle(vs);
    var sorted=list.slice().sort(function(x,y){return milli(x)-milli(y)});
    q={type:'compare',sub:'sort',lv:lv,list:list,order:sorted.map(function(s){
      for(var j=0;j<list.length;j++) if(list[j]===s) return j;
      return 0;
    }),key:'cs'+list.map(function(x){return x.v+'p'+x.p}).join('_')};
    q.question='가벼운 것부터 순서대로 눌러 주세요.';
    q.label=list.map(function(x){return str(x)}).join(' · ')+' 정렬';
    q.steps=[
      {t:'자리를 맞춰 적어요',b:'<p>자릿수가 다르면 뒤에 <b>0</b>을 채워 길이를 맞춰요. 0.5 = 0.500 이니까 값은 그대로예요.</p>',
       fig:cmpTable(list)},
      {t:'앞자리부터 비교해요',b:'<p>일의 자리 → 소수 첫째 → 둘째 → 셋째 순서로 보다가, <b>처음 달라지는 자리</b>에서 큰 쪽이 더 큰 수예요. '
        +'뒤에 남은 숫자는 볼 필요가 없어요.</p>'},
      {t:'가벼운 것부터 줄 세우면',b:'<span class="eqn">'+sorted.map(function(s){return str(s)}).join(' &lt; ')+'</span>',reveal:true}
    ];
  }
  return q;
}

var AC=null;
function tone(seq){
  if(!save.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t0=AC.currentTime;
    seq.forEach(function(s){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=s[0];
      g.gain.setValueAtTime(0.0001,t0+s[1]);
      g.gain.exponentialRampToValueAtTime(0.15,t0+s[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+s[1]+s[2]);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+s[1]);o.stop(t0+s[1]+s[2]+0.05);
    });
  }catch(e){}
}

function stepsHTML(steps){
  return '<div class="steps">'+steps.map(function(s){
    return '<div class="step"><div class="sb"><h3>'+s.t+'</h3>'+s.b+(s.fig||'')+'</div></div>';
  }).join('')+'</div>';
}
function renderSol(full,won){
  var steps=G.q.steps.filter(function(s){return full||!s.reveal});
  if(!steps.length){$('#sol').hidden=true;return}
  $('#sol').hidden=false;
  var head=full?(won?'정답! 왜 그런지 같이 볼까요':'해설'):'힌트';
  var pill=full?(won?'맞혀도 해설은 꼭 보기':'끝까지 같이 풀어 봐요'):'여기까지만 알려줄게요';
  $('#sol').innerHTML='<div class="sol-h"><span>'+head+'</span><span class="pill">'+pill+'</span></div>'+stepsHTML(steps);
}
function hideSol(){$('#sol').hidden=true;$('#sol').innerHTML=''}

function nextQ(){
  G.done=false;G.wrong=0;G.pickOrder=[];G.grid=0;
  G.gemIdx=(G.i*2+rnd(0,4))%5;
  var q,tries=0;
  do{q=GENS[G.mode](G.lv);tries++}while(G.used[q.key]&&tries<60);
  G.used[q.key]=1;G.q=q;
  if(q.type==='dial'){G.dialD=[];for(var k=0;k<=q.p;k++) G.dialD.push(0)}
  setFace('idle');fb('');hideSol();
  $('#next').hidden=true;
  $('#hintBtn').hidden=false;
  var needCheck=(q.type==='dial')||(q.type==='grid'&&q.sub==='paint')||(q.type==='compare'&&q.sub==='sort');
  $('#check').hidden=!needCheck;
  $('#check').textContent=q.type==='dial'?'무게 확인!':(q.type==='grid'?'다 칠했어요!':'이 순서예요!');
  renderQ();renderPips();paintCoins();
}
function choicesHTML(q){
  return '<div class="choices">'+q.choices.map(function(c,i){
    var txt=c.text!=null?c.text:str(c.o);
    return '<button class="ch'+(c.text!=null?' word':'')+'" type="button" data-ans="'+i+'">'+txt+'</button>';
  }).join('')+'</div>';
}
function renderQ(){
  var q=G.q,say='',h='';
  if(q.type==='dial'){
    say='새 보석이 들어왔어요! 저울 숫자를 맞춰 주세요.';
    h='<div class="order"><div class="order-l"><b>주문서</b>이 무게로 맞춰요</div>'
      +'<div class="order-v'+(q.promptWord?' word':'')+'">'+q.prompt+'</div></div>'
      +scaleHTML(G.dialD,q.p,{interactive:true,gem:gemSVG(G.gemIdx,'idle',true)})
      +'<div class="hintline">▲ ▼ 를 눌러 각 자리 숫자를 바꿔요</div>';
  }else if(q.type==='place'){
    say=q.question;
    h='<div class="order"><div class="order-l"><b>감정서</b>'+(q.sub==='digit'?PLACE[q.k]:(q.sub==='value'?'자리의 값':'0.01의 개수'))+'</div>'
      +q.promptHTML+'</div>'+choicesHTML(q);
  }else if(q.type==='grid'){
    if(q.sub==='read'){
      say=q.question;
      h='<div class="gridwrap">'+grid100(q.n)+'<div class="gcount">? <small>큰 사각형 전체가 1</small></div></div>'+choicesHTML(q);
    }else if(q.sub==='paint'){
      say=q.question;
      h='<div class="order"><div class="order-l"><b>주문서</b>큰 사각형 전체가 1</div><div class="order-v">'+str(q.ans)+'</div></div>'
        +'<div class="gridwrap" id="gw">'+grid100(0,{interactive:true})+'</div>'
        +'<div class="gcount" id="gc">0칸<small>모눈을 누르면 그 칸까지 칠해져요</small></div>';
    }else{
      say=q.question;
      h='<div class="order"><div class="order-l"><b>감정서</b>'+(q.dir==='toDec'?'분수 → 소수':'소수 → 분수')+'</div>'
        +q.promptHTML+'<span class="order-v" style="color:var(--gemc)">= ?</span></div>'+choicesHTML(q);
    }
  }else{
    if(q.sub==='two'){
      say=q.question;
      h='<div class="sortrow"><button class="sg" type="button" data-ans="a">'+gemSVG(0,null,true)+'<span class="val">'+str(q.A)+'</span></button>'
        +'<button class="sg" type="button" data-ans="b">'+gemSVG(2,null,true)+'<span class="val">'+str(q.B)+'</span></button></div>';
    }else{
      say=q.question;
      h='<div class="sortrow" id="sr">'+q.list.map(function(x,i){
          return '<button class="sg" type="button" data-sort="'+i+'">'+gemSVG(i,null,true)+'<span class="val">'+str(x)+'</span></button>';
        }).join('')+'</div><div class="hintline" id="sh">가벼운 것부터 차례로 누르세요. 다시 누르면 취소돼요.</div>';
    }
  }
  $('#say').innerHTML=say;
  $('#bench').innerHTML=h;
}

function reveal(){
  renderSol(true,false);
  var q=G.q;
  if(q.type==='dial'){
    G.dialD=digitsOf(q.ans);
    paintDial();
  }else if(q.type==='grid'&&q.sub==='paint'){
    $('#gw').innerHTML=grid100(q.n);
    $('#gc').innerHTML=q.n+'칸<small>정답은 '+q.n+'칸이에요</small>';
  }else if(q.type==='compare'&&q.sub==='sort'){
    $$('#sr .sg').forEach(function(b){
      var i=+b.getAttribute('data-sort'), rank=q.order.indexOf(i);
      b.classList.remove('picked');
      b.classList.add('yes');
      b.innerHTML='<span class="badge">'+(rank+1)+'</span>'+b.innerHTML.replace(/<span class="badge">.*?<\/span>/,'');
      b.disabled=true;
    });
    $('#sh').textContent='가벼운 것부터 이 순서예요.';
  }else{
    $$('#bench .ch,#bench .sg[data-ans]').forEach(function(b,i){
      var ok;
      if(q.type==='compare'&&q.sub==='two') ok=(b.getAttribute('data-ans')===q.ans);
      else ok=!!(q.choices[i]&&q.choices[i].correct);
      b.classList.toggle('yes',ok);
      if(!ok) b.classList.add('no');
      b.disabled=true;
    });
  }
  $('#check').hidden=true;$('#hintBtn').hidden=true;
  var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 손님';
}

function answer(ok,btn){
  if(G.done) return;
  if(ok){
    G.done=true;
    var firstTry=(G.wrong===0),gain=0;
    if(firstTry){G.first++;G.streak++;gain=10+(G.streak>=3?5:0);G.results[G.i]='ok'}
    else{G.streak=0;G.results[G.i]='miss'}
    G.earned+=gain;save.coins+=gain;persist();
    setFace('happy');
    fb(GOOD[rnd(0,GOOD.length-1)]+(gain?'  +'+gain+' 코인':''),'good');
    tone(SND.good);
    if(btn) btn.classList.add('yes');
    $$('#bench .ch,#bench .sg').forEach(function(b){b.disabled=true});
    renderSol(true,true);
    $('#sol').classList.remove('pop');void $('#sol').offsetWidth;$('#sol').classList.add('pop');
    $('#check').hidden=true;$('#hintBtn').hidden=true;
    var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 손님';
    var cw=$('#coinPlay').parentNode;cw.classList.remove('bump');void cw.offsetWidth;cw.classList.add('bump');
    paintCoins();renderPips();
    G.log[G.i]={label:G.q.label,ok:firstTry,steps:G.q.steps};
  }else{
    G.wrong++;G.streak=0;G.results[G.i]='miss';
    setFace('oops');
    fb(OOPS[rnd(0,OOPS.length-1)],'bad');
    tone(SND.bad);
    if(btn){btn.classList.add('no');btn.disabled=true;btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake')}
    if(G.wrong>=2){
      G.done=true;
      fb('같이 풀어 봐요. 아래 해설을 보세요.','bad');
      reveal();
      G.log[G.i]={label:G.q.label,ok:false,steps:G.q.steps};
    }else{
      renderSol(false,false);
    }
    renderPips();
  }
}

/* 조작 */
function paintDial(){
  /* 소수점 칸(.dotmark)은 data-k가 없다. 숫자 칸만 다시 그린다. */
  $$('#lcd .num[data-k]').forEach(function(el){
    el.textContent=G.dialD[+el.getAttribute('data-k')];
  });
}
function bumpDigit(k,d){
  G.dialD[k]=(G.dialD[k]+d+10)%10;
  paintDial();tone(SND.tick);
}
function setGrid(i){
  var n=(G.grid===i+1)?i:i+1;
  G.grid=n;
  $('#gw').innerHTML=grid100(n,{interactive:true});
  $('#gc').innerHTML=n+'칸<small>소수로 쓰면 '+str(dec(n,2))+'</small>';
  tone(SND.tap);
}
function paintSort(){
  $$('#sr .sg').forEach(function(b){
    var i=+b.getAttribute('data-sort'), at=G.pickOrder.indexOf(i);
    var old=b.querySelector('.badge'); if(old) old.remove();
    b.classList.toggle('picked',at>=0);
    if(at>=0) b.insertAdjacentHTML('afterbegin','<span class="badge">'+(at+1)+'</span>');
  });
  $('#sh').textContent=G.pickOrder.length===3?'다 골랐어요. "이 순서예요!"를 눌러요.':('가벼운 것부터 차례로 누르세요. ('+G.pickOrder.length+'/3)');
}
function tapSort(i){
  var at=G.pickOrder.indexOf(i);
  if(at>=0) G.pickOrder.splice(at,1);
  else if(G.pickOrder.length<3) G.pickOrder.push(i);
  paintSort();tone(SND.tap);
}

$('#cards').addEventListener('click',function(e){
  var b=e.target.closest('.lv');if(!b) return;
  startGame(b.getAttribute('data-mode'),+b.getAttribute('data-lv'));
});
$('#bench').addEventListener('click',function(e){
  if(!G||G.done) return;
  var q=G.q;
  var arw=e.target.closest('.arw');
  if(arw){bumpDigit(+arw.getAttribute('data-k'),+arw.getAttribute('data-d'));return}
  var cell=e.target.closest('.hit');
  if(cell&&q.type==='grid'&&q.sub==='paint'){setGrid(+cell.getAttribute('data-i'));return}
  var sg=e.target.closest('.sg[data-sort]');
  if(sg){tapSort(+sg.getAttribute('data-sort'));return}
  var two=e.target.closest('.sg[data-ans]');
  if(two&&q.type==='compare'&&q.sub==='two'){
    if(two.disabled) return;
    answer(two.getAttribute('data-ans')===q.ans,two);return;
  }
  var ch=e.target.closest('.ch');
  if(!ch||ch.disabled) return;
  answer(!!q.choices[+ch.getAttribute('data-ans')].correct,ch);
});
$('#bench').addEventListener('keydown',function(e){
  if(!G||G.done) return;
  if(e.key!=='Enter'&&e.key!==' ') return;
  var cell=e.target.closest('.hit');
  if(cell&&G.q.type==='grid'&&G.q.sub==='paint'){
    e.preventDefault();
    var i=+cell.getAttribute('data-i');
    setGrid(i);
    var again=document.querySelector('#gw .hit[data-i="'+i+'"]');
    if(again) again.focus();
  }
});
$('#check').addEventListener('click',function(){
  if(!G||G.done) return;
  var q=G.q;
  if(q.type==='dial'){
    var v=0,k;
    for(k=0;k<=q.p;k++) v+=G.dialD[k]*POW[q.p-k];
    answer(v===q.ans.v,null);
  }else if(q.type==='grid'){
    if(G.grid===0){fb('모눈을 눌러서 칠해 주세요.','');return}
    answer(G.grid===q.n,null);
  }else{
    if(G.pickOrder.length<3){fb('세 개를 모두 골라 주세요.','');return}
    answer(G.pickOrder.join(',')===q.order.join(','),null);
  }
});
$('#hintBtn').addEventListener('click',function(){
  if(!G||G.done) return;
  renderSol(false,false);
  $('#sol').scrollIntoView({block:'nearest',behavior:'smooth'});
});
$('#next').addEventListener('click',function(){
  if(G.i+1>=G.total){finish();return}
  G.i++;nextQ();
});

function finish(){
  var f=G.first,s=f>=7?3:(f>=5?2:1),bonus=0;
  if(s===3){bonus=20;save.coins+=bonus;G.earned+=bonus}
  var k=G.mode+G.lv;
  save.stars[k]=Math.max(save.stars[k]||0,s);
  var gemKey=s===3?'diamond':(s===2?'ruby':'quartz');
  save.gems[gemKey]=(save.gems[gemKey]||0)+1;
  persist();
  $('#rTitle').textContent=s===3?'오늘의 보석 감정사!':(s===2?'솜씨가 늘었어요!':'좋은 출발이에요!');
  $('#rMsg').textContent=s===3?'거의 다 첫 번에 맞혔어요. 다음 단계도 할 수 있어요.'
    :(s===2?'별 3개는 첫 번에 7문제를 맞히면 받아요.':'틀린 문제는 아래에서 해설을 다시 보면 쉬워져요.');
  $('#rStars').innerHTML=starsHTML(s);
  $('#rStars').setAttribute('aria-label','별 '+s+'개');
  $('#prize').innerHTML=prizeSVG(gemKey)+'<div><b>'+PRIZE[gemKey].n+'</b> 획득! <br><span style="color:var(--muted);font-size:15px">보석함에 넣어 두었어요 (지금까지 '+save.gems[gemKey]+'개)</span></div>';
  $('#rFirst').textContent=f+' / '+G.total;
  $('#rCoins').textContent='+'+G.earned+(bonus?' (감정사 보너스 +20 포함)':'');
  $('#rface').innerHTML=gemSVG(G.gemIdx,'happy');
  $('#nextLv').hidden=!(s>=2&&G.lv<3);
  $('#rList').innerHTML=G.log.map(function(e,i){
    if(!e) return '';
    return '<details class="rv"><summary><span class="rv-n">'+(i+1)+'</span><span class="rv-q">'+e.label+'</span>'
      +'<span class="rv-m '+(e.ok?'ok':'miss')+'">'+(e.ok?'○':'✕')+'</span><span class="rv-open"></span></summary>'
      +'<div class="rv-b">'+stepsHTML(e.steps)+'</div></details>';
  }).join('');
  tone(SND.win);
  show('result');
}

$('#back').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#toHome').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#again').addEventListener('click',function(){startGame(G.mode,G.lv)});
$('#nextLv').addEventListener('click',function(){startGame(G.mode,G.lv+1)});
$$('.snd').forEach(function(b){b.addEventListener('click',function(){save.sound=!save.sound;persist();paintSound();if(save.sound)tone(SND.tap)})});

renderHome();show('home');
})();
</script>
