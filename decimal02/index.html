<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9EDF1">
<title>소수 기차 여행</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&family=Nanum+Gothic:wght@400;700;800&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: 역무실 작업대. 왼쪽에 역장(기차)과 말풍선, 오른쪽에 선로·세로셈판 같은 도구와 그 아래 해설. 좁은 화면에서는 위아래로 쌓음. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --panel2:#F3F6F9; --ink:#132333; --muted:#55687D; --line:#C2CEDA;
  --rail:#2B4A6F; --rail-deep:#17304C; --rail-ink:#FFFFFF;
  --signal:#D1512A; --signal-deep:#9C3312; --signal-ink:#FFFFFF;
  --tie:#B59A72; --sky:#DCE7F0;
  --good:#0D6E52; --bad:#BC3A24; --star:#D9A017; --focus:#1550CE;
  --gold:#D9A017; --silver:#8FA3B5; --bronze:#B07A45;
  --f-display:'Sunflower','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-body:'Nanum Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-num:'Roboto Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A24; --panel:#192734; --panel2:#1F3140; --ink:#E6EDF4; --muted:#9BB0C4; --line:#2E4355;
    --rail:#6FA8DC; --rail-deep:#3C6E9E; --rail-ink:#0B1721;
    --signal:#FF7F52; --signal-deep:#C05228; --signal-ink:#2A0E03;
    --tie:#7A6744; --sky:#1B2C3B;
    --good:#4FD2A2; --bad:#FF8A72; --star:#F0C14B; --focus:#8FB8FF;
    --gold:#F0C14B; --silver:#AFC0CF; --bronze:#CE9661;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A24; --panel:#192734; --panel2:#1F3140; --ink:#E6EDF4; --muted:#9BB0C4; --line:#2E4355;
  --rail:#6FA8DC; --rail-deep:#3C6E9E; --rail-ink:#0B1721;
  --signal:#FF7F52; --signal-deep:#C05228; --signal-ink:#2A0E03;
  --tie:#7A6744; --sky:#1B2C3B;
  --good:#4FD2A2; --bad:#FF8A72; --star:#F0C14B; --focus:#8FB8FF;
  --gold:#F0C14B; --silver:#AFC0CF; --bronze:#CE9661;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p,table{margin:0}
#app{height:100%;max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* 버튼 */
.btn{min-height:56px;padding:0 24px;border-radius:12px;border:0;background:var(--rail);color:var(--rail-ink);font-family:var(--f-body);font-weight:800;font-size:19px;box-shadow:0 4px 0 var(--rail-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rail-deep)}
.btn.go{background:var(--signal);color:var(--signal-ink);box-shadow:0 4px 0 var(--signal-deep)}
.btn.go:active{box-shadow:0 1px 0 var(--signal-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn.small{min-height:48px;font-size:16px;padding:0 15px}
.coins{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 7px;font-family:var(--f-num);font-weight:700;font-size:19px}
.coin{width:26px;height:26px;border-radius:50%;background:var(--star);border:4px solid var(--signal-deep);display:inline-block}
.bump{animation:bump .4s}

/* 홈 */
#home{overflow-y:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5.4vw,46px);line-height:1.15;text-wrap:balance}
.tag{display:inline-block;font-size:14px;font-weight:800;color:var(--signal);letter-spacing:.06em}
.sub{color:var(--muted);margin-top:6px;max-width:37em;font-size:16px}
.head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.book{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-top:14px;flex-wrap:wrap}
.book-t{font-weight:700;font-size:15px;color:var(--muted)}
.book-i{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-weight:700;font-size:18px}
.book-i svg{width:30px;height:30px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-top{display:flex;gap:14px;align-items:center}
.card-top>div:last-child{min-width:0}
.ico{flex:none;width:76px;height:76px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:12px;overflow:hidden;padding:6px}
.ico svg{display:block;max-height:62px;max-width:100%;width:auto;height:auto}
.card h2{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.2}
.card p{color:var(--muted);font-size:15px}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px}
.lv{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-height:98px;padding:10px 11px;border:2px solid var(--line);border-radius:12px;background:var(--panel2)}
.lv:active{transform:translateY(2px);border-color:var(--signal)}
.lv-n{font-weight:800;font-size:18px;line-height:1.1}
.lv-d{font-size:13px;color:var(--muted);line-height:1.3}
.stars{margin-top:auto;letter-spacing:2px;font-size:17px}
.st{color:var(--line)}.st.on{color:var(--star)}
.foot{color:var(--muted);font-size:14px;margin-block:18px 8px;max-width:50em}

/* 플레이 */
.bar{display:flex;align-items:center;gap:9px 12px;flex-wrap:wrap;padding-bottom:10px}
.bar-t{flex:1;min-width:120px;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.2}
.bar-t small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.pips{display:flex;gap:6px}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.pip.cur{border-color:var(--ink);transform:scale(1.25)}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.miss{background:var(--signal);border-color:var(--signal)}
.qn{font-family:var(--f-num);color:var(--muted);font-size:14px}
.work{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;padding-bottom:14px}
@media (min-width:880px){.work{grid-template-columns:minmax(230px,28%) minmax(0,1fr)}}
.left{display:flex;gap:12px;align-items:flex-start}
@media (min-width:880px){.left{flex-direction:column}}
#face{flex:none;width:92px}
#face svg{display:block;width:100%;height:auto}
@media (min-width:880px){#face{width:140px;align-self:center}}
.bubble{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;width:13px;height:13px;background:var(--panel);border-left:2px solid var(--line);border-bottom:2px solid var(--line);left:-8px;top:24px;transform:rotate(45deg)}
@media (min-width:880px){.bubble{width:100%;flex:none}.bubble::before{left:50%;top:-8px;margin-left:-7px;transform:rotate(135deg)}}
#say{font-weight:700;font-size:19px;line-height:1.45}
#fb{margin-top:5px;min-height:1.5em;font-size:16px;font-weight:700}
#fb.good{color:var(--good)}#fb.bad{color:var(--bad)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.desk{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.slip{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;border:2px dashed var(--signal);border-radius:10px;padding:11px 15px;background:var(--panel2)}
.slip-l{font-size:14px;font-weight:700;color:var(--muted);line-height:1.3}
.slip-l b{display:block;font-size:18px;color:var(--signal)}
.slip-v{font-family:var(--f-num);font-weight:700;font-size:clamp(26px,5.8vmin,42px);line-height:1.1;min-width:0}
.slip-v .q{color:var(--signal)}
.slip-v .u{font-size:.55em;color:var(--muted);margin-left:.15em}

/* 선로 */
.trackwrap{border:2px solid var(--line);border-radius:12px;background:var(--sky);padding:8px 4px}
.trackwrap.tap{cursor:pointer}
.trk{display:block;width:100%;height:auto;color:var(--ink)}
.trk .bed{fill:var(--tie)}
.trk .rail{stroke:var(--rail);stroke-width:4}
.trk .tie{stroke:var(--tie);stroke-width:4}
.trk .tick{stroke:var(--rail);stroke-width:2.5}
.trk .tick.big{stroke-width:4}
.trk .dot{fill:var(--rail);opacity:.55}
.trk .lab{fill:var(--ink);font-family:var(--f-num);font-weight:700;font-size:19px}
.trk .lab.sm{fill:var(--muted);font-size:14px}
.trk .train{fill:var(--signal)}
.trk .train .win{fill:var(--sky)}
.trk .mline{stroke:var(--signal);stroke-width:3}
.trk .mtext{fill:var(--signal);font-family:var(--f-num);font-weight:700;font-size:20px}
.trk .hit{fill:transparent}
.zoomline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.zoomline svg{display:block;width:min(100%,260px);height:auto}
.zb .base{stroke:var(--line);stroke-width:3}
.zb .seg{stroke:var(--signal);stroke-width:6}
.zb .t{fill:var(--muted);font-family:var(--f-num);font-size:13px}

/* 세로셈 */
/* 칸 너비를 px 로 고정해야 받아올림 줄(작은 글씨)도 같은 자리에 선다 */
.vsum{--cw:clamp(22px,4.6vmin,31px);--dw:13px;--ow:20px;
  display:inline-flex;flex-direction:column;gap:2px;font-family:var(--f-num);font-weight:700;
  background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.vrow{display:flex;align-items:flex-end;justify-content:flex-end}
.vrow .op{width:var(--ow);text-align:center;color:var(--muted);font-size:clamp(24px,5vmin,34px);line-height:1.25}
.vrow .cell{width:var(--cw);text-align:center;font-size:clamp(24px,5vmin,34px);line-height:1.25}
.vrow .cell.dot{width:var(--dw);color:var(--signal)}
.vrow .cell.pad{color:var(--muted);opacity:.65}
.vrow .cell.blank{color:transparent}
.vrow.carry{height:18px}
.vrow.carry .op,.vrow.carry .cell{font-size:13px;color:var(--signal);line-height:1}
.vline{height:3px;background:var(--ink);margin:3px 0}
.vsum .unit{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);text-align:right;margin-top:4px}

/* 선로 맞추기 */
.slots{display:flex;flex-direction:column;gap:4px;align-items:center;font-family:var(--f-num);font-weight:700}
.srow{display:flex;gap:3px}
.scell{width:clamp(34px,7.5vmin,50px);height:clamp(44px,9vmin,62px);display:grid;place-items:center;
  border:2px solid var(--line);border-radius:7px;background:var(--panel2);font-size:clamp(20px,4.4vmin,30px)}
.scell.empty{border-style:dotted;opacity:.5}
.scell.dotc{color:var(--signal)}
.srow.moving .scell{border-color:var(--signal);background:var(--panel)}
.srow.locked .scell{border-color:var(--rail)}
.shift{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:4px}
.shift .btn{min-width:72px}
.aimline{text-align:center;font-size:15px;color:var(--muted)}
.aimline b{color:var(--signal)}

/* 노선도 */
.routefig{display:block;width:100%;height:auto}
.routefig .ln{stroke:var(--rail);stroke-width:6;stroke-linecap:round}
.routefig .st{fill:var(--panel);stroke:var(--rail);stroke-width:4}
.routefig .nm{fill:var(--ink);font-family:var(--f-body);font-weight:700;font-size:15px}
.routefig .dist{fill:var(--signal);font-family:var(--f-num);font-weight:700;font-size:17px}
.routefig .brace{stroke:var(--signal);stroke-width:2.5;fill:none}

/* 선택지 */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ch{min-height:92px;background:var(--panel2);border:3px solid var(--line);border-radius:12px;font-family:var(--f-num);font-weight:700;font-size:clamp(26px,5.4vmin,38px);display:flex;align-items:center;justify-content:center;padding:8px;line-height:1.1;text-align:center}
.ch:active{border-color:var(--signal);transform:translateY(2px)}
.ch.no{opacity:.4;border-style:dashed;border-color:var(--bad)}
.ch.yes{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hintline{font-size:15px;color:var(--muted);text-align:center}

/* 해설 */
.sol{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sol-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:20px}
.sol-h .pill{font-family:var(--f-body);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:13px;counter-reset:s}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:start}
.step::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rail);color:var(--rail-ink);font-weight:700;font-size:17px}
.step .sb{min-width:0}
.step h3{font-weight:800;font-size:17px;margin-bottom:2px}
.step p{font-size:16px;line-height:1.55}
.step b{color:var(--signal)}
.step .num{font-family:var(--f-num);font-weight:700}
.eqn{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-family:var(--f-num);font-weight:700;font-size:clamp(20px,4.2vmin,28px);line-height:1.2;margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.fig{margin-top:9px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.fig.col{flex-direction:column;align-items:flex-start}
.tw{overflow-x:auto;margin-top:9px;border-radius:8px;border:1px solid var(--line)}
table.pv{border-collapse:collapse;width:100%;min-width:290px;font-size:15px}
table.pv th,table.pv td{border:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap}
table.pv th{background:var(--panel2);font-size:13px;color:var(--muted);font-weight:700}
table.pv td{font-family:var(--f-num);font-weight:700;font-size:19px}
table.pv td.lab{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);text-align:right}
table.pv .hi{background:color-mix(in srgb,var(--signal) 15%,transparent);color:var(--signal)}
table.pv .dim{color:var(--muted);opacity:.6}

/* 결과 */
#result{overflow-y:auto}
.res{max-width:640px;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.res-top{display:flex;align-items:center;gap:14px}
#rface{width:120px;flex:none}
#rface svg{display:block;width:100%;height:auto}
.bigstars{font-size:clamp(42px,10vw,62px);letter-spacing:5px;line-height:1}
.prize{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--star);border-radius:14px;padding:12px 14px}
.prize svg{width:58px;height:58px;flex:none;display:block}
.prize b{font-family:var(--f-display);font-weight:700;font-size:21px}
.rstats{display:flex;flex-direction:column;gap:3px;font-size:17px}
.rstats b{font-family:var(--f-num);font-weight:700;font-size:22px}
.review{display:flex;flex-direction:column;gap:8px}
.review h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin-top:4px}
details.rv{border:2px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
details.rv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;font-family:var(--f-num);font-weight:700;font-size:18px}
details.rv>summary::-webkit-details-marker{display:none}
.rv-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.rv-q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-m{flex:none;font-size:19px}
.rv-m.ok{color:var(--good)}.rv-m.miss{color:var(--signal)}
.rv-open{flex:none;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
details.rv[open] .rv-open::after{content:"닫기"}
details.rv:not([open]) .rv-open::after{content:"해설"}
.rv-b{padding:0 14px 14px;border-top:2px solid var(--line);margin-top:2px;padding-top:12px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes roll{from{opacity:.4;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.shake{animation:shake .35s}
.pop{animation:roll .4s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* 파일로 직접 열 때를 위한 기본값 (아티팩트에서는 플랫폼이 넣어 주는 부분) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <div class="head">
      <div>
        <span class="tag">소수 게임 2편</span>
        <h1>소수 기차 여행</h1>
        <p class="sub">선로 위 거리를 소수로 읽고, 소수점을 맞춰 세로로 세우고, 구간을 더해 전체 거리를 구해요. 소수 한 자리 수와 두 자리 수의 덧셈을 다룹니다.</p>
      </div>
      <div class="head-r">
        <div class="coins" aria-label="코인"><span class="coin"></span><b id="coinHome">0</b></div>
        <button class="btn ghost small snd" type="button">소리 켜짐</button>
      </div>
    </div>
    <div class="book" id="book"></div>
    <div class="cards" id="cards"></div>

<script>
(function(){
'use strict';
// ==LOGIC-START==
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t}return a};
var jong=function(n){return [0,1,3,6,7,8].indexOf(Math.abs(n)%10)>=0};
var P=function(n,w,o){return jong(n)?w:o};

/* 소수는 정수로 다룬다. {v,p} 는 v / 10^p. 이 게임은 소수 둘째 자리까지만 쓴다. */
var POW=[1,10,100,1000];
function dec(v,p){return {v:v,p:p}}
function str(o){
  if(o.p===0) return ''+o.v;
  var q=POW[o.p], i=Math.floor(o.v/q), f=o.v%q, s=''+f;
  while(s.length<o.p) s='0'+s;
  return i+'.'+s;
}
function hund(o){return o.v*POW[2-o.p]}            /* 1/100 단위로 환산 */
function same(a,b){return hund(a)===hund(b)}
function norm(o){var v=o.v,p=o.p;while(p>0&&v%10===0){v=v/10;p--}return dec(v,p)}
function add(a,b){var p=Math.max(a.p,b.p);return dec(a.v*POW[p-a.p]+b.v*POW[p-b.p],p)}
function addAll(list){var r=dec(0,0),i;for(i=0;i<list.length;i++) r=add(r,list[i]);return r}
/* 숫자 뒤 조사를 마지막 자리 숫자로 고른다 ("0.45는", "0.7은") */
function josaNum(s,w,o){return jong(+s.charAt(s.length-1))?w:o}
/* 0.03으로 / 0.09로 — ㄹ 받침(1·7·8)은 '로' */
function roNum(s){var l=+s.charAt(s.length-1);return (jong(l)&&l!==1&&l!==7&&l!==8)?'으로':'로'}

/* 끝자리를 맞춰 더해 버리는 대표 실수. 0.7 + 0.45 를 0.07 + 0.45 로 보는 것 */
function misalign(a,b){
  if(a.p===b.p) return null;
  var shortOne=(a.p<b.p)?a:b, longOne=(a.p<b.p)?b:a;
  var gap=longOne.p-shortOne.p;
  var moved=dec(shortOne.v,shortOne.p+gap);        /* 0.7 → 0.07 */
  if(moved.p>2) return null;
  return add(moved,longOne);
}

/* 오답 보기. 항상 need개를 채우고 끝난다. */
function distract(ans,cands,need){
  var out=[],seen=[hund(ans)],i,k,o;
  var ok=function(x){
    if(!x||x.v<0) return false;
    if(hund(x)<=0||hund(x)>=1000) return false;    /* 0 보다 크고 10 보다 작게 */
    return seen.indexOf(hund(x))<0;
  };
  for(i=0;i<cands.length&&out.length<need;i++){
    if(ok(cands[i])){seen.push(hund(cands[i]));out.push(cands[i])}
  }
  for(k=1;out.length<need&&k<300;k++){
    o=norm(dec(ans.v+k,ans.p));
    if(ok(o)){seen.push(hund(o));out.push(o);continue}
    o=norm(dec(ans.v-k,ans.p));
    if(ok(o)){seen.push(hund(o));out.push(o)}
  }
  return out;
}

/* ---- 그림 ---- */
/* 선로. lo~hi 를 divs 칸으로 나누고, mark 번째 눈금에 기차를 세운다 (hund 단위) */
function track(lo,hi,divs,mark,o){
  o=o||{};
  var x0=52,x1=588,W=x1-x0,y=96;
  var px=function(i){return x0+W*i/divs};
  var h='<svg class="trk" viewBox="0 0 640 '+(o.tall?150:140)+'" role="img" aria-label="선로 거리 눈금"'
    +(o.interactive?' data-divs="'+divs+'" tabindex="0"':'')+'>';
  if(o.interactive) h+='<rect class="hit" x="0" y="0" width="640" height="140"/>';
  /* 침목과 레일 */
  h+='<rect class="bed" x="'+(x0-26)+'" y="'+(y+6)+'" width="'+(W+52)+'" height="9" rx="4" opacity=".5"/>';
  var t;
  for(t=0;t<=divs;t++) h+='<line class="tie" x1="'+px(t).toFixed(1)+'" y1="'+(y-2)+'" x2="'+px(t).toFixed(1)+'" y2="'+(y+16)+'" opacity=".45"/>';
  h+='<line class="rail" x1="'+(x0-26)+'" y1="'+y+'" x2="'+(x1+26)+'" y2="'+y+'"/>';
  h+='<line class="rail" x1="'+(x0-26)+'" y1="'+(y+12)+'" x2="'+(x1+26)+'" y2="'+(y+12)+'"/>';
  /* 눈금 */
  for(t=0;t<=divs;t++){
    var X=px(t).toFixed(1), val=lo+(hi-lo)*t/divs, isEnd=(t===0||t===divs);
    var isWhole=(val%100===0);
    var big=isEnd||isWhole;
    h+='<line class="tick'+(big?' big':'')+'" x1="'+X+'" y1="'+(big?y-30:y-18)+'" x2="'+X+'" y2="'+(y-2)+'"/>';
    if(big){
      var lv=norm(dec(Math.round(val),2));
      h+='<text class="lab" x="'+X+'" y="'+(y+40)+'" text-anchor="middle">'+str(lv)+'</text>';
    }else h+='<circle class="dot" cx="'+X+'" cy="'+(y-2)+'" r="3"/>';
  }
  /* 기차 */
  if(mark!=null){
    var M=px(mark);
    h+='<line class="mline" x1="'+M.toFixed(1)+'" y1="'+(y-72)+'" x2="'+M.toFixed(1)+'" y2="'+(y-2)+'"/>';
    h+='<g class="train" transform="translate('+(M-26).toFixed(1)+','+(y-70)+')">'
      +'<rect x="0" y="0" width="52" height="30" rx="7"/>'
      +'<rect class="win" x="7" y="6" width="14" height="11" rx="2.5"/>'
      +'<rect class="win" x="26" y="6" width="19" height="11" rx="2.5"/>'
      +'<circle cx="13" cy="33" r="5"/><circle cx="39" cy="33" r="5"/></g>';
    if(o.markText) h+='<text class="mtext" x="'+M.toFixed(1)+'" y="'+(y-78)+'" text-anchor="middle">'+o.markText+'</text>';
  }
  h+='<text class="lab sm" x="'+(x1+30)+'" y="'+(y+40)+'">km</text>';
  return h+'</svg>';
}
/* 확대한 구간이 전체 어디인지 보여 주는 작은 띠 */
function zoomBar(lo,hi){
  var x0=14,x1=246,W=x1-x0;
  var a=x0+W*lo/100, b=x0+W*hi/100;
  return '<div class="zoomline"><svg class="zb" viewBox="0 0 260 44" role="img" aria-label="확대한 구간 위치">'
    +'<line class="base" x1="'+x0+'" y1="22" x2="'+x1+'" y2="22"/>'
    +'<line class="seg" x1="'+a.toFixed(1)+'" y1="22" x2="'+b.toFixed(1)+'" y2="22"/>'
    +'<text class="t" x="'+x0+'" y="40" text-anchor="middle">0</text>'
    +'<text class="t" x="'+x1+'" y="40" text-anchor="middle">1</text>'
    +'</svg><span>0과 1 사이의 '+str(norm(dec(lo,2)))+' ~ '+str(norm(dec(hi,2)))+' 구간을 크게 펼친 거예요</span></div>';
}
/* 세로셈. rows = [{o, sign, padTo}], sum 은 마지막 줄 */
function vsum(rows,sumO,o){
  o=o||{};
  var width=2;                                  /* 소수점 아래 칸 수 */
  var i;
  for(i=0;i<rows.length;i++) if(rows[i].o.p>width-2) width=Math.max(width,rows[i].o.p);
  var frac=0;
  for(i=0;i<rows.length;i++) frac=Math.max(frac,rows[i].o.p);
  if(sumO) frac=Math.max(frac,sumO.p);
  var intLen=1;
  for(i=0;i<rows.length;i++) intLen=Math.max(intLen,(''+Math.floor(rows[i].o.v/POW[rows[i].o.p])).length);
  if(sumO) intLen=Math.max(intLen,(''+Math.floor(sumO.v/POW[sumO.p])).length);
  var line=function(num,sign,cls){
    var s='<div class="vrow'+(cls?' '+cls:'')+'"><span class="op">'+(sign||'')+'</span>';
    var ip=''+Math.floor(num.v/POW[num.p]);
    while(ip.length<intLen) ip=' '+ip;
    var j;
    for(j=0;j<ip.length;j++) s+='<span class="cell'+(ip.charAt(j)===' '?' blank':'')+'">'+(ip.charAt(j)===' '?'0':ip.charAt(j))+'</span>';
    s+='<span class="cell dot">.</span>';
    var fs=''+(num.v%POW[num.p]);
    while(fs.length<num.p) fs='0'+fs;
    for(j=0;j<frac;j++){
      if(j<num.p) s+='<span class="cell">'+fs.charAt(j)+'</span>';
      else s+='<span class="cell pad">0</span>';
    }
    return s+'</div>';
  };
  var h='<div class="vsum">';
  if(o.carry){
    h+='<div class="vrow carry"><span class="op"></span>';
    var cs=o.carry;                              /* 왼쪽부터 intLen + 1(소수점) + frac 칸 */
    for(i=0;i<cs.length;i++){
      var isDot=(i===intLen);
      h+='<span class="cell'+(isDot?' dot':'')+(cs.charAt(i)===' '?' blank':'')+'">'+(cs.charAt(i)===' '?'1':cs.charAt(i))+'</span>';
    }
    h+='</div>';
  }
  for(i=0;i<rows.length;i++) h+=line(rows[i].o,rows[i].sign||'',rows[i].cls);
  h+='<div class="vline"></div>';
  if(sumO) h+=line(sumO,'','sum');
  if(o.unit!==false) h+='<div class="unit">단위: km</div>';
  return h+'</div>';
}
/* 자릿값 표 */
var PLACE2=['일의 자리','소수 첫째 자리','소수 둘째 자리'];
function pvRows(list,names){
  var h='<div class="tw"><table class="pv"><thead><tr><th></th>',k,i;
  for(k=0;k<=2;k++) h+='<th>'+PLACE2[k]+'</th>';
  h+='</tr></thead><tbody>';
  for(i=0;i<list.length;i++){
    h+='<tr><td class="lab">'+(names&&names[i]?names[i]:str(list[i]))+'</td>';
    for(k=0;k<=2;k++){
      var d=Math.floor(hund(list[i])/POW[2-k])%10;
      var inside=(k<=list[i].p);
      h+='<td class="'+(inside?'':'dim')+'">'+d+'</td>';
    }
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}
/* 노선도 */
var STNAMES=['햇빛역','바람역','별빛역','숲속역','바다역','노을역','달빛역'];
function routeFig(names,dists,o){
  o=o||{};
  var n=names.length, x0=46, x1=594, W=x1-x0, y=56;
  var px=function(i){return x0+W*i/(n-1)};
  var h='<svg class="routefig" viewBox="0 0 640 '+(o.total?128:104)+'" role="img" aria-label="기차 노선도">';
  h+='<line class="ln" x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'"/>';
  var i;
  for(i=0;i<n-1;i++){
    var mx=(px(i)+px(i+1))/2;
    h+='<text class="dist" x="'+mx.toFixed(1)+'" y="'+(y-14)+'" text-anchor="middle">'+str(dists[i])+' km</text>';
  }
  for(i=0;i<n;i++){
    h+='<circle class="st" cx="'+px(i).toFixed(1)+'" cy="'+y+'" r="9"/>';
    h+='<text class="nm" x="'+px(i).toFixed(1)+'" y="'+(y+30)+'" text-anchor="middle">'+names[i]+'</text>';
  }
  if(o.total){
    h+='<path class="brace" d="M'+x0+' '+(y+48)+' v10 H'+x1+' v-10"/>';
    h+='<text class="dist" x="'+((x0+x1)/2).toFixed(1)+'" y="'+(y+76)+'" text-anchor="middle">'+o.total+'</text>';
  }
  return h+'</svg>';
}

/* ---- 문제 만들기 ---- */
/* 1. 거리 표지판 — 선로에서 소수 한 자리·두 자리 읽기 */
function genTrack(lv){
  var lo,hi,divs,markIdx,val,q,mode;
  mode=(Math.random()<.55)?'read':'place';
  if(lv===1){
    lo=0;hi=100;divs=10;markIdx=rnd(1,9);
  }else if(lv===2){
    var seg=rnd(0,9);
    lo=seg*10;hi=seg*10+10;divs=10;markIdx=rnd(1,9);
  }else{
    var span=pick([2,3]);
    lo=0;hi=span*100;divs=span*10;
    do{markIdx=rnd(1,divs-1)}while(markIdx%10===0);
  }
  val=norm(dec(lo+(hi-lo)*markIdx/divs,2));
  q={type:'track',lv:lv,lo:lo,hi:hi,divs:divs,mark:markIdx,val:val,mode:mode,key:'t'+lv+mode+hund(val)};
  var unitStep=norm(dec((hi-lo)/divs,2));
  q.label=(mode==='read'?'표지판 읽기 ':'기차 세우기 ')+str(val)+' km';
  if(mode==='read'){
    q.question='기차는 몇 km 지점에 서 있을까요?';
    var cands=[];
    cands.push(norm(dec(hund(val)+hund(unitStep),2)));
    cands.push(norm(dec(hund(val)-hund(unitStep),2)));
    if(val.p===2) cands.push(norm(dec(val.v,1)));
    if(val.p===1) cands.push(norm(dec(val.v,2)));
    cands.push(norm(dec(hund(val)+10,2)));
    q.choices=shuffle([{o:val,correct:true}].concat(
      distract(val,cands,2).map(function(x){return {o:x,correct:false}})));
  }else{
    q.question='이 거리에 기차를 세워 주세요. 눈금을 누르면 돼요.';
  }
  q.steps=[
    {t:'한 칸이 얼마인지부터',b:'<p>'+str(norm(dec(lo,2)))+'부터 '+str(norm(dec(hi,2)))+'까지를 똑같이 <b>'+divs+'칸</b>으로 나눴어요. '
      +'그래서 작은 한 칸이 <b>'+str(unitStep)+' km</b>예요.</p>'
      +(lv===2?zoomBar(lo,hi):'')},
    {t:'몇 칸 갔는지 세요',b:'<p>'+str(norm(dec(lo,2)))+'에서 '+str(unitStep)+'씩 <b>'+markIdx+'칸</b> 더 간 자리예요.</p>'
      +'<span class="eqn">'+str(norm(dec(lo,2)))+' + '+str(unitStep)+' × '+markIdx+' = '+str(val)+'</span>'},
    {t:'여기예요',b:'<p>기차가 선 곳은 <span class="num">'+str(val)+' km</span> 지점이에요.</p>',
     fig:'<div class="fig col"><div class="trackwrap">'+track(lo,hi,divs,markIdx,{markText:str(val)})+'</div></div>',reveal:true}
  ];
  return q;
}

/* 2. 선로 맞추기 — 소수점을 맞춰 세로로 세우기 */
function genAlign(lv){
  var a,b,q;
  if(lv===1){
    a=dec(rnd(1,8),1);b=dec(rnd(1,8),1);
  }else if(lv===2){
    a=dec(rnd(1,9),1);b=dec(rnd(11,89),2);
    if(b.v%10===0) b=dec(b.v+rnd(1,9),2);
    if(Math.random()<.5){var t=a;a=b;b=t}
  }else{
    a=dec(rnd(10,49),1);                        /* 1.0 ~ 4.9 */
    if(a.v%10===0) a=dec(a.v+rnd(1,9),1);
    b=dec(rnd(11,99),2);
    if(b.v%10===0) b=dec(b.v+rnd(1,9),2);
    if(Math.random()<.5){var t2=a;a=b;b=t2}
  }
  /* 칸 배치: 소수점이 slotDot 번 칸에 오도록 위 수를 고정하고, 아래 수를 민다 */
  var SLOTS=6, slotDot=2;
  var topS=str(a), botS=str(b);
  var topDot=topS.indexOf('.'), botDot=botS.indexOf('.');
  var topOff=slotDot-topDot;
  var want=slotDot-botDot;
  if(topOff<0||topOff+topS.length>SLOTS||want<0||want+botS.length>SLOTS){
    /* 자리에 안 들어가면 간단한 조합으로 다시 */
    a=dec(rnd(1,9),1);b=dec(rnd(11,89),2);
    topS=str(a);botS=str(b);topDot=topS.indexOf('.');botDot=botS.indexOf('.');
    topOff=slotDot-topDot;want=slotDot-botDot;
  }
  var maxOff=SLOTS-botS.length;
  q={type:'align',lv:lv,a:a,b:b,topS:topS,botS:botS,slots:SLOTS,topOff:topOff,want:want,maxOff:maxOff,
     key:'al'+hund(a)+'_'+hund(b)};
  q.question='두 거리를 더하려고 해요. <b>소수점이 세로로 한 줄</b>이 되도록 아래 수를 옮겨 주세요.';
  q.label=str(a)+' + '+str(b)+' 자리 맞추기';
  var sumO=add(a,b);
  var wrong=misalign(a,b);
  q.steps=[
    {t:'소수점부터 맞춰요',b:'<p>소수의 덧셈은 <b>소수점끼리 세로로 맞추는 것</b>이 먼저예요. 끝자리를 맞추면 안 돼요.</p>'
      +'<p style="margin-top:6px">일의 자리는 일의 자리끼리, 소수 첫째 자리는 첫째 자리끼리 만나야 하니까요.</p>',
     fig:'<div class="fig">'+vsum([{o:a},{o:b,sign:'+'}],null,{unit:false})+'</div>'},
    (a.p!==b.p
      ? {t:'빈 자리에는 0을 채워요',b:'<p>'+str(a.p<b.p?a:b)+josaNum(str(a.p<b.p?a:b),'은','는')+' 소수 둘째 자리가 비어 있어요. '
          +'거기에 <b>0</b>을 적으면 길이가 같아져서 더하기 쉬워요. '+str(a.p<b.p?a:b)+' = '
          +str(dec(hund(a.p<b.p?a:b),2))+' 이니까 값은 그대로예요.</p>'}
      : {t:'자릿수가 같으면 그대로',b:'<p>두 수 모두 소수 '+(a.p===1?'첫째':'둘째')+' 자리까지 있어서 그대로 세우면 돼요.</p>'}),
    {t:'이렇게 세워요',b:'<p>소수점이 한 줄로 서면 자리가 저절로 맞아요. 답은 '+str(norm(sumO))+' km예요.</p>',
     fig:'<div class="fig">'+vsum([{o:a},{o:b,sign:'+'}],sumO)+'</div>',reveal:true}
  ];
  if(wrong){
    var shortN=str(a.p<b.p?a:b), slipN=str(dec((a.p<b.p?a:b).v,2)), wrongN=str(norm(wrong));
    q.steps.push({t:'끝을 맞추면 이렇게 틀려요',b:'<p>끝자리를 맞춰 쓰면 '+shortN+josaNum(shortN,'을','를')
      +' <b>'+slipN+'</b>'+roNum(slipN)+' 읽은 셈이 돼요. 그러면 답이 '+wrongN+josaNum(wrongN,'이','가')
      +' 나와서 완전히 달라져요.</p>',reveal:true});
  }
  return q;
}

/* 3. 기관실 계산 — 소수의 덧셈 */
function genAdd(lv){
  var a,b,sum,q,guard=0;
  do{
    guard++;
    if(lv===1){
      var d1=rnd(1,8); a=dec(d1,1); b=dec(rnd(1,9-d1),1);     /* 받아올림 없음 */
    }else if(lv===2){
      if(Math.random()<.5){ var e1=rnd(2,9); a=dec(e1,1); b=dec(rnd(11-e1,9),1); }  /* 1 넘김 */
      else { a=dec(rnd(11,89),2); b=dec(rnd(11,89),2); }
    }else{
      if(Math.random()<.55){ a=dec(rnd(1,9),1); b=dec(rnd(11,89),2); }
      else { a=dec(rnd(10,39),1); b=dec(rnd(11,99),2); }
      if(Math.random()<.5){var t=a;a=b;b=t}
    }
    sum=add(a,b);
  }while(guard<60&&(hund(sum)>=1000||hund(sum)<=0));
  var ansO=norm(sum);
  q={type:'add',lv:lv,a:a,b:b,sum:sum,ans:ansO,key:'ad'+hund(a)+'_'+hund(b)};
  q.question='두 거리를 더하면 모두 몇 km일까요?';
  q.label=str(a)+' + '+str(b);
  var cands=[],mis=misalign(a,b);
  if(mis) cands.push(norm(mis));
  /* 받아올림을 빠뜨린 답 */
  var p=Math.max(a.p,b.p), av=a.v*POW[p-a.p], bv=b.v*POW[p-b.p];
  var noCarry=0,mul=1,k;
  for(k=0;k<p+1;k++){
    var da=Math.floor(av/POW[k])%10, db=Math.floor(bv/POW[k])%10;
    noCarry+=((da+db)%10)*mul; mul*=10;
  }
  /* 음수가 되는 후보는 distract 가 알아서 걸러 낸다 */
  cands.push(norm(dec(noCarry,p)));
  cands.push(norm(dec(sum.v+POW[p],p)));
  cands.push(dec(sum.v-1,p));
  cands.push(dec(sum.v+1,p));
  cands.push(dec(sum.v-POW[p],p));
  q.choices=shuffle([{o:ansO,correct:true}].concat(
    distract(ansO,cands,2).map(function(x){return {o:x,correct:false}})));
  /* 받아올림 표시 문자열 만들기 */
  var intLen=Math.max((''+Math.floor(a.v/POW[a.p])).length,(''+Math.floor(b.v/POW[b.p])).length,(''+Math.floor(sum.v/POW[sum.p])).length);
  var carryStr='',pos,anyCarry=false,carrySet={};
  var cv=0;
  for(k=0;k<p;k++){
    var da2=Math.floor(av/POW[k])%10, db2=Math.floor(bv/POW[k])%10;
    var s2=da2+db2+cv;
    cv=s2>=10?1:0;
    if(cv) carrySet[k+1]=true;
  }
  var totalCells=intLen+1+p;
  for(pos=0;pos<totalCells;pos++){
    var kIdx=null;                               /* 이 칸이 가리키는 자리 (0 = 가장 작은 소수 자리) */
    if(pos<intLen) kIdx=p+(intLen-1-pos);
    else if(pos>intLen) kIdx=p-(pos-intLen);
    if(kIdx!==null&&carrySet[kIdx]){carryStr+='1';anyCarry=true}
    else carryStr+=' ';
  }
  q.steps=[
    {t:'소수점을 맞춰 세워요',b:'<p>소수점끼리 세로로 한 줄이 되게 씁니다.'
      +(a.p!==b.p?' 짧은 쪽 빈 자리에는 <b>0</b>을 채워요.':'')+'</p>',
     fig:'<div class="fig">'+vsum([{o:a},{o:b,sign:'+'}],null,{unit:false})+'</div>'},
    {t:'끝자리부터 더해요',b:'<p>자연수 덧셈과 똑같이 <b>오른쪽 끝자리부터</b> 더하고,'
      +(anyCarry?' 10이 넘으면 윗자리로 <b>1을 올려</b>요.':' 올릴 것이 없으면 그대로 적어요.')+'</p>'
      +'<span class="eqn">'+str(a)+' + '+str(b)+' = '+str(norm(sum))+'</span>'},
    {t:'소수점은 그대로 내려요',b:'<p>답의 소수점은 <b>위에 맞춰 둔 자리 그대로</b> 내려 찍어요.'
      +(hund(ansO)%10===0&&sum.p===2?' 소수점 아래 끝의 0은 쓰지 않아서 '+str(norm(sum))+'이라고 씁니다.':'')+'</p>',
     fig:'<div class="fig">'+vsum([{o:a},{o:b,sign:'+'}],sum,{carry:anyCarry?carryStr:null})+'</div>',reveal:true}
  ];
  return q;
}

/* 4. 여행 계획 — 노선 구간 더하기 */
function genRoute(lv){
  var n=(lv===3?4:3), dists=[],i,q,guard=0;
  do{
    guard++;dists=[];
    for(i=0;i<n-1;i++){
      if(lv===1) dists.push(dec(rnd(1,9),1));
      else if(lv===2) dists.push(i===0?dec(rnd(1,9),1):dec(rnd(11,89),2));
      else dists.push(Math.random()<.5?dec(rnd(1,9),1):dec(rnd(11,89),2));
    }
    if(lv===2&&Math.random()<.5) dists.reverse();
    var s=addAll(dists);
    if(hund(s)>0&&hund(s)<1000) break;
  }while(guard<60);
  var sum=addAll(dists), ansO=norm(sum);
  var names=shuffle(STNAMES).slice(0,n);
  q={type:'route',lv:lv,dists:dists,names:names,sum:sum,ans:ansO,
     key:'ro'+dists.map(function(d){return hund(d)}).join('_')};
  q.question=names[0]+'에서 '+names[n-1]+'까지 모두 몇 km일까요?';
  q.label=names[0]+'→'+names[n-1]+' '+dists.map(function(d){return str(d)}).join('+');
  /* 아이들이 자주 하는 실수: 한 구간을 빼먹거나, 끝자리를 맞춰 더하거나 */
  var cands=[];
  var mis=misalign(dists[0],dists[1]);
  if(mis){
    var rest=dists.slice(2);
    cands.push(norm(rest.length?add(mis,addAll(rest)):mis));
  }
  for(i=0;i<dists.length;i++) cands.push(norm(dec(hund(sum)-hund(dists[i]),2)));
  cands.push(dec(sum.v+POW[sum.p],sum.p));
  cands.push(dec(sum.v-POW[sum.p],sum.p));
  cands.push(dec(sum.v+1,sum.p));
  cands.push(dec(sum.v-1,sum.p));
  q.choices=shuffle([{o:ansO,correct:true}].concat(
    distract(ansO,cands,2).map(function(x){return {o:x,correct:false}})));
  var rows=dists.map(function(d,ix){return {o:d,sign:ix?'+':''}});
  q.steps=[
    {t:'구간을 모두 찾아요',b:'<p>'+names[0]+'에서 '+names[n-1]+'까지 가려면 구간 <b>'+(n-1)+'개</b>를 모두 지나야 해요. '
      +'그래서 구간 거리를 <b>전부 더하면</b> 돼요.</p>',
     fig:'<div class="fig col">'+routeFig(names,dists)+'</div>'},
    {t:'소수점을 맞춰 세워요',b:'<p>'+dists.map(function(d){return str(d)}).join(' + ')+' 를 세로로 쓸 때도 소수점을 한 줄로 맞춰요.</p>',
     fig:'<div class="fig">'+vsum(rows,null,{unit:false})+'</div>'},
    {t:'더하면',b:'<p>모두 <span class="num">'+str(ansO)+' km</span>예요.</p>',
     fig:'<div class="fig">'+vsum(rows,sum)+'</div>',reveal:true}
  ];
  return q;
}

var AC=null;
function tone(seq){
  if(!save.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var t0=AC.currentTime;
    seq.forEach(function(s){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='square';o.frequency.value=s[0];
      g.gain.setValueAtTime(0.0001,t0+s[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t0+s[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+s[1]+s[2]);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+s[1]);o.stop(t0+s[1]+s[2]+0.05);
    });
  }catch(e){}
}

}
function renderSol(full,won){
  var steps=G.q.steps.filter(function(s){return full||!s.reveal});
  if(!steps.length){$('#sol').hidden=true;return}
  $('#sol').hidden=false;
  var head=full?(won?'정답! 왜 그런지 같이 볼까요':'해설'):'힌트';
  var pill=full?(won?'맞혀도 해설은 꼭 보기':'끝까지 같이 풀어 봐요'):'여기까지만 알려줄게요';
  $('#sol').innerHTML='<div class="sol-h"><span>'+head+'</span><span class="pill">'+pill+'</span></div>'+stepsHTML(steps);
}
function hideSol(){$('#sol').hidden=true;$('#sol').innerHTML=''}

function nextQ(){
  G.done=false;G.wrong=0;G.pos=null;
  G.loco=(G.i+rnd(0,4))%5;
  var q,tries=0;
  do{q=GENS[G.mode](G.lv);tries++}while(G.used[q.key]&&tries<60);
  G.used[q.key]=1;G.q=q;
  if(q.type==='align'){ do{G.off=rnd(0,q.maxOff)}while(q.maxOff>0&&G.off===q.want); }
  setFace('idle');fb('');hideSol();
  $('#next').hidden=true;
  $('#hintBtn').hidden=false;
  var needCheck=(q.type==='align')||(q.type==='track'&&q.mode==='place');
  $('#check').hidden=!needCheck;
  $('#check').textContent=(q.type==='align')?'이렇게 세울래요!':'여기 세울래요!';
  renderQ();renderPips();paintCoins();
}
function choicesHTML(q,unit){
  return '<div class="choices">'+q.choices.map(function(c,i){
    return '<button class="ch" type="button" data-ans="'+i+'">'+str(c.o)+(unit?'<span style="font-size:.5em;color:var(--muted)">&nbsp;km</span>':'')+'</button>';
  }).join('')+'</div>';
}
function slotRows(){
  var q=G.q,i,h='<div class="slots">';
  var row=function(s,off,cls){
    var r='<div class="srow '+cls+'">',j;
    for(j=0;j<q.slots;j++){
      var ch=(j>=off&&j<off+s.length)?s.charAt(j-off):'';
      r+='<span class="scell'+(ch===''?' empty':'')+(ch==='.'?' dotc':'')+'">'+ch+'</span>';
    }
    return r+'</div>';
  };
  h+=row(q.topS,q.topOff,'locked');
  h+=row(q.botS,G.off,'moving');
  return h+'</div>';
}
function renderQ(){
  var q=G.q,say='',h='';
  if(q.type==='track'){
    say=q.question;
    if(q.mode==='read'){
      h='<div class="trackwrap">'+track(q.lo,q.hi,q.divs,q.mark)+'</div>'
        +(q.lv===2?zoomBar(q.lo,q.hi):'')+choicesHTML(q,true);
    }else{
      h='<div class="slip"><div class="slip-l"><b>운행 지시</b>이 지점에 세우세요</div><div class="slip-v">'+str(q.val)+'<span class="u">km</span></div></div>'
        +'<div class="trackwrap tap" id="tw">'+track(q.lo,q.hi,q.divs,null,{interactive:true})+'</div>'
        +(q.lv===2?zoomBar(q.lo,q.hi):'')
        +'<div class="hintline" id="th">아직 세우지 않았어요</div>';
    }
  }else if(q.type==='align'){
    say=q.question;
    h='<div class="slip"><div class="slip-l"><b>자리 맞추기</b>소수점을 한 줄로</div><div class="slip-v">'+str(q.a)+' + '+str(q.b)+'</div></div>'
      +'<div id="sl">'+slotRows()+'</div>'
      +'<div class="shift"><button class="btn ghost" id="shl" type="button" aria-label="왼쪽으로">◀</button>'
      +'<button class="btn ghost" id="shr" type="button" aria-label="오른쪽으로">▶</button></div>'
      +'<div class="aimline">아래 줄의 <b>소수점</b>이 위 줄의 소수점 바로 밑에 오게 하세요</div>';
  }else if(q.type==='add'){
    say=q.question;
    h='<div class="slip"><div class="slip-l"><b>운행 거리</b>두 구간을 더하면</div>'
      +'<div class="slip-v">'+str(q.a)+' + '+str(q.b)+' <span class="q">= ?</span><span class="u">km</span></div></div>'
      +choicesHTML(q,true);
  }else{
    say=q.question;
    h='<div class="slip"><div class="slip-l"><b>여행 계획서</b>'+q.names[0]+' → '+q.names[q.names.length-1]+'</div>'
      +'<div class="slip-v"><span class="q">? </span><span class="u">km</span></div></div>'
      +routeFig(q.names,q.dists)+choicesHTML(q,true);
  }
  $('#say').innerHTML=say;
  $('#desk').innerHTML=h;
}

function reveal(){
  renderSol(true,false);
  var q=G.q;
  if(q.type==='align'){
    G.off=q.want;
    $('#sl').innerHTML=slotRows();
    $('#shl').disabled=true;$('#shr').disabled=true;
    $('.aimline').textContent='소수점이 한 줄로 섰어요.';
  }else if(q.type==='track'&&q.mode==='place'){
    $('#tw').innerHTML=track(q.lo,q.hi,q.divs,q.mark,{markText:str(q.val)});
    $('#tw').classList.remove('tap');
    $('#th').textContent='정답 위치에 기차를 세웠어요';
  }else{
    $$('#desk .ch').forEach(function(b,i){
      var ok=!!(q.choices[i]&&q.choices[i].correct);
      b.classList.toggle('yes',ok);
      if(!ok) b.classList.add('no');
      b.disabled=true;
    });
  }
  $('#check').hidden=true;$('#hintBtn').hidden=true;
  var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 문제';
}

function answer(ok,btn){
  if(G.done) return;
  if(ok){
    G.done=true;
    var firstTry=(G.wrong===0),gain=0;
    if(firstTry){G.first++;G.streak++;gain=10+(G.streak>=3?5:0);G.results[G.i]='ok'}
    else{G.streak=0;G.results[G.i]='miss'}
    G.earned+=gain;save.coins+=gain;persist();
    setFace('happy');
    fb(GOOD[rnd(0,GOOD.length-1)]+(gain?'  +'+gain+' 코인':''),'good');
    tone(SND.good);
    if(btn) btn.classList.add('yes');
    $$('#desk .ch').forEach(function(b){
      b.disabled=true;
      if(btn&&b!==btn&&!b.classList.contains('yes')) b.classList.add('no');
    });
    if($('#shl')){$('#shl').disabled=true;$('#shr').disabled=true}
    renderSol(true,true);
    $('#sol').classList.remove('pop');void $('#sol').offsetWidth;$('#sol').classList.add('pop');
    $('#check').hidden=true;$('#hintBtn').hidden=true;
    var nx=$('#next');nx.hidden=false;nx.textContent=(G.i+1>=G.total)?'결과 보기':'다음 문제';
    var cw=$('#coinPlay').parentNode;cw.classList.remove('bump');void cw.offsetWidth;cw.classList.add('bump');
    paintCoins();renderPips();
    G.log[G.i]={label:G.q.label,ok:firstTry,steps:G.q.steps};
  }else{
    G.wrong++;G.streak=0;G.results[G.i]='miss';
    setFace('oops');
    fb(OOPS[rnd(0,OOPS.length-1)],'bad');
    tone(SND.bad);
    if(btn){btn.classList.add('no');btn.disabled=true;btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake')}
    if(G.wrong>=2){
      G.done=true;
      fb('같이 풀어 봐요. 아래 해설을 보세요.','bad');
      reveal();
      G.log[G.i]={label:G.q.label,ok:false,steps:G.q.steps};
    }else{
      renderSol(false,false);
    }
    renderPips();
  }
}

/* 조작 */
function shiftBot(d){
  var q=G.q,n=G.off+d;
  if(n<0||n>q.maxOff) return;
  G.off=n;
  $('#sl').innerHTML=slotRows();
  tone(SND.tick);
}
function setPos(i,byKey){
  var q=G.q;
  G.pos=i;
  $('#tw').innerHTML=track(q.lo,q.hi,q.divs,i,{interactive:true});
  $('#th').textContent='여기에 세웠어요 — 맞으면 "여기 세울래요!"를 눌러요';
  if(byKey){var s=document.querySelector('#tw .trk');if(s) s.focus()}
  tone(SND.tap);
}
function trackIndex(svg,clientX){
  var r=svg.getBoundingClientRect(), divs=+svg.getAttribute('data-divs');
  var vx=((clientX-r.left)/r.width)*640;
  var i=Math.round((vx-52)/536*divs);
  return Math.max(0,Math.min(divs,i));
}

$('#cards').addEventListener('click',function(e){
  var b=e.target.closest('.lv');if(!b) return;
  startGame(b.getAttribute('data-mode'),+b.getAttribute('data-lv'));
});
$('#desk').addEventListener('click',function(e){
  if(!G||G.done) return;
  var q=G.q;
  if(e.target.closest('#shl')){shiftBot(-1);return}
  if(e.target.closest('#shr')){shiftBot(1);return}
  var svg=e.target.closest('.trk[data-divs]');
  if(svg&&q.type==='track'&&q.mode==='place'){setPos(trackIndex(svg,e.clientX));return}
  var ch=e.target.closest('.ch');
  if(!ch||ch.disabled) return;
  answer(!!q.choices[+ch.getAttribute('data-ans')].correct,ch);
});
$('#desk').addEventListener('keydown',function(e){
  if(!G||G.done) return;
  var svg=e.target.closest('.trk[data-divs]');
  if(svg&&G.q.type==='track'&&G.q.mode==='place'){
    var divs=+svg.getAttribute('data-divs'),cur=G.pos==null?0:G.pos;
    if(e.key==='ArrowRight'){e.preventDefault();setPos(Math.min(divs,cur+1),true)}
    else if(e.key==='ArrowLeft'){e.preventDefault();setPos(Math.max(0,cur-1),true)}
  }
});
$('#check').addEventListener('click',function(){
  if(!G||G.done) return;
  var q=G.q;
  if(q.type==='align') answer(G.off===q.want,null);
  else{
    if(G.pos==null){fb('선로의 눈금을 눌러 기차를 세워 주세요.','');return}
    answer(G.pos===q.mark,null);
  }
});
$('#hintBtn').addEventListener('click',function(){
  if(!G||G.done) return;
  renderSol(false,false);
  $('#sol').scrollIntoView({block:'nearest',behavior:'smooth'});
});
$('#next').addEventListener('click',function(){
  if(G.i+1>=G.total){finish();return}
  G.i++;nextQ();
});

function finish(){
  var f=G.first,s=f>=7?3:(f>=5?2:1),bonus=0;
  if(s===3){bonus=20;save.coins+=bonus;G.earned+=bonus}
  var k=G.mode+G.lv;
  save.stars[k]=Math.max(save.stars[k]||0,s);
  var key=s===3?'gold':(s===2?'silver':'bronze');
  save.stamps[key]=(save.stamps[key]||0)+1;
  persist();
  $('#rTitle').textContent=s===3?'오늘의 명예 역장!':(s===2?'솜씨가 늘었어요!':'좋은 출발이에요!');
  $('#rMsg').textContent=s===3?'거의 다 첫 번에 맞혔어요. 다음 단계도 할 수 있어요.'
    :(s===2?'별 3개는 첫 번에 7문제를 맞히면 받아요.':'틀린 문제는 아래에서 해설을 다시 보면 쉬워져요.');
  $('#rStars').innerHTML=starsHTML(s);
  $('#rStars').setAttribute('aria-label','별 '+s+'개');
  $('#prize').innerHTML=stampSVG(key)+'<div><b>'+STAMP[key].n+'</b> 획득! <br><span style="color:var(--muted);font-size:15px">여행 수첩에 찍어 두었어요 (지금까지 '+save.stamps[key]+'개)</span></div>';
  $('#rFirst').textContent=f+' / '+G.total;
  $('#rCoins').textContent='+'+G.earned+(bonus?' (명예 역장 보너스 +20 포함)':'');
  $('#rface').innerHTML=loco(G.loco,'happy');
  $('#nextLv').hidden=!(s>=2&&G.lv<3);
  $('#rList').innerHTML=G.log.map(function(e,i){
    if(!e) return '';
    return '<details class="rv"><summary><span class="rv-n">'+(i+1)+'</span><span class="rv-q">'+e.label+'</span>'
      +'<span class="rv-m '+(e.ok?'ok':'miss')+'">'+(e.ok?'○':'✕')+'</span><span class="rv-open"></span></summary>'
      +'<div class="rv-b">'+stepsHTML(e.steps)+'</div></details>';
  }).join('');
  tone(SND.win);
  show('result');
}

$('#back').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#toHome').addEventListener('click',function(){G=null;renderHome();show('home')});
$('#again').addEventListener('click',function(){startGame(G.mode,G.lv)});
$('#nextLv').addEventListener('click',function(){startGame(G.mode,G.lv+1)});
$$('.snd').forEach(function(b){b.addEventListener('click',function(){save.sound=!save.sound;persist();paintSound();if(save.sound)tone(SND.tap)})});

renderHome();show('home');
})();
</script>
